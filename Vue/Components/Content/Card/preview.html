<!doctype html>
<html lang="en" class="bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevSnips — Card Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
</head>
<body class="min-h-screen bg-slate-50 p-4 text-slate-950 sm:p-8 dark:bg-slate-950 dark:text-white">
  <main class="mx-auto grid min-h-[80vh] max-w-5xl place-items-center">
    <section class="w-full max-w-md">
      <p class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Card · Preview</p>
      <article class="group w-full overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-800 dark:bg-slate-900">
        <div class="aspect-[16/9] bg-slate-100 dark:bg-slate-800"></div>
        <div class="p-5 sm:p-6">
          <div class="mb-3 flex items-center justify-between gap-3"><span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300">Featured</span><span class="text-xs text-slate-400">2 min read</span></div>
          <h1 class="text-lg font-semibold tracking-tight">A minimal responsive card</h1>
          <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-400">A flexible surface designed to adapt cleanly from small screens to larger layouts.</p>
          <div class="mt-5 flex flex-col gap-2 sm:flex-row"><button class="rounded-lg bg-slate-950 px-4 py-2.5 text-sm font-medium text-white hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400 dark:bg-white dark:text-slate-950">View details</button><button class="rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-medium hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400 dark:border-slate-700 dark:hover:bg-slate-800">Save</button></div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
