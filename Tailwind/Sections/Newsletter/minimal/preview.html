<section class="relative w-full py-20 sm:py-28 text-neutral-900" data-section="minimal">
<div class="mx-auto max-w-7xl px-5 sm:px-6 lg:px-8">
<div class="mb-10 text-center mx-auto"><p class="mb-4"><span class="inline-flex items-center gap-1.5 rounded-full border border-neutral-200 px-3 py-1 text-[11px] font-medium uppercase tracking-wider text-neutral-600"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> Newsletter</span></p><h2 class="f-disp text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-center mx-auto">Stay in the loop</h2><p class="mt-4 max-w-2xl text-center mx-auto text-base sm:text-lg leading-relaxed text-neutral-500">Monthly product updates and ideas. No spam, unsubscribe anytime.</p></div><div class="grid grid-cols-1 gap-6 lg:grid-cols-2 items-center"><div class="text-center lg:text-left"><p class="f-disp text-5xl font-bold">24k+</p><p class="mt-2 text-sm text-neutral-500">subscribers already reading</p></div><div class="bg-white border border-neutral-200 rounded-xl transition-all duration-300 hover:shadow-md hover:-translate-y-0.5 p-6"><h3 class="font-semibold mb-2">Join them</h3><form class="flex flex-col gap-2 max-w-2xl sm:mx-0 w-full"><label for="nl-email" class="sr-only">Email address</label><input id="nl-email" type="email" placeholder="you@email.com" class="w-full rounded-lg border border-neutral-300 bg-white px-4 py-3 text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-900/10 focus:border-neutral-400" aria-label="Email"><button type="submit" class="bg-neutral-900 text-white rounded-lg font-medium hover:bg-neutral-800 justify-center"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg> Subscribe to the newsletter</button></form></div></div>
