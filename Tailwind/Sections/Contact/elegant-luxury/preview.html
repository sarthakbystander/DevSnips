<section class="relative w-full py-20 sm:py-28 text-[#ece7df]" data-section="elegant-luxury">
<div class="mx-auto max-w-7xl px-5 sm:px-6 lg:px-8">
<div class="mb-10 text-center mx-auto"><p class="mb-4"><span class="inline-flex items-center gap-1.5 rounded-sm border border-[#c5a572]/30 px-3 py-1 text-[11px] font-medium uppercase tracking-[0.22em] text-[#c5a572]"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> Contact</span></p><h2 class="f-disp text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-center mx-auto">Let's talk</h2><p class="mt-4 max-w-2xl text-center mx-auto text-base sm:text-lg leading-relaxed text-[#9a948a]">Reach out and our team will reply within one business day.</p></div><div class="text-center"><form class="mx-auto max-w-md space-y-4"><div><label class="mb-1.5 block text-sm font-medium text-[#9a948a]" for="name">Name</label><input id="name" name="name" type="text" placeholder="" class="w-full rounded-sm border border-[#c5a572]/25 bg-[#131312] px-4 py-3 text-[#ece7df] placeholder:text-[#9a948a] focus:outline-none focus:ring-1 focus:ring-[#c5a572]/50"></div><div><label class="mb-1.5 block text-sm font-medium text-[#9a948a]" for="email">Email</label><input id="email" name="email" type="email" placeholder="" class="w-full rounded-sm border border-[#c5a572]/25 bg-[#131312] px-4 py-3 text-[#ece7df] placeholder:text-[#9a948a] focus:outline-none focus:ring-1 focus:ring-[#c5a572]/50"></div><textarea rows="4" placeholder="How can we help?" class="w-full rounded-sm border border-[#c5a572]/25 bg-[#131312] px-4 py-3 text-[#ece7df] placeholder:text-[#9a948a] focus:outline-none focus:ring-1 focus:ring-[#c5a572]/50" aria-label="Message"></textarea><button type="submit" class="bg-[#c5a572] text-[#0c0c0d] rounded-sm font-medium tracking-wider uppercase hover:bg-[#d4b883] w-full justify-center">Send <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></form></div>
</div>
