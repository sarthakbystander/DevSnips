Snippet Name: Funny 404 — Soft UI (refined)
Description: Neumorphic soft-UI 404. Fixed button padding, focus rings, vertical centering, press states.
Author: DevSnips Contributors (refined)
Usage Example: Drop this snippet into any Tailwind CSS page.
-->

<style>
  .f-disp { font-family: 'Manrope', system-ui, sans-serif; }
  .neu-sm {
    background: #e6e7ee;
    box-shadow: 5px 5px 10px #c8c9d0, -5px -5px 10px #ffffff;
  }
  .neu-press:active {
    box-shadow: inset 4px 4px 8px #c8c9d0, inset -4px -4px 8px #ffffff;
  }
</style>

<section
  class="relative w-full min-h-[65vh] flex items-center justify-center py-16 sm:py-24 text-[#3a3b45] bg-[#e6e7ee]"
  data-section="soft-ui"
  aria-labelledby="soft-404-title"
>
  <div class="mx-auto max-w-7xl w-full px-5 sm:px-6 lg:px-8">
    <div class="text-center max-w-md mx-auto">
      <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center neu-sm rounded-xl">
        <svg class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 10h.01M15 10h.01"/>
          <path d="M12 2a8 8 0 0 0-8 8v12l3-3 3 3 2-2 2 2 3-3 3 3V10a8 8 0 0 0-8-8z"/>
        </svg>
      </div>
      <h1 id="soft-404-title" class="f-disp text-5xl sm:text-7xl font-bold tracking-tight">Oops!</h1>
      <p class="mt-4 text-lg">Looks like this page took the day off.</p>
      <p class="mt-2 text-sm text-[#8a8b95]">Error 404: Page on vacation. Please try another.</p>
      <div class="mt-10 flex flex-col sm:flex-row gap-3 justify-center">
        <a href="/" class="neu-sm neu-press inline-flex items-center justify-center gap-2 rounded-xl px-6 py-3 text-sm font-semibold text-[#6366f1] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400/50 focus-visible:ring-offset-2 focus-visible:ring-offset-[#e6e7ee]">
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5V21a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          Back home
        </a>
        <a href="#search" class="neu-sm neu-press inline-flex items-center justify-center gap-2 rounded-xl px-6 py-3 text-sm font-medium text-[#3a3b45] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-400/50 focus-visible:ring-offset-2 focus-visible:ring-offset-[#e6e7ee]">
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          Search
        </a>
      </div>
    </div>
  </div>
</section>
