<!--
Snippet Name: Moody 404 — Cyber (refined)
Description: Neon cyber 404. Fixed button padding, focus rings, vertical centering, flattened structure.
Author: DevSnips Contributors (refined)
Usage Example: Drop this snippet into any Tailwind CSS page.
-->

<style>
  .f-disp { font-family: 'Chakra Petch', 'Chakra', system-ui, sans-serif; }
  .cy-clip {
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  }
</style>

<section
  class="relative w-full min-h-[65vh] flex items-center justify-center py-16 sm:py-24 text-[#c8ffd0] bg-[#0a0e0a]"
  data-section="cyber"
  aria-labelledby="cyber-404-title"
>
  <div class="absolute inset-0 -z-10 opacity-40" style="background:radial-gradient(circle at 50% 30%,#39ff14,transparent 60%)" aria-hidden="true"></div>

  <div class="mx-auto max-w-7xl w-full px-5 sm:px-6 lg:px-8">
    <div class="text-center max-w-xl mx-auto">
      <p class="f-disp text-8xl sm:text-[10rem] font-bold leading-none tracking-tighter" style="color:#39ff14">
        404
      </p>
      <h1 id="cyber-404-title" class="mt-4 f-disp text-2xl sm:text-3xl font-bold">
        Lost in the dark
      </h1>
      <p class="mt-3 text-sm text-[#5a8c5e] max-w-md mx-auto leading-relaxed">
        The page you are after has vanished into the void.
      </p>

      <div class="mt-10 flex flex-col sm:flex-row gap-3 justify-center">
        <a
          href="/"
          class="cy-clip inline-flex items-center justify-center gap-2 bg-[#39ff14] px-6 py-3 text-sm font-bold uppercase tracking-wide text-[#0a0e0a] hover:bg-[#7fff5f] transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#39ff14]/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0a0e0a]"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 9.5 12 3l9 6.5V21a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <path d="M9 22V12h6v10"/>
          </svg>
          Back home
        </a>
        <a
          href="#search"
          class="cy-clip inline-flex items-center justify-center gap-2 border border-[#39ff14]/40 px-6 py-3 text-sm font-semibold uppercase tracking-wide text-[#39ff14] hover:bg-[#39ff14]/10 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#39ff14]/50 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0a0e0a]"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          Search
        </a>
      </div>
    </div>
  </div>
</section>
