<!--
Snippet Name: Gradient 404 — Dark Premium (refined)
Description: Amber gradient 404 card. Fixed nesting, focus states, vertical centering, consistent button.
Author: DevSnips Contributors (refined)
Usage Example: Drop this snippet into any Tailwind CSS page.
-->

<style>
  .f-disp { font-family: 'Manrope', system-ui, sans-serif; }
  .dp-card {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
  }
</style>

<section
  class="relative w-full min-h-[65vh] flex items-center justify-center py-16 sm:py-24 text-white bg-[#0c0a09]"
  data-section="dark-premium"
  aria-labelledby="dp-404-title"
>
  <div class="mx-auto max-w-7xl w-full px-5 sm:px-6 lg:px-8">
    <div class="relative overflow-hidden rounded-3xl p-10 sm:p-14 text-center dp-card max-w-2xl mx-auto shadow-2xl shadow-amber-500/20">
      <div class="absolute inset-0 opacity-20" style="background:radial-gradient(circle at 70% 20%, #fff, transparent 50%)" aria-hidden="true"></div>
      <div class="relative z-10">
        <p class="f-disp text-7xl sm:text-9xl font-bold leading-none tracking-tight">404</p>
        <h1 id="dp-404-title" class="mt-5 f-disp text-2xl sm:text-3xl font-bold">
          Page not found
        </h1>
        <p class="mt-3 text-sm sm:text-base text-white/85 max-w-md mx-auto">
          This page slipped through a gradient rift.
        </p>
        <div class="mt-8">
          <a
            href="/"
            class="inline-flex items-center justify-center gap-2 rounded-full bg-white px-6 py-3 text-sm font-bold text-amber-600 shadow-lg hover:bg-white/95 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/70 focus-visible:ring-offset-2 focus-visible:ring-offset-amber-500"
          >
            <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 9.5 12 3l9 6.5V21a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <path d="M9 22V12h6v10"/>
            </svg>
            Back home
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
