<!--
Snippet Name: Developer Theme 404 — Edge Glassmorphism (refined)
Description: Clean, production-ready Edge Glassmorphism 404. Fixed missing button padding, nesting, focus states, and vertical centering.
Author: DevSnips Contributors (refined)
Usage Example: Drop this snippet into any Tailwind CSS page.
-->

<style>
  .f-sans { font-family: 'Sora', system-ui, sans-serif; }
  .f-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .eg-mesh {
    background:
      radial-gradient(at 18% 18%, rgba(236, 72, 153, 0.45) 0, transparent 50%),
      radial-gradient(at 82% 12%, rgba(99, 102, 241, 0.45) 0, transparent 50%),
      radial-gradient(at 75% 78%, rgba(34, 211, 238, 0.4) 0, transparent 50%),
      radial-gradient(at 22% 82%, rgba(168, 85, 247, 0.45) 0, transparent 50%),
      #0b0a1f;
    background-size: 180% 180%;
    animation: eg-pan 18s ease-in-out infinite alternate;
  }
  @keyframes eg-pan {
    0% { background-position: 0 0; }
    100% { background-position: 100% 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .eg-mesh { animation: none; }
  }
  .eg-glass {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.16);
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>

<section
  class="relative w-full min-h-[70vh] flex items-center justify-center py-16 sm:py-24 text-white eg-mesh"
  data-section="edge-glassmorphism"
  aria-labelledby="eg-404-title"
>
  <div class="mx-auto max-w-7xl w-full px-5 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto">
      <div class="eg-glass rounded-2xl overflow-hidden shadow-2xl shadow-black/30">
        <div class="flex items-center gap-2 border-b border-white/10 px-4 py-3">
          <span class="h-2.5 w-2.5 rounded-full bg-white/30" aria-hidden="true"></span>
          <span class="h-2.5 w-2.5 rounded-full bg-white/30" aria-hidden="true"></span>
          <span class="h-2.5 w-2.5 rounded-full bg-white/30" aria-hidden="true"></span>
          <span class="ml-2 text-sm text-white/60 f-mono">developer</span>
          <h1 id="eg-404-title" class="ml-auto text-sm font-semibold text-white/60 f-mono">404.sh</h1>
        </div>
        <div class="p-6 f-mono text-sm space-y-2">
          <p class="text-white/60">
            $ curl <span class="font-semibold text-white">https://yoursite.com/missing</span>
          </p>
          <p>
            status: <span class="text-cyan-300">404</span> Not Found
          </p>
          <p>message: The requested resource does not exist.</p>
          <p class="text-white/60">hint: Check the URL or return to safety.</p>
          <p class="pt-2">
            $ <span
              class="inline-block w-2 h-4 align-middle bg-cyan-300"
              style="animation: blink 1s steps(1) infinite"
              aria-hidden="true"
            ></span>
          </p>
        </div>
      </div>
      <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
        <a
          href="/"
          class="inline-flex items-center justify-center gap-2 rounded-xl px-5 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-fuchsia-500 to-indigo-500 shadow-lg shadow-fuchsia-500/25 hover:shadow-fuchsia-500/40 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-fuchsia-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0b0a1f]"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 9.5 12 3l9 6.5V21a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M9 22V12h6v10" />
          </svg>
          Back home
        </a>
        <a
          href="#search"
          class="eg-glass inline-flex items-center justify-center gap-2 rounded-xl px-5 py-2.5 text-sm font-medium text-white hover:bg-white/15 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0b0a1f]"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          Search
        </a>
      </div>
    </div>
  </div>
</section>
