<!--
Snippet Name: Minimal 404 — Gradient Mesh (refined)
Description: Animated gradient-mesh 404. Fixed padding, focus, centering, reduced-motion safe.
Author: DevSnips Contributors (refined)
Usage Example: Drop this snippet into any Tailwind CSS page.
-->

<style>
  .f-disp { font-family: 'Outfit', system-ui, sans-serif; }
  .gm-bg {
    background: linear-gradient(120deg, #7c3aed, #ec4899, #f97316, #06b6d4);
    background-size: 300% 300%;
    animation: gm 16s ease infinite;
  }
  @keyframes gm {
    0% { background-position: 0 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gm-bg { animation: none; background-position: 50% 50%; }
  }
</style>

<section
  class="relative w-full min-h-[65vh] flex items-center justify-center py-16 sm:py-24 text-white gm-bg"
  data-section="gradient-mesh"
  aria-labelledby="gm-404-title"
>
  <div class="mx-auto max-w-7xl w-full px-5 sm:px-6 lg:px-8">
    <div class="text-center max-w-md mx-auto">
      <h1 id="gm-404-title" class="f-disp text-7xl sm:text-9xl font-bold tracking-tight">404</h1>
      <p class="mt-4 text-lg text-white/80">This page could not be found.</p>
      <p class="mt-2 text-sm text-white/70">It may have been moved or no longer exists.</p>
      <div class="mt-10 flex flex-col sm:flex-row gap-3 justify-center">
        <a href="/" class="inline-flex items-center justify-center gap-2 rounded-full bg-white px-6 py-3 text-sm font-semibold text-violet-700 shadow-lg hover:bg-white/95 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/70 focus-visible:ring-offset-2 focus-visible:ring-offset-violet-600">
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5V21a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          Back home
        </a>
        <a href="#search" class="inline-flex items-center justify-center gap-2 rounded-full border border-white/40 px-6 py-3 text-sm font-medium text-white hover:bg-white/10 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/50 focus-visible:ring-offset-2 focus-visible:ring-offset-violet-600">
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          Search
        </a>
      </div>
    </div>
  </div>
</section>
