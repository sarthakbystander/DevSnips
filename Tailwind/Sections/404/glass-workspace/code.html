<!--
Snippet Name: Resource 404 — Glass Workspace
Description: Polished dark glassmorphism 404 / resource-not-found section inspired by modern SaaS workspace UIs (Flowbase-style). Fully self-contained, production-ready Tailwind + minimal inline styles.
Author: DevSnips Contributors (refined)
Usage Example: Drop this snippet into any Tailwind CSS page. Works as a full-page 404 or as an in-app resource missing state.
Accessibility: proper heading hierarchy, focus-visible rings, ARIA labels, reduced-motion safe.
-->

<style>
  /* Self-contained helpers */
  .gw-glass {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .gw-glass-strong {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .gw-btn-primary {
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f472b6 100%);
    box-shadow: 0 4px 24px -4px rgba(168, 85, 247, 0.45);
  }
  .gw-btn-primary:hover {
    filter: brightness(1.08);
    box-shadow: 0 6px 28px -4px rgba(168, 85, 247, 0.55);
  }
  .gw-btn-primary:active {
    transform: scale(0.98);
  }
  @media (prefers-reduced-motion: reduce) {
    .gw-btn-primary:active { transform: none; }
  }
</style>

<section
  class="relative min-h-[70vh] w-full flex items-center justify-center py-16 sm:py-24 px-4 sm:px-6 text-white"
  data-section="glass-workspace"
  aria-labelledby="gw-404-title"
>
  <!-- subtle ambient background -->
  <div
    class="pointer-events-none absolute inset-0 -z-10 overflow-hidden"
    aria-hidden="true"
  >
    <div class="absolute inset-0 bg-[#0a0a0f]"></div>
    <div
      class="absolute top-1/4 left-1/2 -translate-x-1/2 h-[480px] w-[480px] rounded-full opacity-30 blur-[100px]"
      style="background: radial-gradient(circle, rgba(168,85,247,0.25) 0%, transparent 70%)"
    ></div>
  </div>

  <div class="w-full max-w-md mx-auto">
    <div
      class="gw-glass-strong rounded-2xl sm:rounded-3xl overflow-hidden shadow-2xl shadow-black/40"
    >
      <!-- Header bar -->
      <div class="flex items-center justify-between gap-3 px-5 py-3.5 border-b border-white/10">
        <div class="flex items-center gap-2.5 min-w-0">
          <span
            class="flex h-5 w-5 shrink-0 items-center justify-center text-white/90"
            aria-hidden="true"
          >
            <!-- triangle mark -->
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor">
              <path d="M12 3 2 21h20L12 3z" />
            </svg>
          </span>
          <span class="truncate text-sm font-medium tracking-tight text-white/90">
            Your Workspace
          </span>
        </div>
        <span
          class="shrink-0 inline-flex items-center rounded-full border border-white/15 bg-white/5 px-2.5 py-0.5 text-xs font-medium tabular-nums text-white/70"
        >
          404
        </span>
      </div>

      <!-- Body -->
      <div class="px-6 py-10 sm:px-8 sm:py-12 text-center">
        <!-- Warning icon -->
        <div class="mx-auto mb-6 flex h-12 w-12 items-center justify-center rounded-xl gw-glass">
          <svg
            class="h-6 w-6 text-white/90"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        </div>

        <h1
          id="gw-404-title"
          class="text-xl sm:text-2xl font-semibold tracking-tight text-white"
        >
          Resource not found
        </h1>
        <p class="mt-2 text-sm leading-relaxed text-white/55 max-w-xs mx-auto">
          This item may have been deleted or you lack access.
        </p>

        <!-- Actions -->
        <div class="mt-8 flex flex-col sm:flex-row items-stretch sm:items-center justify-center gap-3">
          <a
            href="/"
            class="gw-btn-primary inline-flex items-center justify-center gap-2 rounded-full px-5 py-2.5 text-sm font-semibold text-white transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-fuchsia-400/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0a0a0f]"
          >
            <svg
              class="h-4 w-4 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 9.5 12 3l9 6.5V21a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <path d="M9 22V12h6v10" />
            </svg>
            Back to app
          </a>
          <a
            href="#report"
            class="gw-glass inline-flex items-center justify-center gap-2 rounded-full px-5 py-2.5 text-sm font-medium text-white/85 transition hover:bg-white/10 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/30 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0a0a0f]"
          >
            <svg
              class="h-4 w-4 shrink-0 opacity-80"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
            Report
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
