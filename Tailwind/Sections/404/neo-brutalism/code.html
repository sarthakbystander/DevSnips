<style>
  .f-disp { font-family: 'Archivo', system-ui, sans-serif; }
  .nb-shadow-sm { box-shadow: 4px 4px 0 0 #000; }
  .nb-press { transition: transform 0.1s ease, box-shadow 0.1s ease; }
  .nb-press:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 0 #000; }
  .nb-press:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 0 #000; }
  @media (prefers-reduced-motion: reduce) {
    .nb-press:hover, .nb-press:active { transform: none; }
  }
</style>

<section
  class="relative w-full min-h-[65vh] flex items-center justify-center py-16 sm:py-24 text-black bg-[#FFFDF5]"
  data-section="neo-brutalism"
  aria-labelledby="nb-404-title"
>
  <div class="mx-auto max-w-7xl w-full px-5 sm:px-6 lg:px-8">
    <div class="text-center max-w-lg mx-auto relative">
      <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center">
        <span class="flex h-16 w-16 items-center justify-center rounded-full bg-[#FFFDF5] border-2 border-black nb-shadow-sm">
          <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M13 7 9 3 3 9l4 4M9 3l4 4M5 11l-2 2M21 19l-4-4-4 4 4 4M17 15l4 4"/>

      <h1 id="nb-404-title" class="mt-4 f-disp text-2xl font-bold">Lost in space</h1>

      <div class="mt-10 flex flex-col sm:flex-row gap-3 justify-center">

          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
