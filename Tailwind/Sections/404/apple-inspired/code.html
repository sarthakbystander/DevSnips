<!--
Snippet Name: Premium SaaS 404 — Apple Inspired (refined)
Description: Clean Apple-inspired 404. Fixed brand placeholder, nesting, focus states, vertical centering.
Author: DevSnips Contributors (refined)
Usage Example: Drop this snippet into any Tailwind CSS page.
-->

<style>
  .f-sans { font-family: 'Inter', system-ui, sans-serif; }
  .f-disp { font-family: 'Inter', system-ui, sans-serif; }
</style>

<section
  class="relative w-full min-h-[65vh] flex items-center justify-center py-16 sm:py-24 text-[#1d1d1f] bg-[#fbfbfd]"
  data-section="apple-inspired"
  aria-labelledby="apple-404-title"
>
  <div class="mx-auto max-w-7xl w-full px-5 sm:px-6 lg:px-8">
    <div class="text-center max-w-xl mx-auto">
      <!-- Brand mark (neutral placeholder) -->
      <div class="mx-auto mb-6 flex justify-center">
        <span class="inline-flex items-center gap-2 h-7 text-[#1d1d1f]">
          <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" aria-hidden="true">
            <path d="M12 2 2 19h20L12 2z" fill="currentColor"/>
          </svg>
          <span class="font-semibold tracking-tight">Your Brand</span>
        </span>
      </div>

      <span class="inline-flex items-center gap-1.5 rounded-full bg-[#0071e3]/10 px-3 py-1 text-[11px] font-semibold uppercase tracking-wide text-[#0071e3] mb-5">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
          <path d="M12 9v4M12 17h.01"/>
        </svg>
        Error 404
      </span>

      <h1 id="apple-404-title" class="f-disp text-5xl sm:text-7xl font-bold tracking-tight">
        Page not found
      </h1>
      <p class="mt-4 text-base text-[#6e6e73] max-w-md mx-auto leading-relaxed">
        The page you are looking for does not exist or has been moved.
      </p>

      <!-- Actions — flattened, consistent height/padding, focus rings -->
      <div class="mt-10 flex flex-col sm:flex-row gap-3 justify-center">
        <a
          href="/"
          class="inline-flex items-center justify-center gap-2 rounded-full bg-[#0071e3] px-6 py-3 text-sm font-medium text-white hover:bg-[#0077ed] transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0071e3]/60 focus-visible:ring-offset-2 focus-visible:ring-offset-[#fbfbfd]"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 9.5 12 3l9 6.5V21a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <path d="M9 22V12h6v10"/>
          </svg>
          Back home
        </a>
        <a
          href="#search"
          class="inline-flex items-center justify-center gap-2 rounded-full bg-white px-6 py-3 text-sm font-medium text-[#0071e3] shadow-sm border border-black/5 hover:bg-neutral-50 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0071e3]/40 focus-visible:ring-offset-2 focus-visible:ring-offset-[#fbfbfd]"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          Search
        </a>
      </div>
    </div>
  </div>
</section>
