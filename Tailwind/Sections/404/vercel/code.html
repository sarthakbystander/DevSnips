Snippet Name: Terminal 404 — Vercel / Linear (refined)
Description: Terminal-style 404. Fixed button padding, focus rings, vertical centering, flattened structure.

Usage Example: Drop this snippet into any Tailwind CSS page.

<style>
  .f-mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .vc-panel {
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 20px 60px -20px rgba(0,0,0,0.9);
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>

<section
  class="relative w-full min-h-[65vh] flex items-center justify-center py-16 sm:py-24 text-white bg-black"
  data-section="vercel"
  aria-labelledby="vc-404-title"
>
  <div class="mx-auto max-w-7xl w-full px-5 sm:px-6 lg:px-8">
    <div class="max-w-xl mx-auto bg-[#0a0a0a] border border-white/10 rounded-[14px] vc-panel p-6 f-mono">
      <p class="text-sm">
        <span style="color:#50e3c2">user@host</span>:<span class="text-white/50">~</span>$ ls /pages/
      </p>
      <p class="mt-2 text-sm text-white/50">
        ls: cannot access '/pages/missing': No such file or directory
      </p>
      <p class="mt-2 text-sm">
        <span style="color:#50e3c2">user@host</span>:<span class="text-white/50">~</span>$
        <span class="inline-block w-2 h-4 align-middle bg-[#50e3c2]" style="animation:blink 1s steps(1) infinite" aria-hidden="true"></span>
      </p>
      <h1 id="vc-404-title" class="mt-6 text-4xl font-bold tracking-tight" style="font-family:'Geist Mono', ui-monospace, monospace">
        404
      </h1>
      <p class="mt-2 text-sm text-white/50">exit code 404 — page not found</p>
      <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
        <a href="/" class="inline-flex items-center justify-center gap-2 rounded-lg bg-white px-5 py-2.5 text-sm font-medium text-black hover:bg-white/90 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60 focus-visible:ring-offset-2 focus-visible:ring-offset-black">
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5V21a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          Back home
        </a>
        <a href="#search" class="inline-flex items-center justify-center gap-2 rounded-lg border border-white/10 bg-white/[0.02] px-5 py-2.5 text-sm font-medium text-white hover:border-white/20 hover:text-white transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/30 focus-visible:ring-offset-2 focus-visible:ring-offset-black">
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          Search
        </a>
      </div>
    </div>
  </div>
</section>
