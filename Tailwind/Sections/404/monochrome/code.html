<style>
  .f-disp { font-family: 'Inter', system-ui, sans-serif; }
  .f-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .nb-shadow { box-shadow: 6px 6px 0 0 #000; }
</style>

<section
  class="relative w-full min-h-[65vh] flex items-center justify-center py-16 sm:py-24 text-black bg-white"
  data-section="monochrome"
  aria-labelledby="mono-404-title"
>
  <div class="mx-auto max-w-7xl w-full px-5 sm:px-6 lg:px-8">
    <div class="text-center max-w-md mx-auto">

        <p class="f-disp text-7xl sm:text-9xl font-black tracking-tighter">404</p>
      </div>
      <h1 id="mono-404-title" class="mt-8 f-mono text-sm font-bold uppercase tracking-wider">Page not found</h1>

      <div class="mt-10 flex flex-col sm:flex-row gap-3 justify-center">

          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5V21a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>

          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
