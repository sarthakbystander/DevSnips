<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Meridian — Incident Command for On-Call Teams">
  <rect width="1200" height="630" fill="#F5F6F8"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#0B0D10" stroke-width="2"/>

  <!-- graph paper -->
  <g stroke="#0B0D10" stroke-width="1" opacity="0.05">
    <line x1="60" y1="40" x2="60" y2="590"/><line x1="180" y1="40" x2="180" y2="590"/><line x1="300" y1="40" x2="300" y2="590"/><line x1="420" y1="40" x2="420" y2="590"/><line x1="540" y1="40" x2="540" y2="590"/><line x1="660" y1="40" x2="660" y2="590"/><line x1="780" y1="40" x2="780" y2="590"/><line x1="900" y1="40" x2="900" y2="590"/><line x1="1020" y1="40" x2="1020" y2="590"/><line x1="1140" y1="40" x2="1140" y2="590"/>
  </g>

  <!-- logo mark -->
  <rect x="120" y="120" width="74" height="74" fill="#0B0D10"/>
  <path d="M134 174 L156 142 L168 158 L180 128 L198 174" fill="none" stroke="#E8A33C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="198" cy="174" r="5" fill="#E8A33C" stroke="#0B0D10" stroke-width="2"/>

  <text x="120" y="246" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="40" fill="#0B0D10" letter-spacing="-1">MERIDIAN</text>
  <text x="120" y="276" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="16" fill="#0B0D10" opacity="0.55">INCIDENT COMMAND · v3.8</text>

  <text x="120" y="386" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="86" fill="#0B0D10" letter-spacing="-3">Every alert routed.</text>
  <text x="120" y="472" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="86" fill="#0B0D10" letter-spacing="-3">Every incident<tspan fill="#E8A33C"> governed.</tspan></text>

  <!-- incident panel motif -->
  <g transform="translate(780,150)">
    <rect x="0" y="0" width="320" height="330" fill="#FFFFFF" stroke="#0B0D10" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="40" fill="#0B0D10"/>
    <circle cx="22" cy="20" r="6" fill="#DC2626"/>
    <text x="40" y="26" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#F5F6F8">INC #4471 · SEV-2</text>
    <text x="280" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F5F6F8" opacity="0.6">LIVE</text>

    <text x="20" y="76" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0B0D10" opacity="0.5">CHECKOUT-API · P99 LATENCY</text>
    <text x="20" y="116" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="34" fill="#0B0D10">8.4s</text>
    <text x="20" y="138" font-family="'JetBrains Mono', monospace" font-size="11" fill="#DC2626">▲ +612% over baseline</text>

    <polyline points="20,200 50,196 80,198 110,188 140,182 170,160 200,150 230,120 260,90 290,70" fill="none" stroke="#0B0D10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="290" cy="70" r="5" fill="#DC2626"/>

    <line x1="20" y1="244" x2="300" y2="244" stroke="#0B0D10" stroke-width="1" opacity="0.15"/>
    <text x="20" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0B0D10">ACK 00:42 · MTR 00:11 · 3 responders</text>
    <rect x="20" y="288" width="280" height="28" fill="#0B0D10"/>
    <text x="32" y="306" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#E8A33C">RUNBOOK: checkout-latency.runbook</text>
  </g>
</svg>
