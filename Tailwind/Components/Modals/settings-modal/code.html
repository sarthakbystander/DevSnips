    <!-- Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-800">
        <div>
          <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Profile Settings</h2>
          <p class="text-sm text-gray-500 dark:text-gray-400">Manage your public profile information</p>
        </div>
        <button onclick="closeModal('settings-modal')" class="p-2 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      
      <!-- Form -->
      <div class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- Avatar -->
        <div class="flex items-center gap-6">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop" class="w-20 h-20 rounded-full object-cover">
          <div>
            <button class="px-4 py-2 text-sm font-medium text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 rounded-lg hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-colors">Change Photo</button>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">JPG, GIF or PNG. Max 2MB.</p>
          </div>
        </div>
        
        <!-- Name -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">First Name</label>
            <input type="text" value="Marcus" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Last Name</label>
            <input type="text" value="Chen" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          </div>
        </div>
        
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
          <input type="email" value="marcus@company.com" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
        </div>
        
        <!-- Bio -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Bio</label>
          <textarea rows="3" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-none">Senior Product Designer with 8+ years of experience creating user-centered digital experiences for SaaS companies.</textarea>
        </div>
        
        <!-- Toggle -->
        <div class="flex items-center justify-between py-4 border-t border-gray-100 dark:border-gray-800">
          <div>
            <p class="font-medium text-gray-900 dark:text-white">Make profile public</p>
            <p class="text-sm text-gray-500 dark:text-gray-400">Allow others to view your profile</p>
          </div>
          <button class="relative w-11 h-6 bg-blue-600 rounded-full transition-colors">
            <span class="absolute right-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform"></span>
          </button>
        </div>
      </div>
      
      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 p-6 border-t border-gray-100 dark:border-gray-800">
        <button onclick="closeModal('settings-modal')" class="px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Cancel</button>
        <button onclick="closeModal('settings-modal')" class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-xl hover:bg-blue-700 transition-colors shadow-lg shadow-blue-500/30">Save Changes</button>
      </div>

</div>

<!-- Demo Trigger Button -->
<button onclick="openModal('settings-modal')" class="px-6 py-3 bg-blue-600 text-white font-medium rounded-xl hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Open Settings Modal</button>
<script>
  // Self-contained modal open/close + Esc dismissal (DevSnips snippet helper).
  function openModal(id){var m=document.getElementById(id);if(m){m.classList.remove('hidden');document.body.style.overflow='hidden';}}
  function closeModal(id){var m=document.getElementById(id);if(m){m.classList.add('hidden');}document.body.style.overflow='';}
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.querySelectorAll('.fixed.inset-0.z-50:not(.hidden)').forEach(function(m){m.classList.add('hidden');});document.body.style.overflow='';}});
</script>
