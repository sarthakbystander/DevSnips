<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Width Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Basic / Full Width -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Basic — Full Width</h1>
      <p class="text-gray-600 mt-2">Full width buttons for mobile and prominent CTAs</p>
    </header>

    <!-- Full Width Single -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Single Full Width</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm">
        <button class="w-full px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
          Full Width Button
        </button>
      </div>
    </div>

    <!-- Split Buttons -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Split Width</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm">
        <div class="grid grid-cols-2 gap-3">
          <button class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
            Split Left
          </button>
          <button class="px-6 py-3 bg-gray-200 text-gray-900 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">
            Split Right
          </button>
        </div>
      </div>
    </div>

  </section>

</body>
</html>
