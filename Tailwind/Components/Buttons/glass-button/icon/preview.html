<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Icon Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-icon {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .glass-icon:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="min-h-screen p-8" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  
  <!-- Component: Button / Glass / Icon -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b border-white/20 pb-4">
      <h1 class="text-3xl font-bold text-white">Button — Glass — Icon</h1>
      <p class="text-white/80 mt-2">Glass morphism icon buttons</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-white">Preview</h2>
      <div class="flex flex-wrap gap-4 p-6 rounded-xl">
        <button class="p-3 glass-icon text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
        </button>
        <button class="p-3 glass-icon text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
          </svg>
        </button>
        <button class="p-3 glass-icon text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
          </svg>
        </button>
        <button class="p-3 glass-icon text-white rounded-full focus:outline-none focus:ring-2 focus:ring-white/50 transition-all">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
        </button>
      </div>
    </div>

  </section>

</body>
</html>
