<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search with Filters | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Search with Filters</h1>
      <p class="text-gray-600 mt-2">Search inputs with filter chips and advanced options</p>
    </header>
    <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-lg">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Inline Search</label>
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg></div>
            <input type="text" placeholder="Search products..." class="w-full pl-11 pr-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <button class="px-5 py-3 bg-white border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50">Filters</button>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">With Filter Chips</label>
        <input type="text" placeholder="Search anything..." class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <div class="flex flex-wrap gap-2 mt-3">
          <button class="px-3 py-1.5 text-sm bg-blue-100 text-blue-700 rounded-full">All</button>
          <button class="px-3 py-1.5 text-sm bg-gray-100 text-gray-700 rounded-full">Documents</button>
          <button class="px-3 py-1.5 text-sm bg-gray-100 text-gray-700 rounded-full">Images</button>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Advanced</label>
        <div class="p-4 bg-gray-50 rounded-xl">
          <div class="flex items-center gap-3 mb-4">
            <div class="relative flex-1">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
              </div>
              <input type="text" placeholder="Search users, projects..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors" />
            </div>
            <button class="px-4 py-2.5 bg-purple-600 text-white font-medium rounded-lg hover:bg-purple-700 transition-colors">Search</button>
          </div>
          <div class="flex flex-wrap items-center gap-3 text-sm">
            <span class="text-gray-500">Filters:</span>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked class="rounded border-gray-300 text-blue-600" /><span>Active</span></label>
            <select class="px-2 py-1 bg-white border border-gray-200 rounded text-sm"><option>All Types</option></select>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
