</div>

<!-- Gradient Border - Cyan Blue -->

  <input type="email" placeholder="Enter your email" class="w-full px-4 py-3 bg-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
</div>

<!-- Gradient Border - Warm -->
<div class="relative p-[2px] mt-4 rounded-2xl bg-gradient-to-r from-orange-500 via-rose-500 to-purple-500">

</div>

<!-- Gradient Border - Dark Background -->

    <input type="text" value="Premium Member" class="w-full bg-transparent text-white focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
