<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Border Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Gradient Border</h1>
      <p class="text-gray-600 mt-2">Input fields with gradient border effects</p>
    </header>

    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-md">
        <div class="relative p-[2px] rounded-xl bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500">
          <input type="text" placeholder="Enter your name" class="w-full px-4 py-3 bg-white rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
        </div>

        <div class="relative p-[2px] rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500">
          <input type="email" placeholder="Enter your email" class="w-full px-4 py-3 bg-white rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
        </div>

        <div class="relative p-[2px] rounded-2xl bg-gradient-to-r from-orange-500 via-rose-500 to-purple-500">
          <input type="text" placeholder="Create something amazing" class="w-full px-5 py-4 bg-gray-900 text-white placeholder-gray-500 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
        </div>

        <div class="relative p-[2px] rounded-lg bg-gradient-to-r from-violet-600 via-fuchsia-500 to-pink-500">
          <div class="px-4 py-3 bg-slate-900 rounded-lg">
            <input type="text" value="Premium Member" class="w-full bg-transparent text-white focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
          </div>
        </div>
      </div>
    </div>

    <div class="mt-8 p-4 bg-gradient-to-r from-blue-50 via-purple-50 to-pink-50 rounded-lg border border-purple-100">
      <p class="text-sm text-purple-800"><strong>Technique:</strong> Use a wrapper with padding and gradient background, with inner content having solid background.</p>
    </div>
  </section>

</body>
</html>
