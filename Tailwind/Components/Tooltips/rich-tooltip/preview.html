<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rich Tooltip | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::selection { background: rgba(37, 99, 235, 0.15); }
    .tt-rich { position: relative; }
    .tt-rich::after {
      content: attr(data-tooltip-title) "\A" attr(data-tooltip-desc);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translateX(-50%) translateY(4px);
      width: 240px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #111827;
      color: #f9fafb;
      font-size: 12.5px;
      font-weight: 400;
      line-height: 1.45;
      text-align: left;
      white-space: pre-wrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity .15s ease, transform .15s ease, visibility .15s;
      pointer-events: none;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    .tt-rich::before {
      content: '';
      position: absolute;
      left: 50%;
      bottom: calc(100% + 4px);
      transform: translateX(-50%) translateY(4px);
      border: 6px solid transparent;
      border-top-color: #111827;
      opacity: 0;
      visibility: hidden;
      transition: opacity .15s ease, transform .15s ease, visibility .15s;
      pointer-events: none;
      z-index: 50;
    }
    .tt-rich:hover::after, .tt-rich:focus-visible::after {
      opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
    }
    .tt-rich:hover::before, .tt-rich:focus-visible::before {
      opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased">

  <header class="sticky top-0 z-20 border-b border-gray-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6">
      <div class="flex items-center gap-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-600 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-2M14 4h6m0 0v6m0-6L10 14"/></svg>
        </div>
        <span class="text-[15px] font-semibold tracking-tight">DevSnips</span>
        <span class="ml-2 rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-500">Settings</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-2xl px-6 py-12">
    <h1 class="text-3xl font-bold tracking-tight text-gray-900">Developer settings</h1>
    <p class="mt-3 max-w-xl text-[15px] leading-relaxed text-gray-500">
      Hover or focus the info icon next to a field to see richer help content — a title plus a multi-line description.
    </p>

    <div class="mt-8 space-y-6 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
      <!-- Component: Rich Tooltip -->
      <div class="inline-flex items-center gap-1.5">
        <label for="api-key" class="text-sm font-medium text-gray-700">API key</label>
        <button
          type="button"
          class="tt-rich flex h-4 w-4 items-center justify-center rounded-full text-gray-400 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
          data-tooltip-title="What is an API key?"
          data-tooltip-desc="A unique token that authenticates requests to our API. Find it under Settings -> API. Keep it secret."
          aria-label="About API keys"
          aria-describedby="tt-rich-desc"
        >
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </button>
        <span id="tt-rich-desc" role="tooltip" class="sr-only">About API keys</span>
      </div>
      <input id="api-key" type="text" placeholder="sk-..." class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />

      <div class="inline-flex items-center gap-1.5">
        <label for="webhook" class="text-sm font-medium text-gray-700">Webhook URL</label>
        <button
          type="button"
          class="tt-rich flex h-4 w-4 items-center justify-center rounded-full text-gray-400 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
          data-tooltip-title="When is this called?"
          data-tooltip-desc="We send a POST request to this URL when events like deployments finish. Respond with 2xx within 10s."
          aria-label="About webhook URL"
          aria-describedby="tt-webhook-desc"
        >
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </button>
        <span id="tt-webhook-desc" role="tooltip" class="sr-only">About webhook URL</span>
      </div>
      <input id="webhook" type="url" placeholder="https://example.com/hook" class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
    </div>
  </main>

</body>
</html>
