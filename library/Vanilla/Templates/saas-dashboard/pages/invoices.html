<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices — Northstar | DevSnips</title>
  <meta name="description" content="Invoice list with number, customer, date, amount, status, and download.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-page="invoices">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <main class="main" id="main" data-page="invoices">
      <div class="page-head">
        <div class="titles">
          <div id="crumbs"></div>
          <h1>Invoices</h1>
          <p class="sub">All invoices issued to your customers.</p>
        </div>
        <div class="page-actions"><button class="btn" data-toast="Exporting invoices…"><span class="btn-text">Export</span></button></div>
      </div>

      <section class="stat-grid mb-16" id="inv-stats"></section>

      <section class="panel mb-0">
        <div class="table-head">
          <div class="table-tools">
            <div class="table-filter">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="search" id="inv-filter" placeholder="Search by invoice, customer…">
            </div>
            <select class="select" id="inv-status" aria-label="Filter by status"><option value="">All statuses</option><option>paid</option><option>pending</option><option>failed</option><option>refunded</option><option>overdue</option></select>
          </div>
          <select class="select" id="inv-range" aria-label="Date range"><option>All time</option><option>This month</option><option>Last 30 days</option><option>This year</option></select>
        </div>
        <div class="data-table-wrap">
          <table class="data">
            <thead><tr><th class="nosort">Invoice</th><th class="nosort">Customer</th><th class="nosort">Plan</th><th class="nosort">Date</th><th class="nosort">Due</th><th class="nosort" style="text-align:right">Amount</th><th class="nosort">Status</th><th class="nosort" style="text-align:right">Actions</th></tr></thead>
            <tbody id="inv-rows"></tbody>
          </table>
        </div>
        <div class="table-foot"><span class="page-info" id="pagination"></span></div>
      </section>

      <footer class="foot">
        <span>© 2026 Northstar — DevSnips Vanilla template demo. Data is illustrative.</span>
        <div class="links"><a href="help-center.html">Docs</a><a href="support.html">Support</a><a href="system-status.html">Status</a></div>
      </footer>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
  (function () {
    'use strict';
    var NS = window.NS, DB = window.DB, money = NS.money, esc = NS.esc, pill = NS.pill, ICONS = NS.ICONS;
    function onReady(fn) { if (document.querySelector('.topbar')) fn(); else window.addEventListener('ns:ready', fn); }
    onReady(function () {
      document.getElementById('crumbs').innerHTML = NS.crumbs([{label:'Revenue',href:'billing.html'},{label:'Invoices'}]);
      var stats = {
        paid: DB.invoices.filter(function (i) { return i.status === 'paid'; }),
        pending: DB.invoices.filter(function (i) { return i.status === 'pending'; }),
        failed: DB.invoices.filter(function (i) { return i.status === 'failed'; }),
        overdue: DB.invoices.filter(function (i) { return i.status === 'overdue'; })
      };
      var totalPaid = stats.paid.reduce(function (s, i) { return s + i.amount; }, 0);
      document.getElementById('inv-stats').innerHTML = [
        { lbl: 'Total invoiced', val: NS.money(DB.invoices.reduce(function (s,i){return s+i.amount;},0)) },
        { lbl: 'Paid', val: NS.money(totalPaid) },
        { lbl: 'Outstanding', val: NS.money(stats.pending.reduce(function(s,i){return s+i.amount;},0) + stats.overdue.reduce(function(s,i){return s+i.amount;},0)) },
        { lbl: 'Failed / overdue', val: (stats.failed.length + stats.overdue.length) + ' invoices' }
      ].map(function (s) { return '<div class="stat"><div class="lbl">' + s.lbl + '</div><div class="val">' + s.val + '</div></div>'; }).join('');

      var state = { page: 1, perPage: 8, filter: '', status: '' };
      function filtered() {
        var f = state.filter.toLowerCase();
        return DB.invoices.filter(function (i) {
          return (!f || i.id.toLowerCase().indexOf(f) > -1 || i.customerName.toLowerCase().indexOf(f) > -1 || i.company.toLowerCase().indexOf(f) > -1) &&
                 (!state.status || i.status === state.status);
        });
      }
      function render() {
        var rows = filtered();
        var page = rows.slice((state.page - 1) * state.perPage, state.page * state.perPage);
        document.getElementById('inv-rows').innerHTML = page.map(function (i) {
          return '<tr><td class="mono">' + esc(i.id) + '</td><td><div class="cust"><span class="pic sm" style="background:var(--ds-accent)">' + esc(i.id.slice(-2)) + '</span><div class="meta"><div class="nm"><a href="customer-details.html?id=' + i.customer + '">' + esc(i.customerName) + '</a></div><div class="em">' + esc(i.company) + '</div></div></div></td><td class="plan-cell">' + esc(i.plan) + '</td><td class="muted">' + esc(i.date) + '</td><td class="muted">' + esc(i.due) + '</td><td class="amount mono">' + money(i.amount) + '</td><td>' + pill(i.status) + '</td><td class="row-acts"><button class="row-act" data-action="view" data-id="' + i.id + '" aria-label="View">' + ICONS.eye + '</button><button class="row-act" data-action="download" data-id="' + i.id + '" aria-label="Download">' + ICONS.download + '</button></td></tr>';
        }).join('') || '<tr><td colspan="8" class="empty-row">No invoices match your filters.</td></tr>';
        NS.renderPagination(document.getElementById('pagination'), state, rows.length, render);
      }
      render();
      document.getElementById('inv-filter').addEventListener('input', function () { state.filter = this.value; state.page = 1; render(); });
      document.getElementById('inv-status').addEventListener('change', function () { state.status = this.value; state.page = 1; render(); });
      document.getElementById('inv-rows').addEventListener('click', function (e) {
        var b = e.target.closest('[data-action="view"]'); if (b) { openInvoice(b.dataset.id); return; }
        var d = e.target.closest('[data-action="download"]'); if (d) { NS.toast('Downloading ' + d.dataset.id + ' as PDF', 'success'); return; }
      });

      function openInvoice(id) {
        var inv = DB.invoices.find(function (i) { return i.id === id; }); if (!inv) return;
        NS.modal({
          title: 'Invoice ' + id, size: 'lg',
          body: '<div class="invoice-paper" style="border:none;padding:0">' +
            '<div class="invoice-mast"><div class="brand-block"><div class="nm">Northstar Inc.</div><div class="d">123 Sveavägen, Stockholm</div></div><div class="meta-block"><div class="num">' + esc(id) + '</div><div class="d">Issued ' + esc(inv.date) + '</div></div></div>' +
            '<div class="invoice-parties"><div><div class="lbl">Billed to</div><div class="nm">' + esc(inv.customerName) + '</div><div class="d">' + esc(inv.company) + '</div></div><div><div class="lbl">Plan</div><div class="nm">' + esc(inv.plan) + '</div><div class="d">' + pill(inv.status) + '</div></div></div>' +
            '<div class="data-table-wrap"><table class="data"><thead><tr><th class="nosort">Description</th><th class="nosort" style="text-align:right">Amount</th></tr></thead><tbody><tr><td>' + esc(inv.plan) + ' plan — monthly</td><td class="amount mono">' + money(inv.amount) + '</td></tr></tbody></table></div>' +
            '<div class="invoice-totals" style="margin-top:16px"><div class="row"><span>Subtotal</span><span class="v">$0.00</span></div><div class="row"><span>Tax</span><span class="v">$0.00</span></div><div class="row total"><span>Total</span><span class="v">' + money(inv.amount) + '</span></div></div>' +
            '</div>',
          foot: '<button class="btn" data-cancel-modal>Close</button><button class="btn btn-primary" id="dl-inv">Download PDF</button>',
          onOpen: function (bd, close) {
            bd.querySelector('[data-cancel-modal]').addEventListener('click', close);
            bd.querySelector('#dl-inv').addEventListener('click', function () { close(); NS.toast('Downloading ' + id + ' as PDF', 'success'); });
          }
        });
      }
    });
  })();
  </script>
  
</body>
</html>
