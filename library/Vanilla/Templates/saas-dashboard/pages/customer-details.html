<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer details — Northstar | DevSnips</title>
  <meta name="description" content="Customer profile, subscription, revenue, activity, invoices, transactions, notes, and timeline.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-page="customers">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <main class="main" id="main" data-page="customers">
      <div id="crumbs"></div>
      <section class="panel mb-16">
        <div class="panel-body">
          <div class="entity-head">
            <span class="avatar lg" id="c-avatar"></span>
            <div class="info">
              <h1 id="c-name"></h1>
              <p class="sub" id="c-company"></p>
              <div class="meta" id="c-meta"></div>
            </div>
            <div class="acts">
              <a class="btn" href="customer-activity.html?id=c1"><span class="btn-text">View activity</span></a>
              <button class="btn" id="c-note"><span class="btn-text">Add note</span></button>
              <button class="btn btn-primary" id="c-email"><span class="btn-text">Email customer</span></button>
            </div>
          </div>
        </div>
      </section>

      <div data-tabs class="panel mb-0">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
          <button role="tab" data-tab="activity" aria-selected="false">Activity</button>
          <button role="tab" data-tab="invoices" aria-selected="false">Invoices <span class="tab-count" id="inv-count">0</span></button>
          <button role="tab" data-tab="transactions" aria-selected="false">Transactions</button>
          <button role="tab" data-tab="notes" aria-selected="false">Notes</button>
          <button role="tab" data-tab="metadata" aria-selected="false">Metadata</button>
        </div>

        <div class="tab-panel is-active" data-panel="overview">
          <div class="panel-body">
            <div class="grid-low mb-0">
              <div>
                <div class="stat-grid mb-16" id="c-stats"></div>
                <h3 class="font-bold mb-8">Subscription</h3>
                <div class="panel mb-0"><div class="panel-body" id="c-sub"></div></div>
              </div>
              <aside>
                <h3 class="font-bold mb-8">Account metadata</h3>
                <div class="panel mb-0"><div class="panel-body"><dl class="dl-grid" id="c-acc"></dl></div></div>
              </aside>
            </div>
          </div>
        </div>

        <div class="tab-panel" data-panel="activity">
          <div class="panel-body"><ul class="timeline-icon" id="c-activity"></ul></div>
        </div>

        <div class="tab-panel" data-panel="invoices">
          <div class="data-table-wrap"><table class="data"><thead><tr><th class="nosort">Invoice</th><th class="nosort">Date</th><th class="nosort" style="text-align:right">Amount</th><th class="nosort">Status</th><th class="nosort" style="text-align:right">Actions</th></tr></thead><tbody id="c-invoices"></tbody></table></div>
        </div>

        <div class="tab-panel" data-panel="transactions">
          <div class="data-table-wrap"><table class="data"><thead><tr><th class="nosort">Transaction</th><th class="nosort">Date</th><th class="nosort">Method</th><th class="nosort" style="text-align:right">Amount</th><th class="nosort">Status</th></tr></thead><tbody id="c-tx"></tbody></table></div>
        </div>

        <div class="tab-panel" data-panel="notes">
          <div class="panel-body">
            <div class="field"><textarea class="textarea" id="note-input" placeholder="Add a note about this customer…"></textarea></div>
            <button class="btn btn-primary btn-sm" id="save-note">Save note</button>
            <hr class="divider">
            <ul class="timeline" id="c-notes"></ul>
          </div>
        </div>

        <div class="tab-panel" data-panel="metadata">
          <div class="panel-body"><dl class="dl-grid" id="c-fullmeta"></dl></div>
        </div>
      </div>

      <footer class="foot">
        <span>© 2026 Northstar — DevSnips Vanilla template demo. Data is illustrative.</span>
        <div class="links"><a href="help-center.html">Docs</a><a href="support.html">Support</a><a href="system-status.html">Status</a></div>
      </footer>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
  (function () {
    'use strict';
    var NS = window.NS, DB = window.DB, money = NS.money, esc = NS.esc, pill = NS.pill, ICONS = NS.ICONS;
    function onReady(fn) { if (document.querySelector('.topbar')) fn(); else window.addEventListener('ns:ready', fn); }
    onReady(function () {
      var params = new URLSearchParams(location.search);
      var c = DB.customers.find(function (x) { return x.id === params.get('id'); }) || DB.customers[0];
      var inv = DB.invoices.filter(function (i) { return i.customer === c.id; });
      var tx = DB.transactions.filter(function (t) { return t.customer === c.id; });
      var acts = DB.activity.filter(function (a) { return a.who === c.name; });
      var notes = [
        { who: 'Alex Morgan', initials: 'AM', tone: NS.TONES.indigo, text: c.notes || 'No notes yet.', time: '2 days ago' }
      ];

      document.getElementById('crumbs').innerHTML = NS.crumbs([{label:'Customers',href:'customers.html'},{label:esc(c.name)}]);
      document.getElementById('c-avatar').textContent = c.initials; document.getElementById('c-avatar').style.background = c.tone;
      document.getElementById('c-name').textContent = c.name;
      document.getElementById('c-company').textContent = c.company + ' · ' + c.email;
      document.getElementById('c-meta').innerHTML =
        '<span class="item">' + ICONS.globe + esc(c.country) + '</span>' +
        '<span class="item">' + ICONS.team + c.seat + ' seats</span>' +
        '<span class="item">' + ICONS.plans + esc(c.plan) + ' plan</span>' +
        '<span class="item">' + pill(c.status) + '</span>';

      document.getElementById('c-stats').innerHTML = [
        { lbl: 'MRR', val: money(c.mrr) }, { lbl: 'ARR', val: money(c.arr) },
        { lbl: 'Seats', val: c.seat }, { lbl: 'Lifetime value', val: money(c.arr * 1.6) }
      ].map(function (s) { return '<div class="stat"><div class="lbl">' + s.lbl + '</div><div class="val">' + s.val + '</div></div>'; }).join('');

      document.getElementById('c-sub').innerHTML =
        '<dl class="dl-grid">' +
        '<div><dt>Plan</dt><dd>' + esc(c.plan) + '</dd></div>' +
        '<div><dt>Status</dt><dd>' + pill(c.status) + '</dd></div>' +
        '<div><dt>Started</dt><dd>' + esc(c.signup) + '</dd></div>' +
        '<div><dt>Seats</dt><dd>' + c.seat + '</dd></div>' +
        '<div><dt>Monthly</dt><dd class="mono">' + money(c.mrr) + '</dd></div>' +
        '<div><dt>Annual</dt><dd class="mono">' + money(c.arr) + '</dd></div>' +
        '</dl>';
      document.getElementById('c-acc').innerHTML =
        '<div><dt>Customer ID</dt><dd class="mono">' + esc(c.id) + '</dd></div>' +
        '<div><dt>Country</dt><dd>' + esc(c.country) + '</dd></div>' +
        '<div><dt>Last active</dt><dd>' + esc(c.lastActive) + '</dd></div>' +
        '<div><dt>Signup date</dt><dd>' + esc(c.signup) + '</dd></div>';

      document.getElementById('inv-count').textContent = inv.length;
      document.getElementById('c-invoices').innerHTML = inv.map(function (i) {
        return '<tr><td class="mono">' + esc(i.id) + '</td><td class="muted">' + esc(i.date) + '</td><td class="amount mono">' + money(i.amount) + '</td><td>' + pill(i.status) + '</td><td class="row-acts"><a class="row-act" href="invoices.html" aria-label="View">' + ICONS.eye + '</a><button class="row-act" data-toast="Downloading ' + esc(i.id) + '" aria-label="Download">' + ICONS.download + '</button></td></tr>';
      }).join('') || '<tr><td colspan="5" class="empty-row">No invoices for this customer.</td></tr>';

      document.getElementById('c-tx').innerHTML = tx.map(function (t) {
        return '<tr><td class="mono">' + esc(t.id) + '</td><td class="muted">' + esc(t.date) + '</td><td>' + esc(t.method) + '</td><td class="amount mono">' + money(t.amount) + '</td><td>' + pill(t.status) + '</td></tr>';
      }).join('') || '<tr><td colspan="5" class="empty-row">No transactions for this customer.</td></tr>';

      document.getElementById('c-activity').innerHTML = acts.map(function (a) {
        return '<li><span class="ic" style="background:' + a.tone + '">' + a.initials + '</span><div class="body"><p class="ev"><strong>' + esc(a.who) + '</strong> ' + esc(a.action) + ' <span class="c-accent font-semibold">' + esc(a.target) + '</span></p><p class="meta"><span>' + esc(a.category) + '</span><span class="sep">•</span><span>' + esc(a.time) + '</span></p></div></li>';
      }).join('') || '<li class="empty-row">No recent activity for this customer.</li>';

      function renderNotes() {
        document.getElementById('c-notes').innerHTML = notes.map(function (n, i) {
          var last = i === notes.length - 1;
          return '<li class="' + (last ? 'last' : '') + '"><span class="pic" style="background:' + n.tone + '">' + n.initials + '</span><div class="track"><p class="ev">' + esc(n.text) + '</p><p class="mt"><span class="dot neutral"></span>' + esc(n.who) + ' · ' + esc(n.time) + '</p></div></li>';
        }).join('');
      }
      renderNotes();
      document.getElementById('save-note').addEventListener('click', function () {
        var v = document.getElementById('note-input').value.trim();
        if (!v) { NS.toast('Please enter a note', 'danger'); return; }
        notes.unshift({ who: 'Alex Morgan', initials: 'AM', tone: NS.TONES.indigo, text: v, time: 'just now' });
        document.getElementById('note-input').value = ''; renderNotes(); NS.toast('Note added', 'success');
      });

      document.getElementById('c-fullmeta').innerHTML =
        '<div><dt>Customer ID</dt><dd class="mono">' + esc(c.id) + '</dd></div>' +
        '<div><dt>UUID</dt><dd class="mono">cus_' + esc(c.id) + '_9f2a1b</dd></div>' +
        '<div><dt>Name</dt><dd>' + esc(c.name) + '</dd></div>' +
        '<div><dt>Email</dt><dd>' + esc(c.email) + '</dd></div>' +
        '<div><dt>Company</dt><dd>' + esc(c.company) + '</dd></div>' +
        '<div><dt>Country</dt><dd>' + esc(c.country) + '</dd></div>' +
        '<div><dt>Plan</dt><dd>' + esc(c.plan) + '</dd></div>' +
        '<div><dt>Status</dt><dd>' + pill(c.status) + '</dd></div>' +
        '<div><dt>MRR</dt><dd class="mono">' + money(c.mrr) + '</dd></div>' +
        '<div><dt>ARR</dt><dd class="mono">' + money(c.arr) + '</dd></div>' +
        '<div><dt>Seats</dt><dd>' + c.seat + '</dd></div>' +
        '<div><dt>Signup</dt><dd>' + esc(c.signup) + '</dd></div>' +
        '<div><dt>Last active</dt><dd>' + esc(c.lastActive) + '</dd></div>' +
        '<div><dt>Timezone</dt><dd>UTC+1</dd></div>' +
        '<div><dt>Source</dt><dd>Organic search</dd></div>';

      document.getElementById('c-note').addEventListener('click', function () { NS.wireTabs(); document.querySelector('[data-tab="notes"]').click(); document.getElementById('note-input').focus(); });
      document.getElementById('c-email').addEventListener('click', function () { window.location.href = 'inbox.html'; });
    });
  })();
  </script>
  
</body>
</html>
