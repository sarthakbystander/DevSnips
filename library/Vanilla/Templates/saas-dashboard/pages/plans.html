<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plans — Northstar | DevSnips</title>
  <meta name="description" content="Compare plans, upgrade, downgrade, and review feature differences.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-page="plans">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <main class="main" id="main" data-page="plans">
      <div class="page-head">
        <div class="titles">
          <div id="crumbs"></div>
          <h1>Plans</h1>
          <p class="sub">Choose the plan that fits your team. Change or cancel anytime.</p>
        </div>
        <div class="page-actions">
          <div class="segmented" id="cycle" role="group" aria-label="Billing cycle"><button aria-pressed="true">Monthly</button><button aria-pressed="false">Annual · save 17%</button></div>
        </div>
      </div>

      <div class="grid-4" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px" id="plan-cards"></div>

      <section class="panel">
        <div class="panel-head"><div class="titles"><h2>Feature comparison</h2><p class="desc">A detailed breakdown of what each plan includes</p></div></div>
        <div class="data-table-wrap">
          <table class="data" id="compare-table"></table>
        </div>
      </section>

      <footer class="foot">
        <span>© 2026 Northstar — DevSnips Vanilla template demo. Data is illustrative.</span>
        <div class="links"><a href="help-center.html">Docs</a><a href="support.html">Support</a><a href="system-status.html">Status</a></div>
      </footer>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
  (function () {
    'use strict';
    var NS = window.NS, DB = window.DB, esc = NS.esc, ICONS = NS.ICONS;
    function onReady(fn) { if (document.querySelector('.topbar')) fn(); else window.addEventListener('ns:ready', fn); }
    onReady(function () {
      document.getElementById('crumbs').innerHTML = NS.crumbs([{label:'Revenue',href:'billing.html'},{label:'Plans'}]);
      function render(annual) {
        document.getElementById('plan-cards').innerHTML = DB.plans.map(function (p) {
          var price = p.price == null ? 'Custom' : annual ? '$' + Math.round(p.price * 10).toLocaleString() + '/yr' : '$' + p.price + '/mo';
          var cta = p.current ? '<button class="btn btn-block" disabled>Current plan</button>' : p.price == null ? '<button class="btn btn-block" data-toast="Contacting sales…">Contact sales</button>' : '<button class="btn btn-primary btn-block" data-action="change" data-plan="' + esc(p.name) + '">' + (p.price > 840 ? 'Upgrade' : 'Downgrade') + '</button>';
          var badge = p.popular ? '<span class="tag" style="background:var(--ds-accent-soft);color:var(--ds-accent);border-color:transparent">Most popular</span>' : p.current ? '<span class="tag" style="background:var(--ds-success-soft);color:var(--ds-success);border-color:transparent">Current</span>' : '';
          var feats = p.features.map(function (f) { return '<li class="flex items-center gap-8 mb-8"><span class="c-success">' + ICONS.check + '</span><span>' + esc(f) + '</span></li>'; }).join('');
          return '<section class="panel mb-0" style="display:flex;flex-direction:column;' + (p.popular ? 'border-color:var(--ds-accent);box-shadow:var(--ds-shadow-md)' : '') + '">' +
            '<div class="panel-body" style="flex:1;display:flex;flex-direction:column">' +
            '<div class="flex items-center justify-between mb-8"><h3 class="font-bold">' + esc(p.name) + '</h3>' + badge + '</div>' +
            '<p class="muted-block mb-16">' + esc(p.desc) + '</p>' +
            '<div class="font-bold mb-16" style="font-size:28px">' + price + '</div>' +
            '<ul style="list-style:none;margin:0;padding:0;flex:1">' + feats + '</ul>' +
            '<div class="mt-16">' + cta + '</div>' +
            '</div></section>';
        }).join('');

        // comparison table
        var allFeats = ['Workspaces', 'Members', 'API calls/mo', 'Support', 'Analytics', 'Custom segments', 'API access', 'Webhooks', 'Audit logs', 'SSO & SAML', 'Dedicated CSM', 'On-premise'];
        var matrix = {
          Starter: ['1 workspace', '3 members', '10k', 'Email', 'Basic', '—', '—', '—', '—', '—', '—', '—'],
          Growth: ['5 workspaces', '15 members', '250k', 'Priority', 'Advanced', '✓', '✓', '—', '—', '—', '—', '—'],
          Scale: ['Unlimited', '50 members', '1M', '24/7 priority', 'Real-time', '✓', '✓', '✓', '✓', '—', '—', '—'],
          Enterprise: ['Unlimited', 'Unlimited', 'Unlimited', 'Dedicated', 'Real-time', '✓', '✓', '✓', '✓', '✓', '✓', '✓']
        };
        var plans = ['Starter', 'Growth', 'Scale', 'Enterprise'];
        var thead = '<thead><tr><th class="nosort">Feature</th>' + plans.map(function (p) { return '<th class="nosort" style="text-align:center">' + p + (DB.plans.find(function (x) { return x.name === p; }).current ? '<br><span class="pill plain" style="font-size:10px">Current</span>' : '') + '</th>'; }).join('') + '</tr></thead>';
        var body = '<tbody>' + allFeats.map(function (f, i) {
          return '<tr><td class="font-semibold">' + esc(f) + '</td>' + plans.map(function (p) {
            var v = matrix[p][i];
            if (v === '✓') return '<td style="text-align:center" class="c-success">' + ICONS.check + '</td>';
            if (v === '—') return '<td style="text-align:center" class="text-muted">—</td>';
            return '<td style="text-align:center">' + esc(v) + '</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody>';
        document.getElementById('compare-table').innerHTML = thead + body;
      }
      render(false);
      document.getElementById('cycle').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        render(b.textContent.indexOf('Annual') > -1);
      });
      document.getElementById('plan-cards').addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action="change"]'); if (!btn) return;
        var plan = btn.dataset.plan, current = 'Scale';
        if (plan === current) return;
        NS.confirm({
          title: 'Switch to ' + plan + '?',
          message: 'You are about to ' + (DB.plans.find(function(p){return p.name===plan}).price > 840 ? 'upgrade' : 'downgrade') + ' from Scale to ' + plan + '. Your next invoice will be prorated.',
          confirmLabel: 'Switch plan',
          onConfirm: function () { NS.toast('Switched to ' + plan + ' plan', 'success'); }
        });
      });
    });
  })();
  </script>
  
</body>
</html>
