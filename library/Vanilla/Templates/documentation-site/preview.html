<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSnips — Documentation (Preview)</title>
    <meta name="description" content="DevSnips — A premium, framework-free frontend component library. Copy-paste components, templates, and design tokens.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M8 12l8-4 8 4-8 4-8-4z' fill='white' opacity='0.9'/%3E%3Cpath d='M8 16l8 4 8-4M8 20l8 4 8-4' stroke='white' stroke-width='2' fill='none' opacity='0.7'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --ds-white: #fafbfc;
            --ds-gray-0: #f8f9fa;
            --ds-gray-25: #f1f3f5;
            --ds-gray-50: #e9ecef;
            --ds-gray-100: #dee2e6;
            --ds-gray-150: #ced4da;
            --ds-gray-200: #adb5bd;
            --ds-gray-300: #868e96;
            --ds-gray-400: #6c757d;
            --ds-gray-500: #495057;
            --ds-gray-600: #343a40;
            --ds-gray-700: #2b3035;
            --ds-gray-800: #1e2125;
            --ds-gray-850: #181a1d;
            --ds-gray-900: #141618;
            --ds-gray-950: #0d0e10;
            --ds-accent-50: #eff3ff;
            --ds-accent-100: #dbe4ff;
            --ds-accent-200: #bac8ff;
            --ds-accent-300: #91a7ff;
            --ds-accent-400: #748ffc;
            --ds-accent-500: #5c7cfa;
            --ds-accent-600: #4c6ef5;
            --ds-accent-700: #4263eb;
            --ds-accent-800: #3b5bdb;
            --ds-accent-900: #364fc7;
            --ds-bg-canvas: #f8f9fa;
            --ds-bg-surface: #ffffff;
            --ds-bg-surface-subtle: #fcfcfd;
            --ds-bg-sunken: #f1f3f5;
            --ds-bg-overlay: rgba(13, 14, 16, 0.45);
            --ds-text-primary: #141618;
            --ds-text-secondary: #495057;
            --ds-text-muted: #868e96;
            --ds-text-faint: #adb5bd;
            --ds-text-inverse: #fafbfc;
            --ds-border-subtle: #e9ecef;
            --ds-border-default: #dee2e6;
            --ds-border-strong: #ced4da;
            --ds-border-focus: #4c6ef5;
            --ds-action-primary: #4c6ef5;
            --ds-action-primary-hover: #4263eb;
            --ds-action-primary-active: #3b5bdb;
            --ds-action-secondary: #ffffff;
            --ds-action-secondary-hover: #f8f9fa;
            --ds-status-success: #2b8a3e;
            --ds-status-success-bg: #ebfbee;
            --ds-status-success-border: #b2f2bb;
            --ds-status-warning: #e67700;
            --ds-status-warning-bg: #fff9db;
            --ds-status-warning-border: #ffec99;
            --ds-status-danger: #c92a2a;
            --ds-status-danger-bg: #fff5f5;
            --ds-status-danger-border: #ffc9c9;
            --ds-status-info: #1864ab;
            --ds-status-info-bg: #e7f5ff;
            --ds-status-info-border: #a5d8ff;
            --ds-font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --ds-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            --ds-text-xs: 11.5px;
            --ds-text-sm: 13px;
            --ds-text-md: 14.5px;
            --ds-text-lg: 16px;
            --ds-text-xl: 19px;
            --ds-text-2xl: 22px;
            --ds-text-3xl: 28px;
            --ds-text-4xl: 34px;
            --ds-weight-regular: 400;
            --ds-weight-medium: 500;
            --ds-weight-semibold: 600;
            --ds-weight-bold: 700;
            --ds-leading-tight: 1.2;
            --ds-leading-snug: 1.4;
            --ds-leading-normal: 1.6;
            --ds-leading-relaxed: 1.7;
            --ds-tracking-tight: -0.015em;
            --ds-tracking-normal: 0;
            --ds-space-1: 4px;
            --ds-space-2: 8px;
            --ds-space-3: 12px;
            --ds-space-4: 16px;
            --ds-space-5: 20px;
            --ds-space-6: 24px;
            --ds-space-8: 32px;
            --ds-space-10: 40px;
            --ds-space-12: 48px;
            --ds-space-16: 64px;
            --ds-radius-xs: 4px;
            --ds-radius-sm: 6px;
            --ds-radius-md: 8px;
            --ds-radius-lg: 10px;
            --ds-radius-xl: 14px;
            --ds-radius-full: 9999px;
            --ds-shadow-xs: 0 1px 2px rgba(13, 14, 16, 0.04);
            --ds-shadow-sm: 0 2px 6px rgba(13, 14, 16, 0.06);
            --ds-shadow-md: 0 4px 16px rgba(13, 14, 16, 0.08);
            --ds-shadow-lg: 0 8px 32px rgba(13, 14, 16, 0.12);
            --ds-shadow-xl: 0 16px 48px rgba(13, 14, 16, 0.16);
            --ds-duration-fast: 100ms;
            --ds-duration-normal: 180ms;
            --ds-duration-slow: 280ms;
            --ds-ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
            --ds-ease-out: cubic-bezier(0, 0, 0.2, 1);
            --ds-ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            --ds-z-sticky: 100;
            --ds-z-overlay: 200;
            --ds-z-drawer: 300;
            --ds-z-modal: 400;
            --template-sidebar-width: 268px;
            --template-toc-width: 210px;
            --template-content-max: 740px;
            --template-header-height: 56px;
            --template-accent: #4c6ef5;
            --template-accent-soft: rgba(76, 110, 245, 0.08);
            --template-accent-glow: rgba(76, 110, 245, 0.18);
            --c-bg: #f8f9fa;
            --c-bg-inline: #e9ecef;
            --c-fg: #141618;
            --c-comment: #868e96;
            --c-punct: #495057;
            --c-tag: #1864ab;
            --c-attr: #6741d9;
            --c-string: #2b8a3e;
            --c-number: #c92a2a;
            --c-keyword: #862e9c;
            --c-fn: #0b7285;
            --c-prop: #e67700;
        }

        [data-theme="dark"] {
            --ds-bg-canvas: #0d0e10;
            --ds-bg-surface: #141618;
            --ds-bg-surface-subtle: #181a1d;
            --ds-bg-sunken: #1e2125;
            --ds-bg-overlay: rgba(0, 0, 0, 0.7);
            --ds-text-primary: #e9ecef;
            --ds-text-secondary: #adb5bd;
            --ds-text-muted: #6c757d;
            --ds-text-faint: #495057;
            --ds-text-inverse: #0d0e10;
            --ds-border-subtle: #1e2125;
            --ds-border-default: #2b3035;
            --ds-border-strong: #343a40;
            --ds-border-focus: #748ffc;
            --ds-action-primary: #748ffc;
            --ds-action-primary-hover: #91a7ff;
            --ds-action-primary-active: #5c7cfa;
            --ds-action-secondary: #1e2125;
            --ds-action-secondary-hover: #2b3035;
            --ds-status-success: #51cf66;
            --ds-status-success-bg: #0b2e15;
            --ds-status-success-border: #1a4d28;
            --ds-status-warning: #ffa94d;
            --ds-status-warning-bg: #2e1a04;
            --ds-status-warning-border: #4a2808;
            --ds-status-danger: #ff6b6b;
            --ds-status-danger-bg: #2e0a0f;
            --ds-status-danger-border: #4a151a;
            --ds-status-info: #74c0fc;
            --ds-status-info-bg: #0a1e33;
            --ds-status-info-border: #143054;
            --ds-shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
            --ds-shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
            --ds-shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
            --ds-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
            --ds-shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.7);
            --template-accent: #748ffc;
            --template-accent-soft: rgba(116, 143, 252, 0.12);
            --template-accent-glow: rgba(116, 143, 252, 0.22);
            --c-bg: #141618;
            --c-bg-inline: #1e2125;
            --c-fg: #e9ecef;
            --c-comment: #6c757d;
            --c-punct: #adb5bd;
            --c-tag: #74c0fc;
            --c-attr: #b197fc;
            --c-string: #69db7c;
            --c-number: #ffa8a8;
            --c-keyword: #e599f7;
            --c-fn: #66d9e8;
            --c-prop: #ffd43b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
        body {
            margin: 0;
            font-family: var(--ds-font-sans);
            font-size: var(--ds-text-md);
            line-height: var(--ds-leading-normal);
            color: var(--ds-text-primary);
            background: var(--ds-bg-canvas);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        ul,
        ol,
        figure {
            margin: 0;
        }
        a {
            color: var(--template-accent);
            text-decoration: none;
            transition: color var(--ds-duration-fast);
        }
        a:hover {
            text-decoration: underline;
            color: var(--ds-action-primary-hover);
        }
        img,
        svg {
            display: block;
            max-width: 100%;
        }
        code,
        kbd,
        samp,
        pre {
            font-family: var(--ds-font-mono);
            font-feature-settings: 'tnum'1, 'liga'0;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--ds-border-strong);
            border-radius: var(--ds-radius-full);
            border: 2px solid transparent;
            background-clip: content-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--ds-text-faint);
            background-clip: content-box;
        }
        :focus-visible {
            outline: 2.5px solid var(--ds-border-focus);
            outline-offset: 3px;
            border-radius: var(--ds-radius-xs);
        }
        .skip-link {
            position: absolute;
            left: -9999px;
            top: 10px;
            z-index: 9999;
            background: var(--ds-action-primary);
            color: #fff;
            padding: 10px 18px;
            border-radius: var(--ds-radius-md);
            font-weight: 600;
            font-size: var(--ds-text-sm);
            letter-spacing: 0.01em;
        }
        .skip-link:focus {
            left: 10px;
        }
        .no-js .page {
            display: block;
        }
        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .app-header {
            position: sticky;
            top: 0;
            z-index: var(--ds-z-sticky);
            height: var(--template-header-height);
            display: flex;
            align-items: center;
            gap: var(--ds-space-4);
            padding: 0 var(--ds-space-6);
            background: color-mix(in srgb, var(--ds-bg-surface) 82%, transparent);
            backdrop-filter: saturate(200%) blur(16px);
            -webkit-backdrop-filter: saturate(200%) blur(16px);
            border-bottom: 1px solid var(--ds-border-subtle);
            transition: background var(--ds-duration-normal), border-color var(--ds-duration-normal);
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: var(--ds-weight-bold);
            font-size: var(--ds-text-md);
            color: var(--ds-text-primary);
            letter-spacing: var(--ds-tracking-tight);
            white-space: nowrap;
            transition: opacity var(--ds-duration-fast);
        }
        .app-header .brand:hover {
            text-decoration: none;
            opacity: 0.85;
        }
        .app-header .brand .brand-icon {
            width: 28px;
            height: 28px;
            flex: none;
            border-radius: var(--ds-radius-sm);
            background: linear-gradient(135deg, var(--ds-accent-600), var(--ds-accent-800));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 2px 8px var(--template-accent-glow);
        }
        .app-header .brand .wordmark {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }
        .app-header .brand .wordmark small {
            font-size: 10px;
            font-weight: var(--ds-weight-medium);
            color: var(--ds-text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .header-search {
            flex: 1;
            max-width: 440px;
            position: relative;
        }
        .header-search .search-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            width: 100%;
            height: 38px;
            padding: 0 14px 0 38px;
            font-size: var(--ds-text-sm);
            font-family: var(--ds-font-sans);
            color: var(--ds-text-muted);
            background: var(--ds-bg-sunken);
            border: 1.5px solid transparent;
            border-radius: var(--ds-radius-md);
            outline: none;
            cursor: pointer;
            text-align: left;
            transition: all var(--ds-duration-normal);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-search .search-trigger:hover {
            background: var(--ds-bg-surface);
            border-color: var(--ds-border-default);
            box-shadow: var(--ds-shadow-sm);
            color: var(--ds-text-secondary);
        }
        .header-search .search-trigger:focus-visible {
            border-color: var(--ds-border-focus);
            box-shadow: 0 0 0 4px var(--template-accent-soft);
            background: var(--ds-bg-surface);
        }
        .header-search .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            color: var(--ds-text-muted);
            pointer-events: none;
        }
        .header-search .kbd-hint {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--ds-font-mono);
            font-size: 10px;
            color: var(--ds-text-faint);
            background: var(--ds-bg-surface);
            border: 1px solid var(--ds-border-default);
            border-radius: var(--ds-radius-xs);
            padding: 2px 6px;
            line-height: 1.3;
            pointer-events: none;
            letter-spacing: 0.03em;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--ds-space-1);
            margin-left: auto;
        }
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex: none;
            border-radius: var(--ds-radius-md);
            color: var(--ds-text-secondary);
            background: transparent;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all var(--ds-duration-fast);
            position: relative;
        }
        .icon-btn:hover {
            background: var(--ds-bg-sunken);
            color: var(--ds-text-primary);
            text-decoration: none;
            border-color: var(--ds-border-subtle);
        }
        .icon-btn:active {
            transform: scale(0.94);
        }
        .icon-btn svg {
            width: 17px;
            height: 17px;
            transition: transform var(--ds-duration-normal);
        }
        .icon-btn:hover svg {
            transform: scale(1.08);
        }
        .menu-toggle {
            display: none;
        }

        /* Body grid */
        .app-body {
            flex: 1;
            display: grid;
            grid-template-columns: var(--template-sidebar-width) minmax(0, 1fr) var(--template-toc-width);
            align-items: start;
            max-width: 100%;
        }
        .app-sidebar {
            position: sticky;
            top: var(--template-header-height);
            height: calc(100vh - var(--template-header-height));
            overflow-y: auto;
            overflow-x: hidden;
            border-right: 1px solid var(--ds-border-subtle);
            background: var(--ds-bg-surface-subtle);
            padding: var(--ds-space-5) var(--ds-space-4) var(--ds-space-16);
            transition: background var(--ds-duration-slow);
        }
        .app-main {
            min-width: 0;
            min-height: calc(100vh - var(--template-header-height));
            padding: var(--ds-space-8) var(--ds-space-10) var(--ds-space-16);
            background: var(--ds-bg-canvas);
        }
        .app-toc {
            position: sticky;
            top: var(--template-header-height);
            height: calc(100vh - var(--template-header-height));
            overflow-y: auto;
            padding: var(--ds-space-8) var(--ds-space-5) var(--ds-space-16);
            border-left: 1px solid var(--ds-border-subtle);
            background: var(--ds-bg-surface-subtle);
        }

        /* Sidebar */
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: var(--ds-space-5);
        }
        .nav-group-label {
            font-size: 10px;
            font-weight: var(--ds-weight-semibold);
            color: var(--ds-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            padding: 0 var(--ds-space-3) var(--ds-space-1);
            margin-bottom: 2px;
        }
        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: var(--ds-space-2);
            padding: 6px var(--ds-space-3);
            border-radius: var(--ds-radius-sm);
            font-size: var(--ds-text-sm);
            color: var(--ds-text-secondary);
            line-height: 1.4;
            transition: all var(--ds-duration-fast);
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: var(--ds-font-sans);
            position: relative;
        }
        .nav-link:hover {
            background: var(--ds-bg-sunken);
            color: var(--ds-text-primary);
            text-decoration: none;
        }
        .nav-link[aria-current="page"] {
            color: var(--template-accent);
            font-weight: var(--ds-weight-semibold);
            background: var(--template-accent-soft);
            box-shadow: inset 3px 0 0 var(--template-accent);
        }
        .nav-link .nav-chev {
            margin-left: auto;
            width: 13px;
            height: 13px;
            flex: none;
            transition: transform var(--ds-duration-normal) var(--ds-ease-out);
            color: var(--ds-text-faint);
            opacity: 0.7;
        }
        .nav-item.expanded>.nav-link .nav-chev {
            transform: rotate(90deg);
        }
        .nav-children {
            list-style: none;
            padding-left: var(--ds-space-5);
            margin: 1px 0 3px;
            display: none;
            border-left: 1.5px solid var(--ds-border-subtle);
            margin-left: 8px;
        }
        .nav-item.expanded>.nav-children {
            display: block;
            animation: slideDown var(--ds-duration-normal) var(--ds-ease-out);
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 200px;
            }
        }
        .nav-children .nav-link {
            font-size: var(--ds-text-xs);
            padding: 5px var(--ds-space-3);
            border-radius: var(--ds-radius-xs);
        }
        .nav-children .nav-link[aria-current="page"] {
            box-shadow: inset 2px 0 0 var(--template-accent);
        }
        .nav-filter {
            width: 100%;
            height: 34px;
            padding: 0 var(--ds-space-3);
            font-size: var(--ds-text-xs);
            color: var(--ds-text-primary);
            background: var(--ds-bg-sunken);
            border: 1.5px solid transparent;
            border-radius: var(--ds-radius-md);
            outline: none;
            margin-bottom: var(--ds-space-4);
            transition: all var(--ds-duration-normal);
            font-family: var(--ds-font-sans);
        }
        .nav-filter:focus {
            background: var(--ds-bg-surface);
            border-color: var(--ds-border-focus);
            box-shadow: 0 0 0 3px var(--template-accent-soft);
        }
        .nav-filter::placeholder {
            color: var(--ds-text-faint);
        }
        .drawer-close {
            display: none;
        }

        /* Breadcrumbs */
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: var(--ds-text-xs);
            color: var(--ds-text-muted);
            margin-bottom: var(--ds-space-5);
        }
        .breadcrumbs a {
            color: var(--ds-text-muted);
            transition: color var(--ds-duration-fast);
        }
        .breadcrumbs a:hover {
            color: var(--ds-text-primary);
            text-decoration: none;
        }
        .breadcrumbs .sep {
            color: var(--ds-text-faint);
            width: 11px;
            height: 11px;
            flex: none;
        }
        .breadcrumbs .current {
            color: var(--ds-text-secondary);
            font-weight: var(--ds-weight-medium);
        }

        /* Article meta */
        .article-meta {
            display: flex;
            align-items: center;
            gap: var(--ds-space-5);
            flex-wrap: wrap;
            font-size: var(--ds-text-xs);
            color: var(--ds-text-muted);
            border-bottom: 1px solid var(--ds-border-subtle);
            padding-bottom: var(--ds-space-5);
            margin-bottom: var(--ds-space-8);
        }
        .article-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .article-meta .meta-item svg {
            width: 13px;
            height: 13px;
            color: var(--ds-text-faint);
        }
        .article-meta .meta-sep {
            color: var(--ds-text-faint);
        }

        /* Page */
        .page {
            max-width: var(--template-content-max);
        }
        .page.active {
            display: block;
        }
        .fade-in {
            animation: fadeSlideIn var(--ds-duration-slow) var(--ds-ease-out);
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .eyebrow {
            font-size: var(--ds-text-xs);
            font-weight: var(--ds-weight-semibold);
            color: var(--template-accent);
            letter-spacing: 0.09em;
            text-transform: uppercase;
            margin-bottom: var(--ds-space-3);
        }
        .page h1,
        .home-hero h1 {
            font-size: var(--ds-text-4xl);
            font-weight: var(--ds-weight-bold);
            letter-spacing: var(--ds-tracking-tight);
            line-height: var(--ds-leading-tight);
            color: var(--ds-text-primary);
            margin-bottom: var(--ds-space-4);
        }
        .page .lead,
        .home-hero .lead {
            font-size: var(--ds-text-lg);
            line-height: var(--ds-leading-relaxed);
            color: var(--ds-text-secondary);
            margin-bottom: var(--ds-space-6);
            max-width: 64ch;
        }
        .page h2 {
            font-size: var(--ds-text-2xl);
            font-weight: var(--ds-weight-semibold);
            letter-spacing: var(--ds-tracking-tight);
            line-height: var(--ds-leading-tight);
            margin-top: var(--ds-space-12);
            margin-bottom: var(--ds-space-4);
            padding-top: var(--ds-space-2);
            scroll-margin-top: calc(var(--template-header-height) + 20px);
            position: relative;
        }
        .page h2::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -16px;
            width: 4px;
            height: 18px;
            background: var(--template-accent);
            border-radius: 2px;
            opacity: 0;
            transition: opacity var(--ds-duration-normal);
        }
        .page h2:hover::before {
            opacity: 0.5;
        }
        .page h2:first-of-type {
            margin-top: var(--ds-space-8);
        }
        .page h3 {
            font-size: var(--ds-text-lg);
            font-weight: var(--ds-weight-semibold);
            margin-top: var(--ds-space-8);
            margin-bottom: var(--ds-space-3);
            scroll-margin-top: calc(var(--template-header-height) + 20px);
        }
        .page p {
            margin-bottom: var(--ds-space-4);
            color: var(--ds-text-primary);
            line-height: var(--ds-leading-normal);
        }
        .page p:last-child {
            margin-bottom: 0;
        }
        .page ul,
        .page ol {
            padding-left: var(--ds-space-6);
            margin-bottom: var(--ds-space-4);
        }
        .page li {
            margin-bottom: var(--ds-space-2);
            line-height: var(--ds-leading-normal);
        }
        .page li:last-child {
            margin-bottom: 0;
        }
        .page strong {
            font-weight: var(--ds-weight-semibold);
            color: var(--ds-text-primary);
        }
        .page img {
            border-radius: var(--ds-radius-md);
            border: 1px solid var(--ds-border-subtle);
            margin: var(--ds-space-4) 0;
        }
        .page hr {
            border: 0;
            border-top: 1px solid var(--ds-border-subtle);
            margin: var(--ds-space-8) 0;
        }
        .page :not(pre)>code {
            font-size: 0.86em;
            padding: 2px 6px;
            border-radius: var(--ds-radius-xs);
            background: var(--c-bg-inline);
            color: var(--c-tag);
            border: 1px solid var(--ds-border-subtle);
            white-space: nowrap;
            font-weight: 500;
        }
        @media (max-width: 480px) {
            .page :not(pre)>code {
                white-space: normal;
                word-break: break-word;
            }
        }
        [data-theme="dark"] .page :not(pre)>code {
            color: var(--c-attr);
        }

        /* Code blocks */
        .code-block {
            position: relative;
            margin: var(--ds-space-5) 0;
            border-radius: var(--ds-radius-md);
            border: 1px solid var(--ds-border-default);
            background: var(--c-bg);
            overflow: hidden;
            box-shadow: var(--ds-shadow-xs);
            transition: box-shadow var(--ds-duration-normal);
        }
        .code-block:hover {
            box-shadow: var(--ds-shadow-sm);
        }
        .code-block .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--ds-space-4);
            height: 36px;
            background: var(--ds-bg-surface-subtle);
            border-bottom: 1px solid var(--ds-border-default);
            font-size: var(--ds-text-xs);
            color: var(--ds-text-muted);
        }
        .code-block .code-lang {
            font-family: var(--ds-font-mono);
            font-weight: var(--ds-weight-medium);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .code-block .code-lang::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ds-accent-400);
            flex: none;
        }
        .code-block .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            background: transparent;
            border: none;
            color: var(--ds-text-muted);
            font-size: var(--ds-text-xs);
            font-family: var(--ds-font-sans);
            padding: 4px 8px;
            border-radius: var(--ds-radius-xs);
            transition: all var(--ds-duration-fast);
            font-weight: 500;
        }
        .code-block .copy-btn:hover {
            color: var(--ds-text-primary);
            background: var(--ds-bg-sunken);
        }
        .code-block .copy-btn svg {
            width: 13px;
            height: 13px;
        }
        .code-block .copy-btn .copy-label::after {
            content: "Copy";
        }
        .code-block .copy-btn.copied {
            color: var(--ds-status-success);
        }
        .code-block .copy-btn.copied .copy-label::after {
            content: "Copied!";
        }
        .code-block pre {
            margin: 0;
            padding: var(--ds-space-4);
            overflow-x: auto;
            font-size: var(--ds-text-sm);
            line-height: var(--ds-leading-relaxed);
            font-family: var(--ds-font-mono);
            color: var(--c-fg);
            background: var(--c-bg);
            tab-size: 2;
        }
        .code-block pre code {
            font-size: inherit;
            background: none;
            border: none;
            padding: 0;
            color: inherit;
            white-space: pre;
        }
        .code-tabs {
            margin: var(--ds-space-5) 0;
            border-radius: var(--ds-radius-md);
            border: 1px solid var(--ds-border-default);
            overflow: hidden;
            background: var(--c-bg);
            box-shadow: var(--ds-shadow-xs);
        }
        .code-tabs .tabs-bar {
            display: flex;
            border-bottom: 1px solid var(--ds-border-default);
            background: var(--ds-bg-surface-subtle);
            overflow-x: auto;
        }
        .code-tabs .code-tab {
            appearance: none;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0 var(--ds-space-4);
            height: 36px;
            font-size: var(--ds-text-xs);
            font-family: var(--ds-font-mono);
            color: var(--ds-text-muted);
            border-right: 1px solid var(--ds-border-subtle);
            position: relative;
            transition: all var(--ds-duration-fast);
            white-space: nowrap;
            flex: none;
        }
        .code-tabs .code-tab:hover {
            color: var(--ds-text-primary);
            background: rgba(0, 0, 0, 0.03);
        }
        .code-tabs .code-tab[aria-selected="true"] {
            color: var(--template-accent);
            background: var(--c-bg);
            font-weight: var(--ds-weight-medium);
        }
        .code-tabs .code-tab[aria-selected="true"]::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 2.5px;
            background: var(--template-accent);
            border-radius: 2px 2px 0 0;
        }
        .code-tabs .tab-panel {
            display: none;
        }
        .code-tabs .tab-panel.active {
            display: block;
        }
        .code-tabs .tab-panel pre {
            margin: 0;
            padding: var(--ds-space-4);
            overflow-x: auto;
            font-size: var(--ds-text-sm);
            line-height: var(--ds-leading-relaxed);
            font-family: var(--ds-font-mono);
            color: var(--c-fg);
            background: var(--c-bg);
        }
        .tok-com {
            color: var(--c-comment);
            font-style: italic;
        }
        .tok-pun {
            color: var(--c-punct);
        }
        .tok-tag {
            color: var(--c-tag);
        }
        .tok-att {
            color: var(--c-attr);
        }
        .tok-str {
            color: var(--c-string);
        }
        .tok-num {
            color: var(--c-number);
        }
        .tok-key {
            color: var(--c-keyword);
        }
        .tok-fn {
            color: var(--c-fn);
        }
        .tok-prop {
            color: var(--c-prop);
        }

        /* Callouts */
        .callout {
            display: flex;
            gap: var(--ds-space-3);
            padding: var(--ds-space-4) var(--ds-space-5);
            border-radius: var(--ds-radius-md);
            border: 1px solid var(--ds-border-default);
            background: var(--ds-bg-surface);
            margin: var(--ds-space-5) 0;
            border-left-width: 3px;
            transition: box-shadow var(--ds-duration-normal);
        }
        .callout:hover {
            box-shadow: var(--ds-shadow-sm);
        }
        .callout .callout-icon {
            flex: none;
            width: 18px;
            height: 18px;
            margin-top: 1px;
        }
        .callout .callout-body {
            font-size: var(--ds-text-sm);
            line-height: var(--ds-leading-normal);
        }
        .callout .callout-body p {
            margin-bottom: var(--ds-space-2);
        }
        .callout .callout-body strong {
            font-weight: var(--ds-weight-semibold);
        }
        .callout-info {
            border-left-color: var(--ds-status-info);
            background: var(--ds-status-info-bg);
        }
        .callout-info .callout-icon {
            color: var(--ds-status-info);
        }
        .callout-note {
            border-left-color: var(--ds-border-strong);
        }
        .callout-note .callout-icon {
            color: var(--ds-text-secondary);
        }
        .callout-tip {
            border-left-color: var(--ds-status-success);
            background: var(--ds-status-success-bg);
        }
        .callout-tip .callout-icon {
            color: var(--ds-status-success);
        }
        .callout-warning {
            border-left-color: var(--ds-status-warning);
            background: var(--ds-status-warning-bg);
        }
        .callout-warning .callout-icon {
            color: var(--ds-status-warning);
        }
        .callout-danger {
            border-left-color: var(--ds-status-danger);
            background: var(--ds-status-danger-bg);
        }
        .callout-danger .callout-icon {
            color: var(--ds-status-danger);
        }

        /* Tables */
        .table-wrap {
            overflow-x: auto;
            margin: var(--ds-space-5) 0;
            border: 1px solid var(--ds-border-default);
            border-radius: var(--ds-radius-md);
            box-shadow: var(--ds-shadow-xs);
        }
        table.docs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--ds-text-sm);
            background: var(--ds-bg-surface);
        }
        table.docs-table th,
        table.docs-table td {
            padding: 10px var(--ds-space-4);
            text-align: left;
            border-bottom: 1px solid var(--ds-border-subtle);
            vertical-align: top;
        }
        table.docs-table thead th {
            font-weight: var(--ds-weight-semibold);
            color: var(--ds-text-secondary);
            background: var(--ds-bg-surface-subtle);
            border-bottom: 1px solid var(--ds-border-default);
            font-size: var(--ds-text-xs);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        table.docs-table tbody tr:last-child td {
            border-bottom: 0;
        }
        table.docs-table tbody tr {
            transition: background var(--ds-duration-fast);
        }
        table.docs-table tbody tr:hover {
            background: var(--ds-bg-surface-subtle);
        }
        table.docs-table td code {
            font-size: 0.85em;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: var(--ds-radius-full);
            font-size: 10.5px;
            font-weight: var(--ds-weight-semibold);
            letter-spacing: 0.03em;
            line-height: 1.5;
            font-family: var(--ds-font-sans);
            border: 1px solid transparent;
            white-space: nowrap;
            vertical-align: middle;
        }
        .badge-stable {
            background: var(--ds-status-success-bg);
            color: var(--ds-status-success);
            border-color: var(--ds-status-success-border);
        }
        .badge-beta {
            background: var(--ds-status-info-bg);
            color: var(--ds-status-info);
            border-color: var(--ds-status-info-border);
        }
        .badge-new {
            background: var(--ds-accent-50);
            color: var(--ds-accent-700);
            border-color: var(--ds-accent-200);
        }
        .badge-deprecated {
            background: var(--ds-status-danger-bg);
            color: var(--ds-status-danger);
            border-color: var(--ds-status-danger-border);
        }
        .badge-neutral {
            background: var(--ds-bg-sunken);
            color: var(--ds-text-secondary);
            border-color: var(--ds-border-default);
        }
        .badge-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            flex: none;
        }

        /* API reference */
        .api-block {
            margin: var(--ds-space-6) 0;
            border: 1px solid var(--ds-border-default);
            border-radius: var(--ds-radius-md);
            overflow: hidden;
            box-shadow: var(--ds-shadow-xs);
        }
        .api-head {
            padding: var(--ds-space-4) var(--ds-space-5);
            border-bottom: 1px solid var(--ds-border-subtle);
            background: var(--ds-bg-surface-subtle);
        }
        .api-signature {
            font-family: var(--ds-font-mono);
            font-size: var(--ds-text-sm);
            color: var(--ds-text-primary);
            word-break: break-word;
        }
        .api-signature .api-name {
            color: var(--template-accent);
            font-weight: var(--ds-weight-semibold);
        }
        .api-signature .api-punct {
            color: var(--ds-text-muted);
        }
        .api-signature .api-type {
            color: var(--c-prop);
        }
        .api-body {
            padding: var(--ds-space-4) var(--ds-space-5);
        }
        .api-body p {
            font-size: var(--ds-text-sm);
            margin-bottom: var(--ds-space-3);
            color: var(--ds-text-secondary);
        }
        .api-params {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--ds-text-sm);
            margin-top: var(--ds-space-2);
        }
        .api-params th,
        .api-params td {
            padding: 8px var(--ds-space-3);
            text-align: left;
            border-bottom: 1px solid var(--ds-border-subtle);
            vertical-align: top;
        }
        .api-params th {
            font-weight: var(--ds-weight-medium);
            color: var(--ds-text-muted);
            font-size: var(--ds-text-xs);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .api-params td code {
            color: var(--c-tag);
        }
        [data-theme="dark"] .api-params td code {
            color: var(--c-attr);
        }
        .api-params td .param-req {
            color: var(--ds-status-danger);
            font-weight: var(--ds-weight-semibold);
            margin-left: 4px;
        }

        /* Home hero */
        .home-hero {
            padding: var(--ds-space-12) 0 var(--ds-space-10);
            border-bottom: 1px solid var(--ds-border-subtle);
            margin-bottom: var(--ds-space-10);
            position: relative;
        }
        .home-hero::after {
            content: '';
            position: absolute;
            top: -40px;
            right: -80px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--template-accent-glow) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.6;
        }
        .hero-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: var(--ds-text-sm);
            font-weight: var(--ds-weight-semibold);
            border-radius: var(--ds-radius-md);
            border: 1.5px solid var(--ds-border-default);
            background: var(--ds-bg-surface);
            color: var(--ds-text-primary);
            transition: all var(--ds-duration-normal);
            cursor: pointer;
            text-decoration: none;
        }
        .hero-btn svg {
            width: 16px;
            height: 16px;
            color: var(--ds-text-secondary);
            transition: transform var(--ds-duration-normal);
        }
        .hero-btn:hover {
            text-decoration: none;
            border-color: var(--ds-border-strong);
            box-shadow: var(--ds-shadow-md);
            transform: translateY(-2px);
        }
        .hero-btn:hover svg {
            transform: translateX(2px);
        }
        .hero-btn.primary {
            background: var(--ds-action-primary);
            border-color: var(--ds-action-primary);
            color: #fff;
            box-shadow: 0 4px 14px var(--template-accent-glow);
        }
        .hero-btn.primary svg {
            color: #fff;
        }
        .hero-btn.primary:hover {
            background: var(--ds-action-primary-hover);
            border-color: var(--ds-action-primary-hover);
            box-shadow: 0 6px 22px var(--template-accent-glow);
            transform: translateY(-2px);
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: var(--ds-space-4);
            margin: var(--ds-space-6) 0;
        }
        .doc-card {
            display: block;
            padding: var(--ds-space-5);
            border: 1.5px solid var(--ds-border-default);
            border-radius: var(--ds-radius-lg);
            background: var(--ds-bg-surface);
            color: var(--ds-text-primary);
            transition: all var(--ds-duration-normal);
            position: relative;
            overflow: hidden;
        }
        .doc-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--template-accent);
            opacity: 0;
            transition: opacity var(--ds-duration-normal);
        }
        .doc-card:hover {
            text-decoration: none;
            border-color: var(--ds-border-strong);
            box-shadow: var(--ds-shadow-md);
            transform: translateY(-2px);
        }
        .doc-card:hover::before {
            opacity: 1;
        }
        .doc-card .card-icon {
            width: 24px;
            height: 24px;
            color: var(--template-accent);
            margin-bottom: var(--ds-space-3);
            transition: transform var(--ds-duration-normal);
        }
        .doc-card:hover .card-icon {
            transform: scale(1.1);
        }
        .doc-card .card-title {
            font-size: var(--ds-text-sm);
            font-weight: var(--ds-weight-semibold);
            margin-bottom: var(--ds-space-2);
            color: var(--ds-text-primary);
        }
        .doc-card .card-desc {
            font-size: var(--ds-text-xs);
            color: var(--ds-text-muted);
            line-height: var(--ds-leading-normal);
        }
        .doc-card .card-arrow {
            margin-top: var(--ds-space-3);
            font-size: var(--ds-text-xs);
            color: var(--template-accent);
            font-weight: var(--ds-weight-medium);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: gap var(--ds-duration-normal);
        }
        .doc-card:hover .card-arrow {
            gap: 8px;
        }

        /* Steps */
        .steps {
            list-style: none;
            padding: 0;
            margin: var(--ds-space-5) 0;
            counter-reset: step;
        }
        .steps li {
            position: relative;
            padding-left: 48px;
            margin-bottom: var(--ds-space-6);
            counter-increment: step;
        }
        .steps li::before {
            content: counter(step);
            position: absolute;
            left: 0;
            top: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--ds-border-strong);
            background: var(--ds-bg-surface);
            color: var(--ds-text-secondary);
            font-size: var(--ds-text-xs);
            font-weight: var(--ds-weight-semibold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--ds-font-mono);
            transition: all var(--ds-duration-normal);
        }
        .steps li:hover::before {
            border-color: var(--template-accent);
            color: var(--template-accent);
            box-shadow: 0 0 0 4px var(--template-accent-soft);
        }
        .steps li h4 {
            font-size: var(--ds-text-md);
            font-weight: var(--ds-weight-semibold);
            margin-bottom: var(--ds-space-2);
        }
        .steps li p {
            font-size: var(--ds-text-sm);
            color: var(--ds-text-secondary);
            margin: 0;
        }

        /* FAQ */
        .faq-item {
            border-bottom: 1px solid var(--ds-border-subtle);
            transition: background var(--ds-duration-fast);
        }
        .faq-item:hover {
            background: var(--ds-bg-surface-subtle);

                    /(@media|@keyframes|@supports|!important)/g,

            function buildSidebar() {
                const nav = $('#sidebar-nav');
                if (!nav) return;
                nav.innerHTML = '';
                NAV.forEach(grp => {
                    const group = el('div', { class: 'nav-group' });
                    group.appendChild(el('div', { class: 'nav-group-label' }, grp.group));
                    const list = el('ul', { class: 'nav-list' });
                    grp.items.forEach(item => list.appendChild(navItem(item)));
                    group.appendChild(list);
                    nav.appendChild(group);
                });
            }

            function navItem(item) {
                const li = el('li', { class: 'nav-item', 'data-page': item.id });
                const hasChildren = !!(item.children && item.children.length);
                const link = el('button', { type: 'button', class: 'nav-link', 'data-route': item.id });
                link.innerHTML = '<span>' + item.label + '</span>' + (hasChildren ? '<span class="nav-chev">' + ic(
                    'chevron') + '</span>' : '');
                link.addEventListener('click', () => {
                    if (hasChildren) li.classList.toggle('expanded');
                    go(item.id);
                });
                li.appendChild(link);
                if (hasChildren) {
                    const childList = el('ul', { class: 'nav-children' });
                    item.children.forEach(c => {
                        const cli = el('li', { class: 'nav-item', 'data-page': c.id });
                        const clink = el('button', { type: 'button', class: 'nav-link',
                        'data-route': c.id });
                        clink.innerHTML = '<span>' + c.label + '</span>';
                        clink.addEventListener('click', () => go(c.id));
                        cli.appendChild(clink);
                        childList.appendChild(cli);
                    });
                    li.appendChild(childList);
                }
                return li;
            }

            function buildBreadcrumbs(pageId) {
                const crumbs = [{ label: 'Docs', href: '#/home' }];
                let found = null,
                    parentLabel = null;
                NAV.forEach(g => g.items.forEach(it => {
                    if (it.id === pageId) found = g.group;
                    if (it.children) it.children.forEach(c => { if (c.id === pageId) { parentLabel =
                                it.label;
                            found = g.group; } });
                }));
                if (found) crumbs.push({ label: found });
                if (parentLabel) crumbs.push({ label: parentLabel });
                crumbs.push({ label: META[pageId] ? META[pageId].title : pageId, current: true });
                let out = '<nav class="breadcrumbs" aria-label="Breadcrumb">';
                crumbs.forEach((c, i) => {
                    if (i > 0) out += '<span class="sep">' + ic('chevron') + '</span>';
                    if (c.current) out += '<span class="current">' + c.label + '</span>';
                    else if (c.href) out += '<a href="' + c.href + '">' + c.label + '</a>';
                    else out += '<span>' + c.label + '</span>';
                });
                return out + '</nav>';
            }

            function buildArticleMeta(m) {
                return '<div class="article-meta"><span class="meta-item">' + ic('clock') + ' Updated ' + m.updated +
                    '</span><span class="meta-sep">·</span><span class="meta-item">' + m.readtime +
                    ' read</span></div>';
            }

            function buildPager(pageId) {
                const idx = ORDER.indexOf(pageId);
                if (idx < 0) return '';
                const prev = idx > 0 ? ORDER[idx - 1] : null;
                const next = idx < ORDER.length - 1 ? ORDER[idx + 1] : null;
                let out = '<nav class="pager" aria-label="Pagination">';
                if (prev) out += '<a class="pager-prev" href="#/' + prev +
                    '"><span class="pager-label">' + ic('arrowLeft') + ' Previous</span><span class="pager-title">' +
                    META[prev].title + '</span></a>';
                else out += '<span></span>';
                if (next) out += '<a class="pager-next" href="#/' + next +
                    '"><span class="pager-label">Next ' + ic('arrowRight') +
                    '</span><span class="pager-title">' + META[next].title + '</span></a>';
                return out + '</nav>';
            }

            function renderPageClean(pageId) {
                const m = META[pageId];
                const root = $('#pages-root');
                if (!m || !root) { if (root) root.innerHTML = '<p>Page not found.</p>'; return []; }
                const isHome = pageId === 'home';
                const content = (typeof PAGES[pageId] === 'function') ? PAGES[pageId](m) :
                '<p>No content.</p>';
                const html = isHome ? content : buildBreadcrumbs(pageId) + '<div class="eyebrow">' + m.eyebrow +
                    '</div><h1>' + m.title + '</h1><p class="lead">' + m.lead + '</p>' + buildArticleMeta(m) +
                    content + buildPager(pageId);
                const page = el('div', { class: 'page active fade-in', id: 'page-' + pageId });
                root.innerHTML = '';
                root.appendChild(page);
                page.innerHTML = html;
                if (!isHome) {
                    const toggle = el('button', { type: 'button', class: 'toc-mobile-toggle',
                        'aria-expanded': 'false', 'aria-controls': 'toc-mobile' });
                    toggle.innerHTML = '<span>On this page</span><span class="chev">' + ic('chevronDown') +
                        '</span>';
                    const tocMobile = el('div', { class: 'toc-mobile', id: 'toc-mobile' });
                    page.insertBefore(tocMobile, page.firstChild);
                    page.insertBefore(toggle, tocMobile);
                    toggle.addEventListener('click', () => {
                        const open = toggle.getAttribute('aria-expanded') === 'true';
                        toggle.setAttribute('aria-expanded', String(!open));
                        tocMobile.classList.toggle('open', !open);
                    });
                }
                return $a('h2, h3', page);
            }

            function buildTOC(headings) {
                const tocDesktop = $('#toc-list');
                const tocMobile = $('#toc-mobile');
                const toggleEl = $('.toc-mobile-toggle');
                if (!headings.length) {
                    if (tocDesktop) tocDesktop.parentElement.style.display = 'none';
                    if (tocMobile && toggleEl) { tocMobile.style.display = 'none';
                        toggleEl.style.display = 'none'; }
                    return;
                }
                let html = '<ul class="toc-list">';
                headings.forEach((h, i) => {
                    if (!h.id) h.id = 'sec-' + i + '-' + (h.textContent.replace(/\s+/g, '-').toLowerCase()
                        .slice(0, 24));
                    const cls = h.tagName === 'H3' ? 'toc-h3' : '';
                    html += '<li class="' + cls + '"><a href="#' + h.id + '" data-sec="' + h.id + '">' + esc(h
                        .textContent) + '</a></li>';
                });
                html += '</ul>';
                if (tocDesktop) tocDesktop.innerHTML = html;
                if (tocMobile) tocMobile.innerHTML = html;
            }

            function initScrollspy(headings) {
                if (!headings.length) return;
                const links = $a('[data-sec]');
                const setActive = id => links.forEach(l => l.classList.toggle('active', l.getAttribute('data-sec') ===
                    id));
                const io = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) setActive(e
                        .target.id); }), { rootMargin: '-80px 0px -70% 0px', threshold: 0 });
                headings.forEach(h => io.observe(h));
                $a('.toc-list a').forEach(a => a.addEventListener('click', function(e) {
                    const t = $('#' + a.getAttribute('data-sec'));
                    if (t) { e.preventDefault();
                        t.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        history.replaceState(null, '', '#' + a.getAttribute('data-sec')); }
                }));
            }

            function setActiveNav(pageId) {
                $a('.nav-link').forEach(l => l.removeAttribute('aria-current'));
                const link = $('.nav-link[data-route="' + pageId + '"]');
                if (link) link.setAttribute('aria-current', 'page');
                $a('.nav-item').forEach(li => {
                    const isParent = li.querySelector('.nav-children');
                    if (isParent) {
                        const childMatch = li.querySelector('.nav-children .nav-link[data-route="' + pageId +
                            '"]');
                        if (childMatch) li.classList.add('expanded');
                        else if (li.getAttribute('data-page') === pageId) li.classList.add('expanded');
                    }
                });
            }

            function initNavFilter() {
                const input = $('#nav-filter');
                if (!input) return;
                input.addEventListener('input', () => {
                    const q = input.value.toLowerCase().trim();
                    $a('.nav-item').forEach(li => {
                        const link = li.querySelector(':scope > .nav-link');
                        if (!link) return;
                        const text = link.textContent.toLowerCase();
                        const match = !q || text.includes(q);
                        let childMatch = false;
                        $a('.nav-children .nav-link', li).forEach(cl => {
                            cl.parentElement.style.display = (!q || cl.textContent
                                .toLowerCase().includes(q)) ? '' : 'none';
                            if (cl.textContent.toLowerCase().includes(q)) childMatch =
                                true;
                        });
                        li.style.display = (match || childMatch || !q) ? '' : 'none';
                        if (childMatch) li.classList.add('expanded');
                    });
                });
            }

            function initCode(root) {
                $a('.copy-btn', root).forEach(btn => btn.addEventListener('click', function() {
                    const id = btn.getAttribute('data-copy');
                    const code = $('#' + id);
                    if (code) {
                        const text = code.textContent;
                        const done = () => { btn.classList.add('copied');
                            setTimeout(() => btn.classList.remove('copied'), 1600); };
                        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done);
                        else { const ta = el('textarea');
                            ta.value = text;
                            document.body.appendChild(ta);
                            ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove();
                            done(); }
                    }
                }));
                $a('.code-tabs', root).forEach(tabs => {
                    const btns = $a('.code-tab', tabs);
                    btns.forEach(tab => tab.addEventListener('click', () => {
                        const panelId = tab.getAttribute('aria-controls');
                        btns.forEach(t => t.setAttribute('aria-selected', String(t === tab)));
                        $a('.tab-panel', tabs).forEach(p => p.classList.toggle('active',
                            p.id === panelId));
                    }));
                });
            }

            const searchState = { active: 0, results: [] };

            function buildSearchIndex() {
                const items = [];
                NAV.forEach(g => g.items.forEach(it => {
                    items.push({ label: it.label, id: it.id, group: g.group });
                    if (it.children) it.children.forEach(c => items.push({ label: c.label, id: c.id,
                        group: g.group + ' / ' + it.label }));
                }));
                return items;
            }

            function openSearch() {
                const modal = $('#search-modal');
                if (!modal) return;
                modal.classList.add('open');
                const input = $('#search-input');
                if (input) { input.focus();
                    input.value = '';
                    renderSearchResults(''); }
            }

            function closeSearch() { const modal = $('#search-modal'); if (modal) modal.classList.remove('open'); }

            function renderSearchResults(q) {
                const box = $('#search-results');
                if (!box) return;
                q = q.toLowerCase().trim();
                const idx = buildSearchIndex();
                const matches = !q ? idx.slice(0, 6) : idx.filter(it => it.label.toLowerCase().includes(q) || it.group
                    .toLowerCase().includes(q));
                searchState.results = matches;
                searchState.active = 0;
                if (!matches.length) { box.innerHTML = '<div class="no-results">No results for "' + esc(q) +
                        '"</div>'; return; }
                let html = '';
                matches.forEach((it, i) => { html += '<a class="result-item' + (i === 0 ? ' active' : '') +
                        '" data-idx="' + i + '" href="#/' + it.id + '"><span class="result-label">' +
                        highlightMatch(it.label, q) + '</span><span class="result-path">' + esc(it.group) +
                        '</span></a>'; });
                box.innerHTML = html;
                $a('.result-item', box).forEach((a, i) => { a.addEventListener('mouseenter', () => setActiveSearch(
                        i));
                    a.addEventListener('click', () => closeSearch()); });
            }

            function setActiveSearch(i) {
                searchState.active = i;
                $a('.result-item').forEach((a, idx) => a.classList.toggle('active', idx === i));
                const cur = $('.result-item.active');
                if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
            }

            function highlightMatch(text, q) {
                if (!q) return esc(text);
                const idx = text.toLowerCase().indexOf(q);
                if (idx < 0) return esc(text);
                return esc(text.slice(0, idx)) + '<mark>' + esc(text.slice(idx, idx + q.length)) + '</mark>' + esc(text
                    .slice(idx + q.length));
            }

            function initTheme() {
                let stored = null;
                try { stored = localStorage.getItem('ds-docs-theme-premium'); } catch (e) {}
                if (stored === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
                const btn = $('#theme-toggle');
                if (btn) btn.addEventListener('click', () => {
                    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' :
                        'light';
                    const next = cur === 'dark' ? 'light' : 'dark';
                    if (next === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
                    else document.documentElement.removeAttribute('data-theme');
                    try { localStorage.setItem('ds-docs-theme-premium', next); } catch (e) {}
                });
            }

            function openDrawer() {
                const sb = $('#sidebar'),
                    bd = $('#drawer-backdrop');
                if (sb) sb.classList.add('open');
                if (bd) bd.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeDrawer() {
                const sb = $('#sidebar'),
                    bd = $('#drawer-backdrop');
                if (sb) sb.classList.remove('open');
                if (bd) bd.classList.remove('open');
                document.body.style.overflow = '';
            }

            function currentRoute() { const h = location.hash.replace(/^#\/?/, ''); return h.split('/')[0] || 'home'; }

            function go(id) {
                if (location.hash !== '#/' + id) location.hash = '#/' + id;
                else route();
                closeDrawer();
            }

            function route() {
                const pageId = currentRoute();
                const headings = renderPageClean(META[pageId] ? pageId : 'home');
                buildTOC(headings);
                initScrollspy(headings);
                initCode($('#pages-root'));
                setActiveNav(pageId);
                const tm = $('#toc-mobile');
                if (tm) tm.classList.remove('open');
                const tt = $('.toc-mobile-toggle');
                if (tt) tt.setAttribute('aria-expanded', 'false');
                window.scrollTo(0, 0);
            }

            function init() {
                document.documentElement.classList.remove('no-js');
                buildSidebar();
                initNavFilter();
                initTheme();
                route();
                window.addEventListener('hashchange', route);
                const headerSearch = $('#header-search-trigger');
                if (headerSearch) headerSearch.addEventListener('click', openSearch);
                const modal = $('#search-modal');
                if (modal) modal.addEventListener('click', e => { if (e.target === modal) closeSearch(); });
                const input = $('#search-input');
                if (input) input.addEventListener('input', () => renderSearchResults(input.value));
                const mt = $('#menu-toggle');
                if (mt) mt.addEventListener('click', openDrawer);
                const bd = $('#drawer-backdrop');
                if (bd) bd.addEventListener('click', closeDrawer);
                const dc = $('#drawer-close');
                if (dc) dc.addEventListener('click', closeDrawer);
                window.addEventListener('resize', () => { if (window.innerWidth > 1024) closeDrawer(); });
                document.addEventListener('keydown', e => {
                    const searchOpen = $('#search-modal') && $('#search-modal').classList.contains('open');
                    if (e.key === 'Escape') { if (searchOpen) closeSearch();
                        else closeDrawer(); }
                    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault();
                        openSearch(); } else if (e.key === '/' && !searchOpen && !/^(INPUT|TEXTAREA)$/.test(
                            document.activeElement.tagName)) { e.preventDefault();
                        openSearch(); }
                    if (searchOpen && searchState.results.length) {
                        if (e.key === 'ArrowDown') { e.preventDefault();
                            setActiveSearch(Math.min(searchState.active + 1, searchState.results
                                .length - 1)); }
                        if (e.key === 'ArrowUp') { e.preventDefault();
                            setActiveSearch(Math.max(searchState.active - 1, 0)); }
                        if (e.key === 'Enter') { e.preventDefault(); const r = searchState.results[
                                searchState.active]; if (r) { closeSearch();
                                go(r.id); } }
                    }
                });
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
