<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Atlas Analytics — Enterprise analytics platform">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- outer hairline frame -->
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#111111" stroke-width="1.5" opacity="0.55"/>

  <!-- top metadata bar -->
  <text x="64" y="92" font-family="JetBrains Mono, monospace" font-weight="500" font-size="15" fill="#111111" letter-spacing="2" opacity="0.6">ATLAS ANALYTICS · ENTERPRISE</text>
  <text x="1136" y="92" font-family="JetBrains Mono, monospace" font-weight="500" font-size="15" fill="#111111" letter-spacing="2" opacity="0.6" text-anchor="end">11 PAGES · TAILWIND TEMPLATE</text>
  <line x1="48" y1="108" x2="1152" y2="108" stroke="#111111" stroke-width="1" opacity="0.18"/>

  <!-- [A] logo mark -->
  <g transform="translate(64,146)">
    <rect x="0" y="0" width="84" height="84" rx="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <path d="M42 20 L62 64" stroke="#111111" stroke-width="4" stroke-linecap="square"/>
    <path d="M42 20 L22 64" stroke="#111111" stroke-width="4" stroke-linecap="square"/>
    <path d="M30 52 H54" stroke="#111111" stroke-width="4" stroke-linecap="square"/>
    <circle cx="42" cy="20" r="4" fill="#2563eb"/>
  </g>
  <text x="168" y="190" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" fill="#111111" letter-spacing="-0.5">Atlas Analytics</text>
  <text x="168" y="214" font-family="JetBrains Mono, monospace" font-weight="500" font-size="13" fill="#111111" opacity="0.45" letter-spacing="1">ENTERPRISE ANALYTICS PLATFORM</text>

  <!-- oversized editorial headline -->
  <text x="64" y="386" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="104" fill="#111111" letter-spacing="-3">Understand</text>
  <text x="64" y="492" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="104" fill="#111111" letter-spacing="-3">every <tspan fill="#2563eb">signal</tspan>.</text>

  <!-- right-side mini dashboard card -->
  <g transform="translate(836,300)">
    <rect x="0" y="0" width="280" height="232" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1" opacity="1"/>
    <line x1="0" y1="44" x2="280" y2="44" stroke="#111111" stroke-width="1" opacity="0.12"/>
    <text x="16" y="28" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#111111">Weekly active users</text>
    <text x="264" y="28" font-family="JetBrains Mono, monospace" font-weight="500" font-size="11" fill="#16a34a" text-anchor="end">▲ 12.4%</text>
    <text x="16" y="74" font-family="Inter, sans-serif" font-weight="700" font-size="30" fill="#111111">48,920</text>
    <!-- sparkline -->
    <polyline points="16,150 44,138 72,146 100,120 128,128 156,98 184,108 212,80 240,72 264,58" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="0" y1="186" x2="280" y2="186" stroke="#111111" stroke-width="1" opacity="0.12"/>
    <text x="16" y="208" font-family="JetBrains Mono, monospace" font-weight="500" font-size="11" fill="#111111" opacity="0.5">7-DAY ROLLING · UTC</text>
  </g>

  <!-- bottom hairline -->
  <line x1="48" y1="556" x2="1152" y2="556" stroke="#111111" stroke-width="1" opacity="0.18"/>
  <text x="64" y="584" font-family="JetBrains Mono, monospace" font-weight="500" font-size="13" fill="#111111" opacity="0.5">DEVSNIPS · TAILWIND CSS · MULTI-PAGE TEMPLATE</text>
  <text x="1136" y="584" font-family="JetBrains Mono, monospace" font-weight="500" font-size="13" fill="#111111" opacity="0.5" text-anchor="end">FUNNELS · COHORTS · RETENTION · REVENUE</text>
</svg>
