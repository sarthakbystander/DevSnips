<!--
Snippet Name: Nexus AI Navbar
Description: Quiet, editorial sticky navbar — warm paper background, terracotta accent, mobile menu toggle (vanilla JS, scoped).
Author: DevSnips Contributors
Usage Example: Paste as the first element inside <body>. Links use relative paths (pages/...).
-->
<header data-navbar class="sticky top-0 z-50 bg-paper/95 backdrop-blur border-b border-hairline">
  <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6 lg:px-8" aria-label="Primary">
    <a href="../preview.html" class="flex items-center gap-2.5" aria-label="Nexus AI home">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-terracotta-500 text-white shadow-sm shadow-terracotta-500/20">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18V6l10 12V6"/></svg>
      </span>
      <span class="font-display text-[17px] font-semibold tracking-tight text-ink">Nexus <span class="text-terracotta-500">AI</span></span>
    </a>

    <div class="hidden items-center gap-1 md:flex">
      <a href="features.html" data-nav-link="features" class="rounded-lg px-3 py-2 text-sm font-medium text-ink-soft transition-colors hover:text-terracotta-500">Features</a>
      <a href="integrations.html" data-nav-link="integrations" class="rounded-lg px-3 py-2 text-sm font-medium text-ink-soft transition-colors hover:text-terracotta-500">Integrations</a>
      <a href="pricing.html" data-nav-link="pricing" class="rounded-lg px-3 py-2 text-sm font-medium text-ink-soft transition-colors hover:text-terracotta-500">Pricing</a>
      <a href="customers.html" data-nav-link="customers" class="rounded-lg px-3 py-2 text-sm font-medium text-ink-soft transition-colors hover:text-terracotta-500">Customers</a>
      <a href="blog.html" data-nav-link="blog" class="rounded-lg px-3 py-2 text-sm font-medium text-ink-soft transition-colors hover:text-terracotta-500">Blog</a>
      <a href="docs.html" data-nav-link="docs" class="rounded-lg px-3 py-2 text-sm font-medium text-ink-soft transition-colors hover:text-terracotta-500">Docs</a>
    </div>

    <div class="hidden items-center gap-3 md:flex">
      <a href="login.html" class="text-sm font-medium text-ink-soft transition-colors hover:text-ink">Sign in</a>
      <a href="signup.html" class="inline-flex items-center gap-1.5 rounded-lg bg-terracotta-500 px-4 py-2 text-sm font-semibold text-white shadow-sm shadow-terracotta-500/25 transition-all hover:bg-terracotta-600 hover:shadow-terracotta-500/30">
        Start free
        <svg class="h-4 w-4 transition-transform group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>

    <button type="button" data-nav-toggle class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-ink-soft hover:bg-black/5 md:hidden" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-menu">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </nav>

  <div id="mobile-menu" data-mobile-menu class="hidden border-t border-hairline bg-paper px-4 py-3 md:hidden">
    <div class="flex flex-col gap-1">
      <a href="features.html" class="rounded-lg px-3 py-2.5 text-sm text-ink-soft hover:bg-paper-dark">Features</a>
      <a href="integrations.html" class="rounded-lg px-3 py-2.5 text-sm text-ink-soft hover:bg-paper-dark">Integrations</a>
      <a href="pricing.html" class="rounded-lg px-3 py-2.5 text-sm text-ink-soft hover:bg-paper-dark">Pricing</a>
      <a href="customers.html" class="rounded-lg px-3 py-2.5 text-sm text-ink-soft hover:bg-paper-dark">Customers</a>
      <a href="blog.html" class="rounded-lg px-3 py-2.5 text-sm text-ink-soft hover:bg-paper-dark">Blog</a>
      <a href="docs.html" class="rounded-lg px-3 py-2.5 text-sm text-ink-soft hover:bg-paper-dark">Docs</a>
      <div class="mt-3 flex gap-2">
        <a href="login.html" class="flex-1 rounded-lg border border-hairline px-4 py-2.5 text-center text-sm font-medium text-ink">Sign in</a>
        <a href="signup.html" class="flex-1 rounded-lg bg-terracotta-500 px-4 py-2.5 text-center text-sm font-semibold text-white">Start free</a>
      </div>
    </div>
  </div>
</header>

<script>
  (function () {
    const root = document.currentScript.closest('[data-navbar]');
    if (!root) return;
    const toggle = root.querySelector('[data-nav-toggle]');
    const menu = root.querySelector('[data-mobile-menu]');
    if (!toggle || !menu) return;
    toggle.addEventListener('click', () => {
      const open = menu.classList.toggle('hidden') === false;
      toggle.setAttribute('aria-expanded', String(open));
      const svg = toggle.querySelector('svg');
      if (svg) svg.innerHTML = open
        ? '<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>'
        : '<path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16"/>';
    });
  })();
</script>
