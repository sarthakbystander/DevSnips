<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="DevSnips — A curated store of considered design objects">
  <rect width="1200" height="630" fill="#F5F1EA"/>

  <!-- outer hairline frame -->
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#14110D" stroke-width="1.5" opacity="0.55"/>

  <!-- column rules -->
  <g stroke="#14110D" stroke-width="1" opacity="0.08">
    <line x1="420" y1="48" x2="420" y2="582"/>
    <line x1="820" y1="48" x2="820" y2="582"/>
  </g>

  <!-- top metadata bar -->
  <text x="64" y="92" font-family="JetBrains Mono, monospace" font-weight="500" font-size="15" fill="#14110D" letter-spacing="2" opacity="0.6">DEVSNIPS · ESTABLISHED 2019</text>
  <text x="1136" y="92" font-family="JetBrains Mono, monospace" font-weight="500" font-size="15" fill="#14110D" letter-spacing="2" opacity="0.6" text-anchor="end">VOL. 04 — THE VESSEL COLLECTION</text>
  <line x1="48" y1="108" x2="1152" y2="108" stroke="#14110D" stroke-width="1" opacity="0.25"/>

  <!-- [D] logo mark -->
  <g transform="translate(64,150)">
    <rect x="0" y="0" width="96" height="96" rx="6" fill="#14110D"/>
    <path d="M30 26 V70" fill="none" stroke="#F5F1EA" stroke-width="6" stroke-linecap="square"/>
    <path d="M30 26 H46 C64 26 74 36 74 48 C74 60 64 70 46 70 H30" fill="none" stroke="#F5F1EA" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
    <circle cx="58" cy="48" r="4.5" fill="#B5552D"/>
  </g>
  <text x="180" y="196" font-family="JetBrains Mono, monospace" font-weight="500" font-size="15" fill="#14110D" letter-spacing="3" opacity="0.7">DEVSNIPS</text>
  <text x="180" y="220" font-family="JetBrains Mono, monospace" font-weight="500" font-size="13" fill="#14110D" opacity="0.45">CURATED DESIGN OBJECTS</text>

  <!-- oversized editorial headline -->
  <text x="64" y="372" font-family="Fraunces, Georgia, serif" font-weight="400" font-style="italic" font-size="118" fill="#14110D" letter-spacing="-3">Objects of</text>
  <text x="64" y="486" font-family="Fraunces, Georgia, serif" font-weight="500" font-size="118" fill="#14110D" letter-spacing="-3">considered <tspan fill="#B5552D">design</tspan>.</text>

  <!-- right product motif: a stylised vessel -->
  <g transform="translate(880,210)">
    <rect x="0" y="0" width="220" height="300" fill="#ECE6DB" stroke="#14110D" stroke-width="1"/>
    <!-- vessel silhouette -->
    <path d="M110 60 C70 60 66 110 60 150 C54 190 70 250 110 250 C150 250 166 190 160 150 C154 110 150 60 110 60 Z" fill="none" stroke="#14110D" stroke-width="2.5"/>
    <path d="M92 60 Q110 50 128 60" fill="none" stroke="#14110D" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="110" cy="60" rx="20" ry="5" fill="none" stroke="#14110D" stroke-width="2"/>
    <line x1="110" y1="66" x2="110" y2="245" stroke="#B5552D" stroke-width="2" opacity="0.7"/>
    <text x="110" y="284" font-family="JetBrains Mono, monospace" font-size="11" fill="#14110D" opacity="0.5" text-anchor="middle" letter-spacing="2">No. 014 · STONEWARE</text>
  </g>

  <!-- bottom metadata bar -->
  <line x1="48" y1="524" x2="1152" y2="524" stroke="#14110D" stroke-width="1" opacity="0.25"/>
  <text x="64" y="556" font-family="JetBrains Mono, monospace" font-weight="500" font-size="15" fill="#14110D" letter-spacing="2" opacity="0.6">06 PAGES · HOME / SHOP / OBJECT / CART / CHECKOUT / JOURNAL / ATELIER</text>
  <text x="1136" y="556" font-family="JetBrains Mono, monospace" font-weight="500" font-size="15" fill="#14110D" letter-spacing="2" opacity="0.6" text-anchor="end">DEVS NIPS.COM</text>
</svg>
