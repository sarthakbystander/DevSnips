<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>With Suffix Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — With Suffix</h1>
      <p class="text-gray-600 mt-2">Input fields with suffixed text, units, or action buttons</p>
    </header>

    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm space-y-6 max-w-md">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Package Weight</label>
          <div class="relative">
            <input type="number" placeholder="0.00" class="w-full pl-4 pr-14 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
            <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-500">kg</span>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <div class="relative">
            <input type="text" placeholder="Choose a username" class="w-full pl-4 pr-20 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
            <button type="button" class="absolute inset-y-0 right-0 px-4 bg-blue-600 text-white text-sm font-medium rounded-r-lg hover:bg-blue-700 transition-colors">Check</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Dimensions</label>
          <div class="flex items-center gap-2">
            <input type="number" placeholder="L" class="w-full pl-4 pr-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
            <span class="text-gray-400">×</span>
            <input type="number" placeholder="W" class="w-full pl-4 pr-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
            <span class="text-gray-400">×</span>
            <input type="number" placeholder="H" class="w-full pl-4 pr-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
            <span class="text-gray-500 text-sm">cm</span>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">File Size Limit</label>
          <div class="relative">
            <input type="number" placeholder="Maximum file size" class="w-full pl-4 pr-20 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors" />
            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
              <select class="bg-transparent text-gray-500 text-sm focus:outline-none cursor-pointer">
                <option>MB</option>
                <option>GB</option>
              </select>
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-8 p-4 bg-emerald-50 rounded-lg border border-emerald-200">
      <p class="text-sm text-emerald-800"><strong>Patterns:</strong> Suffixes work great for units (kg, cm), embedded buttons (check availability), and dropdown units (MB/GB).</p>
    </div>
  </section>

</body>
</html>
