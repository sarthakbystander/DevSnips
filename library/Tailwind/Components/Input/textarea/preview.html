<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textarea | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Textarea</h1>
      <p class="text-gray-600 mt-2">Multi-line text input components</p>
    </header>

    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm space-y-6 max-w-md">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
          <textarea rows="4" placeholder="Write your message here..." class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-none"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea rows="3" placeholder="Tell us more about your project..." class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:bg-white transition-colors resize-y min-h-[80px]"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
          <textarea rows="3" maxlength="150" placeholder="Write a short bio..." class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors resize-none"></textarea>
          <p class="mt-1 text-xs text-gray-500 text-right">0/150 characters</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Chat Style</label>
          <textarea rows="3" placeholder="Type your message..." class="w-full px-4 py-4 bg-gray-100 border-0 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors resize-none"></textarea>
        </div>
      </div>
    </div>

    <div class="mt-8 p-4 bg-cyan-50 rounded-lg border border-cyan-200">
      <p class="text-sm text-cyan-800"><strong>Tip:</strong> Use resize-none to prevent unwanted resizing, or resize-y for user-controlled height adjustment.</p>
    </div>
  </section>

</body>
</html>
