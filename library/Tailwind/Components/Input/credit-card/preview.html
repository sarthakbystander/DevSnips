<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Card Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  <section class="max-w-4xl mx-auto px-4 sm:px-8 space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Credit Card</h1>
      <p class="text-gray-600 mt-2">Credit card input components with visual card styling</p>
    </header>
    <div class="flex flex-wrap gap-6 max-w-2xl">
      <div class="p-6 bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl">
        <div class="flex justify-between items-start mb-8">
          <div class="w-12 h-8 bg-gradient-to-r from-yellow-400 to-orange-500 rounded"></div>
          <svg class="w-10 h-6 text-gray-400" fill="currentColor" viewBox="0 0 24 16"><path d="M9.516 8.004c-1.945 0-3.39 1.016-3.39 2.496 0 1.472 1.437 2.488 3.39 2.488 1.945 0 3.382-1.016 3.382-2.488 0-1.472-1.437-2.496-3.382-2.496z"/></svg>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Card Number</label>
            <input type="text" placeholder="1234 5678 9012 3456" class="w-full bg-transparent border-b border-gray-600 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400 tracking-widest" />
          </div>
          <div class="flex gap-4">
            <div class="flex-1">
              <label class="block text-xs text-gray-400 mb-1">Cardholder</label>
              <input type="text" placeholder="John Doe" class="w-full bg-transparent border-b border-gray-600 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400" />
            </div>
            <div class="w-20">
              <label class="block text-xs text-gray-400 mb-1">CVV</label>
              <input type="text" placeholder="123" class="w-full bg-transparent border-b border-gray-600 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-400" />
            </div>
          </div>
        </div>
      </div>
      <div class="p-6 bg-white rounded-xl border border-gray-200">
        <span class="text-sm text-gray-600">Credit / Debit Card</span>
        <div class="space-y-4 mt-4 w-full">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
            <input type="text" placeholder="1234 5678 9012 3456" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Expiration</label>
              <input type="text" placeholder="MM/YY" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
              <input type="text" placeholder="123" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
