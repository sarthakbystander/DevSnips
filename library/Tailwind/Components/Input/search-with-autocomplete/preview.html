<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search with Autocomplete | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Search with Autocomplete</h1>
      <p class="text-gray-600 mt-2">Search inputs with autocomplete dropdown suggestions</p>
    </header>
    <div class="space-y-5 max-w-md">
      <div class="relative">
        <label class="block text-sm font-medium text-gray-700 mb-1">Search Country</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg></div>
          <input type="text" placeholder="Type to search..." class="w-full pl-10 pr-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg">
          <div class="p-2 hover:bg-gray-50 cursor-pointer flex items-center gap-3"><span class="text-xl">🇺🇸</span><p class="text-sm font-medium">United States</p></div>
          <div class="p-2 hover:bg-blue-50 cursor-pointer flex items-center gap-3 bg-blue-50"><span class="text-xl">🇬🇧</span><p class="text-sm font-medium">United Kingdom</p></div>
        </div>
      </div>
      <div class="p-6 bg-slate-900 rounded-2xl">
        <label class="block text-sm font-medium text-gray-300 mb-2">Command Palette (Dark)</label>
        <input type="text" placeholder="Type a command..." class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <div class="mt-3 space-y-1">
          <div class="p-3 bg-slate-800 cursor-pointer rounded-lg"><p class="text-sm text-white">Go to Dashboard</p></div>
          <div class="p-3 hover:bg-slate-800 cursor-pointer rounded-lg"><p class="text-sm text-white">Create New Project</p></div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
