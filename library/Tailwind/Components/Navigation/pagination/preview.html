<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagination | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Pagination -->
  
  <div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Pagination</h1>
      
      <!-- Example 1: Standard -->
      <div class="mb-10">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Standard</h2>
        <nav class="flex items-center justify-center gap-2" aria-label="Pagination">
          <a href="#" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors" aria-label="Previous">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </a>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">1</a>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded-lg transition-colors font-medium bg-indigo-50 text-indigo-600">2</a>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">3</a>
          <span class="w-10 h-10 flex items-center justify-center text-gray-400">...</span>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">8</a>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">9</a>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">10</a>
          <a href="#" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors" aria-label="Next">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </a>
        </nav>
      </div>

      <!-- Example 2: Compact -->
      <div class="mb-10">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">Compact</h2>
        <nav class="flex items-center justify-center gap-4" aria-label="Pagination">
          <span class="text-sm text-gray-500">Showing 1-10 of 156 results</span>
          <div class="flex items-center gap-2">
            <a href="#" class="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Previous</a>
            <a href="#" class="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Next</a>
          </div>
        </nav>
      </div>

      <!-- Example 3: Numbered with First/Last -->
      <div>
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">First/Last</h2>
        <nav class="flex items-center justify-center gap-1" aria-label="Pagination">
          <a href="#" class="px-3 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">First</a>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">1</a>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-white bg-indigo-600 rounded-lg">2</a>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">3</a>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">4</a>
          <a href="#" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">5</a>
          <a href="#" class="px-3 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Last</a>
        </nav>
      </div>
    </div>
  </div>

</body>
</html>
