<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persistent Toast | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::selection { background: rgba(37, 99, 235, 0.15); }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased">

  <header class="sticky top-0 z-20 border-b border-gray-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6">
      <div class="flex items-center gap-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-600 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        </div>
        <span class="text-[15px] font-semibold tracking-tight">DevSnips</span>
        <span class="ml-2 rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-500">Files</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-12">
    <nav class="mb-3 flex items-center gap-1.5 text-sm text-gray-400">
      <a href="#" class="hover:text-gray-600">Workspace</a>
      <span>/</span>
      <span class="text-gray-600">Files</span>
    </nav>

    <h1 class="text-3xl font-bold tracking-tight text-gray-900">Files</h1>
    <p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-gray-500">
      Upload a file to trigger a persistent toast. The blue bar shows the remaining time before it auto-dismisses; hover to pause it.
    </p>

    <div class="mt-8 rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
      <!-- Dropzone -->
      <label class="flex cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-gray-200 px-6 py-10 text-center transition-colors hover:border-blue-400 hover:bg-blue-50/40 focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-500/30">
        <span class="flex h-12 w-12 items-center justify-center rounded-full bg-blue-50 text-blue-600">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3 3-3"/></svg>
        </span>
        <span class="mt-3 text-sm font-medium text-gray-900">Click to upload</span>
        <span class="mt-1 text-xs text-gray-500">or drag and drop — any file up to 50MB</span>
        <input type="file" class="sr-only" onchange="showToast()" />
      </label>
    </div>
  </main>

  <!-- Component: Persistent Toast -->
  <div id="persistent-toast-region" class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-full max-w-sm flex-col items-end gap-3" role="region" aria-label="Notifications" aria-live="polite" data-toast-region></div>

  <script>
    (function () {
      const root = document.currentScript.closest('[data-toast-region]');
      if (!root) return;
      const DURATION = 6000;

      function dismiss(toast) {
        if (!toast || toast.dataset.dismissed === 'true') return;
        toast.dataset.dismissed = 'true';
        toast.classList.add('translate-x-2', 'opacity-0');
        toast.addEventListener('transitionend', () => toast.remove(), { once: true });
        setTimeout(() => toast.remove(), 400);
      }

      function showToast() {
        const toast = document.createElement('div');
        toast.className = 'toast-item pointer-events-auto relative w-full overflow-hidden rounded-xl border border-gray-200 bg-white shadow-lg ring-1 ring-black/5 transition duration-300 ease-out';
        toast.setAttribute('role', 'status');
        toast.innerHTML = `
          <div class="flex items-start gap-3 p-4">
            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-blue-100 text-blue-600">
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3 3-3"/></svg>
            </span>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-semibold text-gray-900">Upload complete</p>
              <p class="mt-0.5 text-sm text-gray-500">design-system.fig was uploaded successfully.</p>
            </div>
            <button type="button" class="toast-close shrink-0 rounded-md p-1 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" aria-label="Dismiss notification">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="toast-progress h-1 w-full origin-left bg-blue-500" style="transform: scaleX(1)"></div>`;

        root.appendChild(toast);

        const bar = toast.querySelector('.toast-progress');
        const closeBtn = toast.querySelector('.toast-close');

        function startBar() {
          requestAnimationFrame(() => {
            bar.style.transition = `transform ${DURATION}ms linear`;
            bar.style.transform = 'scaleX(0)';
          });
        }
        startBar();

        const timer = setTimeout(() => dismiss(toast), DURATION);
        function pause() { clearTimeout(timer); bar.style.transitionDuration = '0ms'; }
        function resume() {
          const remaining = (bar.getBoundingClientRect().width / bar.offsetWidth) * DURATION;
          bar.style.transition = `transform ${remaining}ms linear`;
          bar.style.transform = 'scaleX(0)';
        }

        closeBtn.addEventListener('click', () => { clearTimeout(timer); dismiss(toast); });
        toast.addEventListener('mouseenter', pause);
        toast.addEventListener('mouseleave', resume);
      }

      window.showToast = showToast;
    })();
  </script>

</body>
</html>
