<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Spinner | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::selection { background: rgba(37, 99, 235, 0.15); }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased">

  <header class="sticky top-0 z-20 border-b border-gray-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6">
      <div class="flex items-center gap-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-600 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.582m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </div>
        <span class="text-[15px] font-semibold tracking-tight">DevSnips</span>
        <span class="ml-2 rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-500">Loading</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-12">
    <nav class="mb-3 flex items-center gap-1.5 text-sm text-gray-400">
      <a href="#" class="hover:text-gray-600">Components</a>
      <span>/</span>
      <span class="text-gray-600">Progress</span>
    </nav>

    <h1 class="text-3xl font-bold tracking-tight text-gray-900">Circular Spinner</h1>
    <p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-gray-500">
      Lightweight ring spinners for inline loading states. Three sizes, a colored variant, and a full-card loading state.
    </p>

    <div class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2">
      <!-- Sizes -->
      <section class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
        <h2 class="mb-5 text-sm font-semibold text-gray-900">Sizes</h2>
        <div class="flex items-end justify-around">
          <div class="flex flex-col items-center gap-2">
            <svg class="h-5 w-5 animate-spin text-blue-600" viewBox="0 0 24 24" fill="none" role="status" aria-hidden="true"><circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
            <span class="text-[11px] text-gray-400">xs</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <svg class="h-8 w-8 animate-spin text-blue-600" viewBox="0 0 24 24" fill="none" role="status" aria-hidden="true"><circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            <span class="text-[11px] text-gray-400">sm</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <svg class="h-10 w-10 animate-spin text-blue-600" viewBox="0 0 24 24" fill="none" role="status" aria-hidden="true"><circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            <span class="text-[11px] text-gray-400">md</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <svg class="h-14 w-14 animate-spin text-blue-600" viewBox="0 0 24 24" fill="none" role="status" aria-hidden="true"><circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5"/><path d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
            <span class="text-[11px] text-gray-400">lg</span>
          </div>
        </div>
      </section>

      <!-- Colors + label -->
      <section class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
        <h2 class="mb-5 text-sm font-semibold text-gray-900">Colors & label</h2>
        <div class="flex items-center justify-around">
          <div class="flex flex-col items-center gap-2">
            <svg class="h-8 w-8 animate-spin text-blue-600" viewBox="0 0 24 24" fill="none" role="status" aria-hidden="true"><circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            <span class="text-[11px] text-gray-400">blue</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <svg class="h-8 w-8 animate-spin text-green-600" viewBox="0 0 24 24" fill="none" role="status" aria-hidden="true"><circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            <span class="text-[11px] text-gray-400">green</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <svg class="h-8 w-8 animate-spin text-gray-500" viewBox="0 0 24 24" fill="none" role="status" aria-hidden="true"><circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            <span class="text-[11px] text-gray-400">gray</span>
          </div>
        </div>
      </section>

      <!-- Component: Circular Spinner (with label) -->
      <section class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:col-span-2">
        <h2 class="mb-5 text-sm font-semibold text-gray-900">Full loading state</h2>
        <div class="flex flex-col items-center gap-3 py-6" role="status" aria-live="polite">
          <svg class="h-10 w-10 animate-spin text-blue-600" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/>
            <path class="opacity-100" d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <span class="text-sm font-medium text-gray-500">Loading your workspace…</span>
        </div>
      </section>
    </div>
  </main>

</body>
</html>
