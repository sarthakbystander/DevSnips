<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segmented Stepper | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::selection { background: rgba(37, 99, 235, 0.15); }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased">

  <header class="sticky top-0 z-20 border-b border-gray-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6">
      <div class="flex items-center gap-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-600 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        </div>
        <span class="text-[15px] font-semibold tracking-tight">DevSnips</span>
        <span class="ml-2 rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-500">Checkout</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-12">
    <h1 class="text-3xl font-bold tracking-tight text-gray-900">Checkout</h1>
    <p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-gray-500">
      A three-step checkout. The stepper highlights the current step; use the buttons to move through it.
    </p>

    <div class="mt-8 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
      <!-- Component: Segmented Stepper -->
      <ol class="flex items-center" data-stepper="3" data-stepper-step="2" id="checkout-stepper">
        <li class="flex items-center pr-4 sm:pr-8" data-stepper-item="1">
          <div class="flex items-center gap-3">
            <span class="stepper-marker flex h-9 w-9 shrink-0 items-center justify-center rounded-full border-2 border-blue-600 bg-blue-600 text-white transition-colors">
              <svg class="stepper-check h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            </span>
            <span class="stepper-label hidden text-sm font-medium text-gray-900 sm:block">Cart</span>
          </div>
          <div class="stepper-line ml-4 h-0.5 w-10 bg-blue-600 sm:w-20"></div>
        </li>

        <li class="flex items-center pr-4 sm:pr-8" data-stepper-item="2">
          <div class="flex items-center gap-3">
            <span class="stepper-marker flex h-9 w-9 shrink-0 items-center justify-center rounded-full border-2 border-blue-600 bg-white text-blue-600 transition-colors">
              <span class="stepper-num text-sm font-semibold">2</span>
            </span>
            <span class="stepper-label hidden text-sm font-medium text-gray-900 sm:block">Shipping</span>
          </div>
          <div class="stepper-line ml-4 h-0.5 w-10 bg-gray-200 sm:w-20"></div>
        </li>

        <li class="flex items-center" data-stepper-item="3">
          <div class="flex items-center gap-3">
            <span class="stepper-marker flex h-9 w-9 shrink-0 items-center justify-center rounded-full border-2 border-gray-300 bg-white text-gray-400 transition-colors">
              <span class="stepper-num text-sm font-semibold">3</span>
            </span>
            <span class="stepper-label hidden text-sm font-medium text-gray-400 sm:block">Payment</span>
          </div>
        </li>
      </ol>

      <!-- Step content -->
      <div class="mt-8 border-t border-gray-100 pt-6">
        <div id="step-panel" class="text-sm text-gray-600">
          <p class="font-semibold text-gray-900">Step 2 — Shipping address</p>
          <p class="mt-2 text-gray-500">Enter where your order should be delivered. You can review everything on the payment step.</p>
        </div>

        <div class="mt-6 flex items-center justify-between">
          <button onclick="moveStep(-1)" class="rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">Back</button>
          <button onclick="moveStep(1)" class="rounded-lg bg-blue-600 px-5 py-2 text-sm font-semibold text-white hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">Continue</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const stepper = document.getElementById('checkout-stepper');
      if (!stepper) return;
      const labels = ['Cart', 'Shipping', 'Payment'];
      const copy = [
        'Review the items in your cart before moving on to shipping.',
        'Enter where your order should be delivered. You can review everything on the payment step.',
        'Choose a payment method and confirm to place your order.',
      ];
      const panel = document.getElementById('step-panel');
      let current = 2;

      function render(step) {
        const items = stepper.querySelectorAll('[data-stepper-item]');
        items.forEach((item) => {
          const n = Number(item.getAttribute('data-stepper-item'));
          const marker = item.querySelector('.stepper-marker');
          const label = item.querySelector('.stepper-label');
          const line = item.querySelector('.stepper-line');
          const num = item.querySelector('.stepper-num');
          const check = item.querySelector('.stepper-check');

          marker.classList.remove('border-blue-600', 'bg-blue-600', 'text-white', 'border-gray-300', 'bg-white', 'text-blue-600', 'text-gray-400');

          if (n < step) {
            marker.classList.add('border-blue-600', 'bg-blue-600', 'text-white');
            if (check) check.classList.remove('hidden');
            if (num) num.classList.add('hidden');
            label.classList.remove('text-gray-400');
            label.classList.add('text-gray-900');
            if (line) { line.classList.remove('bg-gray-200'); line.classList.add('bg-blue-600'); }
          } else if (n === step) {
            marker.classList.add('border-blue-600', 'bg-white', 'text-blue-600');
            if (check) check.classList.add('hidden');
            if (num) num.classList.remove('hidden');
            label.classList.remove('text-gray-400');
            label.classList.add('text-gray-900');
            if (line) { line.classList.remove('bg-blue-600'); line.classList.add('bg-gray-200'); }
          } else {
            marker.classList.add('border-gray-300', 'bg-white', 'text-gray-400');
            if (check) check.classList.add('hidden');
            if (num) num.classList.remove('hidden');
            label.classList.remove('text-gray-900');
            label.classList.add('text-gray-400');
            if (line) { line.classList.remove('bg-blue-600'); line.classList.add('bg-gray-200'); }
          }
        });

        panel.innerHTML = '<p class="font-semibold text-gray-900">Step ' + step + ' — ' + labels[step - 1] + '</p><p class="mt-2 text-gray-500">' + copy[step - 1] + '</p>';
      }

      window.moveStep = function (delta) {
        current = Math.max(1, Math.min(3, current + delta));
        render(current);
      };

      render(current);
    })();
  </script>

</body>
</html>
