<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Menu | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  
  <!-- Component: Dropdown / Radio Menu -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Dropdown — Radio Menu</h1>
      <p class="text-gray-600 mt-2">Single-select radio menu for priority selection</p>
    </header>

    <!-- Preview -->
    <div data-radio-menu class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex justify-center p-12 bg-white rounded-xl shadow-sm">
        
        <!-- Radio Menu -->
        <div class="relative inline-block">
          <button
            id="radio-button"
            class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
           aria-haspopup="menu" aria-expanded="false" aria-controls="radio-menu">
            <span id="radio-label">Priority</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <div
            id="radio-menu"
            class="hidden absolute left-0 z-20 mt-2 w-64 bg-white rounded-xl shadow-xl border border-gray-200 overflow-hidden"
          >
            <div class="px-4 py-3 border-b border-gray-100">
              <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Select Priority</p>
            </div>

            <div class="py-2">
              <label class="flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-blue-50 transition-colors">
                <input type="radio" name="priority" class="priority-radio w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" value="critical">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 bg-red-500 rounded-full"></span>
                  <span class="text-sm font-medium text-gray-900">Critical</span>
                </div>
              </label>
              
              <label class="flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-blue-50 transition-colors">
                <input type="radio" name="priority" class="priority-radio w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" value="high">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 bg-orange-500 rounded-full"></span>
                  <span class="text-sm font-medium text-gray-900">High</span>
                </div>
              </label>
              
              <label class="flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-blue-50 transition-colors">
                <input type="radio" name="priority" class="priority-radio w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" value="medium" checked>
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 bg-amber-500 rounded-full"></span>
                  <span class="text-sm font-medium text-gray-900">Medium</span>
                </div>
              </label>
              
              <label class="flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-blue-50 transition-colors">
                <input type="radio" name="priority" class="priority-radio w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" value="low">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></span>
                  <span class="text-sm font-medium text-gray-900">Low</span>
                </div>
              </label>
              
              <label class="flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-blue-50 transition-colors">
                <input type="radio" name="priority" class="priority-radio w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" value="none">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 bg-gray-300 rounded-full"></span>
                  <span class="text-sm font-medium text-gray-900">None</span>
                </div>
              </label>
            </div>
          </div>
        </div>

      </div>
    <script>
      (function () {
        const root = document.currentScript.closest('[data-radio-menu]');

        function bind(selector, handler, event) {
          root.querySelectorAll(selector).forEach(function (el) {
            el.addEventListener(event || 'click', handler);
          });
         }

        bind('#radio-button', function (event) { toggleDropdown('radio-menu') });
        root.addEventListener('change', function (event) {
          const opt = event.target.closest('.priority-radio');
          if (opt) updateRadioLabel(opt);
        });
        const menus = [
          { id: 'radio-menu', close: function () { toggleDropdown('radio-menu') } },
        ];
        const observer = new MutationObserver(function () {
          root.querySelectorAll('[aria-controls]').forEach(function (trigger) {
            const menu = document.getElementById(trigger.getAttribute('aria-controls'));
            if (menu) {
              trigger.setAttribute('aria-expanded', menu.classList.contains('hidden') ? 'false' : 'true');
            }
          });
        });
        menus.forEach(function (m) {
          const menu = document.getElementById(m.id);
          if (menu) observer.observe(menu, { attributes: true, attributeFilter: ['class'] });
        });
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          menus.forEach(function (m) {
            const menu = document.getElementById(m.id);
            if (menu && !menu.classList.contains('hidden')) {
              m.close();
              const trigger = root.querySelector('[aria-controls="' + m.id + '"]');
              if (trigger) trigger.focus();
            }
          });
        });
      })();
    </script>
    </div>

  </section>

  <script>
    function toggleDropdown(id) {
      document.getElementById(id).classList.toggle('hidden');
    }

    function updateRadioLabel(radio) {
      const value = radio.value;
      const labelMap = {
        'critical': 'Critical',
        'high': 'High',
        'medium': 'Medium',
        'low': 'Low',
        'none': 'None'
      };
      document.getElementById('radio-label').textContent = labelMap[value] || 'Priority';
    }

    document.addEventListener('click', function(event) {
      const container = document.querySelector('.relative.inline-block');
      if (!container.contains(event.target)) {
        document.getElementById('radio-menu').classList.add('hidden');
      }
    });
  </script>

</body>
</html>
