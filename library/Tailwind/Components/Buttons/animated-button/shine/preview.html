<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Shine Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .shine-btn {
      position: relative;
      overflow: hidden;
    }
    .shine-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
      );
      transform: rotate(30deg);
      transition: transform 0.6s;
    }
    .shine-btn:hover::after {
      transform: rotate(30deg) translateX(100%);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Animated / Shine -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Animated — Shine</h1>
      <p class="text-gray-600 mt-2">Shine sweep animations on hover</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-8 py-3 shine-btn bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Shine Effect
        </button>
        <button class="px-8 py-3 shine-btn bg-purple-600 text-white font-semibold rounded-full hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-colors">
          Shine Pill
        </button>
        <button class="px-8 py-3 shine-btn bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-semibold rounded-lg hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-opacity">
          Shine Gradient
        </button>
      </div>
    </div>

  </section>

</body>
</html>
