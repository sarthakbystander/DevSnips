<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphism Soft Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .neu-soft {
      background: #e0e5ec;
      box-shadow: 8px 8px 16px #b8bec5, -8px -8px 16px #ffffff;
    }
    .neu-soft:hover {
      box-shadow: 4px 4px 8px #b8bec5, -4px -4px 8px #ffffff;
    }
  </style>
</head>
<body class="bg-gray-200 min-h-screen p-8">
  
  <!-- Component: Button / Neumorphism / Soft -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-800">Button — Neumorphism — Soft</h1>
      <p class="text-gray-600 mt-2">Soft UI neumorphism buttons</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex flex-wrap gap-6 p-6 rounded-2xl">
        <button class="px-8 py-3 neu-soft text-gray-600 font-semibold rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all">
          Neumorphism
        </button>
        <button class="px-8 py-3 neu-soft text-gray-600 font-semibold rounded-full focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all">
          Neumorphism Pill
        </button>
        <button class="px-8 py-3 neu-soft text-gray-600 font-semibold rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all" disabled>
          Disabled
        </button>
      </div>
    </div>

  </section>

</body>
</html>
