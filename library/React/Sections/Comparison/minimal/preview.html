<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comparison — Minimal — DevSnips React Sections</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "ds-bg": "var(--ds-color-background)",
          "ds-fg": "var(--ds-color-foreground)",
          "ds-surface": "var(--ds-color-surface)",
          "ds-subtle": "var(--ds-color-surface-subtle)",
          "ds-hover": "var(--ds-color-surface-hover)",
          "ds-active": "var(--ds-color-surface-active)",
          "ds-muted": "var(--ds-color-muted-foreground)",
          "ds-border": "var(--ds-color-border)",
          "ds-border-strong": "var(--ds-color-border-strong)",
          "ds-primary": "var(--ds-color-primary)",
          "ds-primary-fg": "var(--ds-color-primary-foreground)",
          "ds-accent": "var(--ds-color-accent)",
          "ds-focus": "var(--ds-color-focus-ring)"
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['ui-monospace', 'SF Mono', 'Menlo', 'Consolas', 'monospace']
        }
      }
    }
  };
</script>
<style>
:root{color-scheme:light;--ds-color-background:#FAFAFA;--ds-color-foreground:#171717;--ds-color-surface:#FFFFFF;--ds-color-surface-subtle:#F5F5F5;--ds-color-surface-hover:#F5F5F5;--ds-color-muted-foreground:#737373;--ds-color-border:#E5E5E5;--ds-color-border-subtle:#EFEFEF;--ds-color-border-strong:#D4D4D4;--ds-color-primary:#171717;--ds-color-primary-foreground:#FFFFFF;--ds-color-accent:#2563EB;--ds-color-accent-soft:rgba(37,99,235,.10);--ds-color-focus-ring:#2563EB;--ds-radius-none:0;--ds-radius-sm:5px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-radius-full:9999px;--ds-font-sans:"Inter",system-ui,sans-serif;--ds-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[data-theme="dark"]{color-scheme:dark;--ds-color-background:#0A0A0A;--ds-color-foreground:#FAFAFA;--ds-color-surface:#171717;--ds-color-surface-subtle:#1F1F1F;--ds-color-surface-hover:#1F1F1F;--ds-color-muted-foreground:#A3A3A3;--ds-color-border:#2A2A2A;--ds-color-border-subtle:#1F1F1F;--ds-color-border-strong:#404040;--ds-color-primary:#FAFAFA;--ds-color-primary-foreground:#0A0A0A;--ds-color-accent:#3B82F6;--ds-color-accent-soft:rgba(59,130,246,.16);--ds-color-focus-ring:#3B82F6}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--ds-font-sans);background:var(--ds-color-background);color:var(--ds-color-foreground)}.ds-page{min-height:100vh}.ds-topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 24px;background:color-mix(in srgb,var(--ds-color-surface) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ds-color-border)}.ds-brand{display:flex;align-items:center;gap:8px;font:500 13px/1.4 var(--ds-font-sans)}.ds-mark{width:18px;height:18px;border:1.5px solid var(--ds-color-foreground);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font:700 11px/1 var(--ds-font-sans)}.ds-crumb{color:var(--ds-color-muted-foreground);font:400 13px/1.45 var(--ds-font-sans)}.ds-crumb b{color:var(--ds-color-foreground);font-weight:500}.ds-theme-toggle{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;font:500 12px/1.35 var(--ds-font-sans);color:var(--ds-color-foreground);background:var(--ds-color-surface);border:1px solid var(--ds-color-border);border-radius:var(--ds-radius-sm);cursor:pointer}.ds-theme-toggle:hover{background:var(--ds-color-surface-hover)}.ds-theme-toggle:focus-visible{outline:2px solid var(--ds-color-focus-ring);outline-offset:2px}.ds-intro{max-width:980px;margin:0 auto;padding:32px 24px 40px}.ds-eyebrow{font:600 11px/1.3 var(--ds-font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ds-color-muted-foreground);margin:0 0 8px}.ds-title{font:600 18px/1.35 var(--ds-font-sans);letter-spacing:-.01em;margin:0 0 8px}.ds-lede{color:var(--ds-color-muted-foreground);font:400 14px/1.5 var(--ds-font-sans);margin:0;max-width:60ch}.ds-stage{width:100%}.ds-footer{border-top:1px solid var(--ds-color-border);padding:24px;text-align:center;font:400 12px/1.4 var(--ds-font-sans);color:var(--ds-color-muted-foreground)}.ds-footer code{font-family:var(--ds-font-mono)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){.ds-topbar{padding:0 16px}.ds-crumb{display:none}.ds-intro{padding:24px 16px 32px}}
</style>
</head>
<body>
<div class="ds-page">
  <header class="ds-topbar">
    <div class="ds-brand">
      <span class="ds-mark" aria-hidden="true">D</span>
      <span>DevSnips</span>
      <span class="ds-crumb" aria-hidden="true">/ <b>React</b> / Sections / Comparison / minimal</span>
    </div>
    <button class="ds-theme-toggle" id="ds-theme-toggle" type="button" aria-pressed="false">
      <span id="ds-theme-label">Dark</span>
    </button>
  </header>
  <div class="ds-intro">
    <p class="ds-eyebrow">React Sections · Comparison</p>
    <h1 class="ds-title">Comparison — Minimal</h1>
    <p class="ds-lede">A restrained editorial matrix with a clear recommended option.</p>
  </div>
  <main class="ds-stage">
    <div id="ds-root"></div>
  </main>
  <footer class="ds-footer">DevSnips React · Sections · Comparison · <code>minimal</code> · live render of code.tsx</footer>
</div>
<script>
(function(){
  var root = document.documentElement;
  function apply(t){
    root.setAttribute("data-theme", t);
    try{ localStorage.setItem("ds-react-theme", t); }catch(e){}
    var b = document.getElementById("ds-theme-toggle");
    var l = document.getElementById("ds-theme-label");
    if(b){ b.setAttribute("aria-pressed", t === "dark" ? "true" : "false"); }
    if(l){ l.textContent = t === "dark" ? "Light" : "Dark"; }
  }
  var saved = null;
  try{ saved = localStorage.getItem("ds-react-theme"); }catch(e){}
  if(!saved){
    saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  apply(saved);
  document.getElementById("ds-theme-toggle").addEventListener("click", function(){
    apply(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
})();
</script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useId } = React;
const DEFAULT_OPTIONS = [
  { id: "devsnips", name: "DevSnips", description: "Composable UI for working developers", featured: true },
  { id: "starter", name: "Starter kit", description: "A smaller local component set" },
  { id: "custom", name: "Build in-house", description: "Your team owns every decision" },
];
const DEFAULT_FEATURES = [
  { label: "Ready-to-use React sections", values: { devsnips: true, starter: "12 sections", custom: "Build yourself" } },
  { label: "Design tokens", description: "Shared semantic values for consistent UI", values: { devsnips: true, starter: true, custom: "Custom system" } },
  { label: "Responsive states", values: { devsnips: true, starter: "Basic", custom: "Build yourself" } },
  { label: "Accessibility patterns", values: { devsnips: "Included", starter: false, custom: "Team-owned" } },
  { label: "Source ownership", values: { devsnips: "Exportable", starter: "Exportable", custom: true } },
  { label: "Ongoing maintenance", values: { devsnips: "Library updates", starter: "Self-managed", custom: "Team-owned" } },
];
function State({ value }) {
  if (value === true) return <span className="font-medium">Included<span className="sr-only"> in this comparison</span></span>;
  if (value === false) return <span className="text-[var(--ds-color-muted-foreground)]">Not included</span>;
  return <span>{value}</span>;
}
function ComparisonSection({
  eyebrow = "Compare approaches",
  title = "Choose the path that keeps your product moving.",
  description = "A compact view of what you get with a maintained UI library versus starting small or owning the system yourself.",
  options = DEFAULT_OPTIONS,
  features = DEFAULT_FEATURES,
}) {
  const headingId = useId();
  return (
    <section aria-labelledby={headingId} className="overflow-x-clip bg-[var(--ds-color-background)] font-[var(--ds-font-sans)] text-[var(--ds-color-foreground)]">
      <div className="mx-auto max-w-[1280px] px-4 py-[clamp(4rem,3rem+4vw,6rem)] sm:px-6 lg:px-8">
        <header className="max-w-2xl">
          <p className="text-xs font-semibold uppercase tracking-[0.05em] text-[var(--ds-color-muted-foreground)]">{eyebrow}</p>
          <h2 id={headingId} className="mt-3 text-[clamp(1.875rem,1.65rem+1vw,2.25rem)] font-semibold leading-[1.15] tracking-[-0.02em]">{title}</h2>
          <p className="mt-4 text-base leading-6 text-[var(--ds-color-muted-foreground)]">{description}</p>
        </header>
        <div className="mt-10 max-w-full overflow-hidden rounded-[var(--ds-radius-md)] border border-[var(--ds-color-border)] bg-[var(--ds-color-surface)]">
          <div className="max-w-full overflow-x-auto" role="region" aria-label="Comparison matrix">
            <table className="w-full min-w-[720px] border-collapse text-left">
              <thead>
                <tr className="border-b border-[var(--ds-color-border)] bg-[var(--ds-color-surface-subtle)]">
                  <th scope="col" className="w-[34%] px-5 py-4 text-xs font-semibold uppercase tracking-[0.04em] text-[var(--ds-color-muted-foreground)]">Capability</th>
                  {options.map((option) => (
                    <th scope="col" key={option.id} className="min-w-[180px] px-5 py-4 align-top">
                      <div className="flex items-center gap-2">
                        <span className="text-sm font-semibold">{option.name}</span>
                        {option.featured ? <span className="rounded-[var(--ds-radius-full)] border border-[var(--ds-color-border-strong)] px-2 py-0.5 text-[10px] font-semibold uppercase tracking-[0.04em]">Recommended</span> : null}
                      </div>
                      {option.description ? <span className="mt-1 block text-xs font-normal leading-5 text-[var(--ds-color-muted-foreground)]">{option.description}</span> : null}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {features.map((feature) => (
                  <tr key={feature.label} className="border-b border-[var(--ds-color-border-subtle)] last:border-b-0">
                    <th scope="row" className="px-5 py-4 align-top text-sm font-medium">
                      {feature.label}
                      {feature.description ? <span className="mt-1 block text-xs font-normal leading-5 text-[var(--ds-color-muted-foreground)]">{feature.description}</span> : null}
                    </th>
                    {options.map((option) => (
                      <td key={option.id} className="px-5 py-4 align-top text-sm leading-5">
                        <State value={feature.values[option.id] ?? "Not specified"} />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        <p className="mt-4 text-xs leading-5 text-[var(--ds-color-muted-foreground)]">Use the matrix as a decision aid, not a scorecard. Actual capabilities can vary by implementation.</p>
      </div>
    </section>
  );
}
</script>
<script type="text/babel" data-presets="react">
ReactDOM.createRoot(document.getElementById("ds-root")).render(<ComparisonSection />);
</script>
</body>
</html>
