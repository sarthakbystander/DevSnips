<!-- Floating Label Input: Stylish form field with animated labels -->
<div class="floating-label-group">
  <input type="text" id="name" required>
  <label for="name">Your Name</label>
</div>
<style>
.floating-label-group {
  position: relative;
  margin: 2em auto;
  max-width: 320px;
}
.floating-label-group input {
  width: 100%;
  padding: 1em 0.5em 0.5em 0.5em;
  border: 1px solid var(--ds-border-strong, #ccc);
  border-radius: var(--ds-radius-md, 6px);
  outline: none;
  font-size: 1em;
  background: var(--ds-surface, #fff);
}
.floating-label-group label {
  position: absolute;
  left: 0.6em;
  top: 1.1em;
  color: var(--ds-subtle, #888);
  background: var(--ds-surface, #fff);
  padding: 0 0.2em;
  pointer-events: none;
  transition: 0.2s;
}
.floating-label-group input:focus + label,
.floating-label-group input:not(:placeholder-shown) + label,
.floating-label-group input:valid + label {
  top: -0.7em;
  left: 0.4em;
  font-size: 0.85em;
  color: var(--ds-accent, #6a5af9);
}
@media (max-width: 500px) {
  .floating-label-group {
    max-width: 95vw;
  }
}

/* devsnips-qa:quality-bar */
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}
