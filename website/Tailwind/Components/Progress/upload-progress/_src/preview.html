<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Progress | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::selection { background: rgba(37, 99, 235, 0.15); }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased">

  <header class="sticky top-0 z-20 border-b border-gray-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6">
      <div class="flex items-center gap-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-600 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        </div>
        <span class="text-[15px] font-semibold tracking-tight">DevSnips</span>
        <span class="ml-2 rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-500">Files</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-2xl px-6 py-12">
    <nav class="mb-3 flex items-center gap-1.5 text-sm text-gray-400">
      <a href="#" class="hover:text-gray-600">Workspace</a>
      <span>/</span>
      <span class="text-gray-600">Uploads</span>
    </nav>

    <h1 class="text-3xl font-bold tracking-tight text-gray-900">Upload files</h1>
    <p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-gray-500">
      Each file shows a live progress bar, then flips to a green check when done. Use the button to add more.
    </p>

    <div class="mt-8 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-sm font-semibold text-gray-900">Queue</h2>
          <p class="text-xs text-gray-500">Files upload one at a time.</p>
        </div>
        <label class="inline-flex cursor-pointer items-center gap-2 rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3 3-3"/></svg>
          Add files
          <input id="file-input" type="file" multiple class="sr-only" />
        </label>
      </div>

      <!-- Component: Upload Progress -->
      <div class="mt-6 w-full space-y-3" data-upload-list></div>
    </div>
  </main>

  <script>
    (function () {
      const list = document.querySelector('[data-upload-list]');
      if (!list) return;

      function addFile(name) {
        const item = document.createElement('div');
        item.className = 'upload-item flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-3 shadow-sm transition duration-300';
        item.innerHTML = `
          <span class="upload-icon flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-blue-50 text-blue-600">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          </span>
          <div class="min-w-0 flex-1">
            <div class="mb-1.5 flex items-center justify-between gap-2">
              <p class="upload-name truncate text-sm font-medium text-gray-900"></p>
              <span class="upload-pct text-xs font-semibold tabular-nums text-gray-500">0%</span>
            </div>
            <div class="relative h-1.5 w-full overflow-hidden rounded-full bg-gray-100" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="upload-fill absolute inset-y-0 left-0 w-0 rounded-full bg-gradient-to-r from-blue-500 to-blue-600 transition-[width] duration-300 ease-out"></div>
            </div>
          </div>
          <button type="button" class="upload-remove shrink-0 rounded-md p-1 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" aria-label="Remove file">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>`;

        item.querySelector('.upload-name').textContent = name;
        list.appendChild(item);

        const fill = item.querySelector('.upload-fill');
        const pct = item.querySelector('.upload-pct');
        const bar = item.querySelector('[role="progressbar"]');
        const iconWrap = item.querySelector('.upload-icon');
        const removeBtn = item.querySelector('.upload-remove');

        let value = 0;
        function remove() {
          item.classList.add('opacity-0', 'translate-x-2');
          setTimeout(() => item.remove(), 300);
        }
        removeBtn.addEventListener('click', remove);

        const timer = setInterval(() => {
          value = Math.min(100, value + Math.random() * 22);
          fill.style.width = value + '%';
          pct.textContent = Math.round(value) + '%';
          bar.setAttribute('aria-valuenow', String(Math.round(value)));
          if (value >= 100) {
            clearInterval(timer);
            setTimeout(() => {
              fill.classList.remove('from-blue-500', 'to-blue-600');
              fill.classList.add('from-green-500', 'to-green-600');
              iconWrap.className = 'upload-icon flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-green-50 text-green-600';
              iconWrap.innerHTML = '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
              pct.textContent = 'Done';
              pct.classList.remove('text-gray-500');
              pct.classList.add('text-green-600');
            }, 200);
          }
        }, 500);
      }

      window.addFile = addFile;

      const input = document.getElementById('file-input');
      if (input) {
        input.addEventListener('change', (e) => {
          Array.from(e.target.files).forEach((f) => addFile(f.name));
          e.target.value = '';
        });
      }
      // Seed a couple of files so the demo isn't empty
      addFile('design-system.fig');
      addFile('hero-photo.png');
    })();
  </script>

</body>
</html>
