<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkbox Styled Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Checkbox Styled</h1>
      <p class="text-gray-600 mt-2">Styled checkbox components with various designs</p>
    </header>

    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm space-y-6 max-w-md">
        <div class="space-y-3">
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
            <span class="text-sm text-gray-700">Accept terms and conditions</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" checked class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
            <span class="text-sm text-gray-700">Subscribe to newsletter</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" disabled class="w-5 h-5 rounded border-gray-300 text-gray-400" />
            <span class="text-sm text-gray-400">Disabled checkbox</span>
          </label>
        </div>

        <div class="pt-4 border-t">
          <p class="text-sm font-medium text-gray-700 mb-3">Custom Styled</p>
          <div class="space-y-3">
            <label class="flex items-center gap-3 cursor-pointer group">
              <div class="w-6 h-6 rounded-md border-2 border-gray-300 bg-white flex items-center justify-center transition-colors group-hover:border-blue-400">
                <input type="checkbox" class="sr-only" />
                <svg class="w-4 h-4 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <span class="text-sm text-gray-700">Custom checkbox</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer group">
              <div class="w-6 h-6 rounded-full border-2 border-purple-500 bg-purple-500 flex items-center justify-center transition-colors">
                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <span class="text-sm text-gray-700">Round checkbox (checked)</span>
            </label>
          </div>
        </div>

        <div class="p-4 bg-gray-50 rounded-xl space-y-4">
          <p class="text-sm font-medium text-gray-700">With Descriptions</p>
          <label class="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" checked class="w-5 h-5 mt-0.5 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
            <div>
              <span class="text-sm font-medium text-gray-900">Marketing emails</span>
              <p class="text-xs text-gray-500 mt-0.5">Receive updates about products</p>
            </div>
          </label>
          <label class="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" class="w-5 h-5 mt-0.5 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
            <div>
              <span class="text-sm font-medium text-gray-900">Security alerts</span>
              <p class="text-xs text-gray-500 mt-0.5">Important security updates</p>
            </div>
          </label>
        </div>
      </div>
    </div>

    <div class="mt-8 p-4 bg-rose-50 rounded-lg border border-rose-200">
      <p class="text-sm text-rose-800"><strong>Note:</strong> Custom styled checkboxes require JavaScript to toggle the checked state visually.</p>
    </div>
  </section>

</body>
</html>
