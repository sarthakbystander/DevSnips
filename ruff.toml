# Ruff configuration for scripts/tooling and scripts/qa.
# Mirrors the style configured for the MCP package in
# integrations/mcp/pyproject.toml ([tool.ruff]).
line-length = 110
target-version = "py310"

[lint]
# Ruff defaults: pyflakes (F) + a small subset of pycodestyle (E4, E7, E9).
select = ["E4", "E7", "E9", "F"]
