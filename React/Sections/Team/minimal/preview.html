<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team — Minimal — DevSnips React Sections</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "ds-bg": "var(--ds-color-background)",
          "ds-fg": "var(--ds-color-foreground)",
          "ds-surface": "var(--ds-color-surface)",
          "ds-subtle": "var(--ds-color-surface-subtle)",
          "ds-hover": "var(--ds-color-surface-hover)",
          "ds-active": "var(--ds-color-surface-active)",
          "ds-muted": "var(--ds-color-muted-foreground)",
          "ds-border": "var(--ds-color-border)",
          "ds-border-strong": "var(--ds-color-border-strong)",
          "ds-primary": "var(--ds-color-primary)",
          "ds-primary-fg": "var(--ds-color-primary-foreground)",
          "ds-accent": "var(--ds-color-accent)",
          "ds-destructive": "var(--ds-color-destructive)",
          "ds-success": "var(--ds-color-success)",
          "ds-link": "var(--ds-color-link)",
          "ds-focus": "var(--ds-color-focus-ring)",
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['ui-monospace', 'SF Mono', 'Menlo', 'Consolas', 'monospace'],
        },
      },
    },
  };
</script>
<style>
:root{color-scheme:light;--ds-color-background:#FAFAFA;--ds-color-foreground:#171717;--ds-color-surface:#FFFFFF;--ds-color-surface-subtle:#F5F5F5;--ds-color-surface-hover:#F5F5F5;--ds-color-muted-foreground:#737373;--ds-color-border:#E5E5E5;--ds-color-border-strong:#D4D4D4;--ds-color-primary:#171717;--ds-color-primary-foreground:#FFFFFF;--ds-color-accent:#2563EB;--ds-color-accent-foreground:#FFFFFF;--ds-color-link:#2563EB;--ds-color-link-hover:#1D4ED8;--ds-color-focus-ring:#2563EB;--ds-radius-sm:5px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--ds-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;} [data-theme=dark]{color-scheme:dark;--ds-color-background:#0A0A0A;--ds-color-foreground:#FAFAFA;--ds-color-surface:#171717;--ds-color-surface-subtle:#1F1F1F;--ds-color-surface-hover:#1F1F1F;--ds-color-muted-foreground:#A3A3A3;--ds-color-border:#2A2A2A;--ds-color-border-strong:#404040;--ds-color-primary:#FAFAFA;--ds-color-primary-foreground:#0A0A0A;--ds-color-accent:#3B82F6;--ds-color-accent-foreground:#FFFFFF;--ds-color-link:#60A5FA;--ds-color-link-hover:#93C5FD;--ds-color-focus-ring:#3B82F6;}
*{box-sizing:border-box;} html,body{margin:0;} body{font-family:var(--ds-font-sans);background:var(--ds-color-background);color:var(--ds-color-foreground);} .ds-page{min-height:100vh;} .ds-topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 24px;background:color-mix(in srgb,var(--ds-color-surface) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ds-color-border);} .ds-brand{display:flex;align-items:center;gap:8px;font:500 13px/1.4 var(--ds-font-sans);} .ds-mark{width:18px;height:18px;border:1.5px solid var(--ds-color-foreground);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font:700 11px/1 var(--ds-font-sans);} .ds-crumb{color:var(--ds-color-muted-foreground);font:400 13px/1.45 var(--ds-font-sans);} .ds-crumb b{color:var(--ds-color-foreground);font-weight:500;} .ds-theme-toggle{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;font:500 12px/1.35 var(--ds-font-sans);color:var(--ds-color-foreground);background:var(--ds-color-surface);border:1px solid var(--ds-color-border);border-radius:var(--ds-radius-sm);cursor:pointer;} .ds-theme-toggle:hover{background:var(--ds-color-surface-hover);} .ds-theme-toggle:focus-visible{outline:2px solid var(--ds-color-focus-ring);outline-offset:2px;} .ds-main{max-width:980px;margin:0 auto;padding:32px 24px 64px;} .ds-eyebrow{font:600 11px/1.3 var(--ds-font-sans);letter-spacing:0.06em;text-transform:uppercase;color:var(--ds-color-muted-foreground);margin:0 0 8px;} .ds-title{font:600 18px/1.35 var(--ds-font-sans);letter-spacing:-0.01em;margin:0 0 8px;} .ds-lede{color:var(--ds-color-muted-foreground);font:400 14px/1.5 var(--ds-font-sans);margin:0 0 32px;max-width:60ch;} .ds-section{margin-top:32px;} .ds-section-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 16px;padding-bottom:8px;border-bottom:1px solid var(--ds-color-border-subtle);} .ds-section-h h2{font:600 16px/1.4 var(--ds-font-sans);margin:0;letter-spacing:-0.01em;} .ds-section-h .ds-note{font:400 12px/1.4 var(--ds-font-sans);color:var(--ds-color-muted-foreground);} .ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;} .ds-stack{display:flex;flex-direction:column;gap:12px;align-items:flex-start;} .ds-label{font:500 12px/1.35 var(--ds-font-sans);color:var(--ds-color-muted-foreground);margin:0 0 8px;text-transform:uppercase;letter-spacing:0.04em;} .ds-card{background:var(--ds-color-surface);border:1px solid var(--ds-color-border);border-radius:var(--ds-radius-md);padding:20px;} .ds-canvas{background:var(--ds-color-surface);border:1px solid var(--ds-color-border);border-radius:var(--ds-radius-md);padding:20px;} .ds-pos-wrap{position:relative;} .ds-footer{border-top:1px solid var(--ds-color-border);padding:24px;text-align:center;font:400 12px/1.4 var(--ds-font-sans);color:var(--ds-color-muted-foreground);} .ds-footer code{font-family:var(--ds-font-mono);} .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.ds-intro{max-width:980px;margin:0 auto;padding:32px 24px 40px;}
.ds-stage{width:100%;}
</style>
</head>
<body>
<div class="ds-page">
  <header class="ds-topbar">
    <div class="ds-brand"><span class="ds-mark" aria-hidden="true">D</span><span>DevSnips</span><span class="ds-crumb" aria-hidden="true">/ <b>React</b> / Sections / Team / minimal</span></div>
    <button class="ds-theme-toggle" id="ds-theme-toggle" type="button" aria-pressed="false"><span id="ds-theme-label">Dark</span></button>
  </header>
  <div class="ds-intro">
    <p class="ds-eyebrow">React Sections · Team</p>
    <h1 class="ds-title">Team — Minimal</h1>
    <p class="ds-lede">Editorial profile list with restrained dividers and typography-led hierarchy.</p>
  </div>
  <main class="ds-stage"><div id="ds-root"></div></main>
  <footer class="ds-footer">DevSnips React · Sections · Team · <code>minimal</code> · live render of code.tsx</footer>
</div>
<script>
(function(){
  var root = document.documentElement;
  function apply(t){
    root.setAttribute("data-theme", t);
    try{ localStorage.setItem("ds-react-theme", t); }catch(e){}
    var b=document.getElementById("ds-theme-toggle");
    var l=document.getElementById("ds-theme-label");
    if(b) b.setAttribute("aria-pressed", t==="dark"?"true":"false");
    if(l) l.textContent=t==="dark"?"Light":"Dark";
  }
  var saved=null;
  try{saved=localStorage.getItem("ds-react-theme");}catch(e){}
  if(!saved) saved=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  apply(saved);
  document.getElementById("ds-theme-toggle").addEventListener("click",function(){
    apply(root.getAttribute("data-theme")==="dark"?"light":"dark");
  });
})();
</script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-presets="typescript,react">

const FOCUS_RING =
  "focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ds-color-focus-ring)]";

const DEFAULT_MEMBERS: TeamMember[] = [
  {
    name: "Alex Morgan",
    role: "Founder & Product",
    initials: "AM",
    location: "New York",
    social: [{ label: "Alex Morgan profile", href: "#alex-morgan" }],
  },
  {
    name: "Maya Chen",
    role: "Engineering Lead",
    initials: "MC",
    location: "Toronto",
    social: [{ label: "Maya Chen profile", href: "#maya-chen" }],
  },
  {
    name: "Jon Bell",
    role: "Design Director",
    initials: "JB",
    location: "London",
    social: [{ label: "Jon Bell profile", href: "#jon-bell" }],
  },
  {
    name: "Priya Shah",
    role: "Developer Advocate",
    initials: "PS",
    location: "Bengaluru",
    social: [{ label: "Priya Shah profile", href: "#priya-shah" }],
  },
];

function TeamSection({
  eyebrow = "The team",
  title = "Small team. Serious craft.",
  description = "A focused group building tools that make software work feel clearer, faster, and more humane.",
  members = DEFAULT_MEMBERS,
}: TeamSectionProps) {
  const headingId = React.useId();

  return (
    <section
      aria-labelledby={headingId}
      className="bg-[var(--ds-color-background)] font-[var(--ds-font-sans)] text-[var(--ds-color-foreground)]"
    >
      <div className="mx-auto max-w-[1200px] px-4 py-[clamp(4.5rem,3rem+5vw,7rem)] sm:px-6 lg:px-8">
        <header className="max-w-2xl">
          <p className="text-[11px] font-semibold uppercase leading-[1.3] tracking-[0.06em] text-[var(--ds-color-muted-foreground)]">
            {eyebrow}
          </p>
          <h2
            id={headingId}
            className="mt-3 text-[clamp(2rem,1.45rem+2.2vw,3rem)] font-semibold leading-[1.12] tracking-[-0.02em]"
          >
            {title}
          </h2>
          <p className="mt-4 max-w-[62ch] text-[clamp(1rem,0.96rem+0.2vw,1.125rem)] leading-[1.55] text-[var(--ds-color-muted-foreground)]">
            {description}
          </p>
        </header>

        <ul className="mt-14 grid grid-cols-1 border-t border-[var(--ds-color-border)] sm:grid-cols-2 lg:grid-cols-4">
          {members.map((member) => (
            <li
              key={member.name}
              className="group flex min-h-[210px] flex-col border-b border-[var(--ds-color-border)] px-0 py-7 sm:px-5 sm:py-8 lg:border-r lg:px-6 lg:last:border-r-0"
            >
              <div className="flex items-start justify-between gap-4">
                <span
                  aria-hidden="true"
                  className="inline-flex size-11 shrink-0 items-center justify-center border border-[var(--ds-color-border-strong)] bg-[var(--ds-color-surface)] font-[var(--ds-font-mono)] text-xs font-medium tracking-[0.04em] text-[var(--ds-color-foreground)]"
                >
                  {member.initials ?? member.name.slice(0, 2).toUpperCase()}
                </span>
                {member.social?.[0] ? (
                  <a
                    href={member.social[0].href}
                    aria-label={member.social[0].label}
                    className={
                      "shrink-0 text-xs font-medium text-[var(--ds-color-muted-foreground)] underline decoration-[var(--ds-color-border-strong)] underline-offset-4 transition-colors duration-150 ease-out hover:text-[var(--ds-color-foreground)] motion-reduce:transition-none " +
                      FOCUS_RING
                    }
                  >
                    Profile
                  </a>
                ) : null}
              </div>
              <div className="mt-auto pt-8">
                <h3 className="text-base font-semibold leading-[1.4] tracking-[-0.01em]">
                  {member.name}
                </h3>
                <p className="mt-1 text-sm leading-5 text-[var(--ds-color-muted-foreground)]">
                  {member.role}
                </p>
                {member.location ? (
                  <p className="mt-3 font-[var(--ds-font-mono)] text-[11px] uppercase leading-[1.4] tracking-[0.05em] text-[var(--ds-color-muted-foreground)]">
                    {member.location}
                  </p>
                ) : null}
              </div>
            </li>
          ))}
        </ul>
      </div>
    </section>
  );
}

window.TeamSection = TeamSection;
</script>
<script type="text/javascript">
ReactDOM.createRoot(document.getElementById("ds-root")).render(React.createElement(window.TeamSection));
</script>
</body>
</html>
