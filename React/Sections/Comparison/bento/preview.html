</script>
<style>
:root{color-scheme:light;--ds-color-background:#FAFAFA;--ds-color-foreground:#171717;--ds-color-surface:#FFFFFF;--ds-color-surface-subtle:#F5F5F5;--ds-color-surface-hover:#F5F5F5;--ds-color-muted-foreground:#737373;--ds-color-border:#E5E5E5;--ds-color-border-subtle:#EFEFEF;--ds-color-border-strong:#D4D4D4;--ds-color-primary:#171717;--ds-color-primary-foreground:#FFFFFF;--ds-color-accent:#2563EB;--ds-color-accent-soft:rgba(37,99,235,.10);--ds-color-focus-ring:#2563EB;--ds-radius-none:0;--ds-radius-sm:5px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-radius-full:9999px;--ds-font-sans:"Inter",system-ui,sans-serif;--ds-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[data-theme="dark"]{color-scheme:dark;--ds-color-background:#0A0A0A;--ds-color-foreground:#FAFAFA;--ds-color-surface:#171717;--ds-color-surface-subtle:#1F1F1F;--ds-color-surface-hover:#1F1F1F;--ds-color-muted-foreground:#A3A3A3;--ds-color-border:#2A2A2A;--ds-color-border-subtle:#1F1F1F;--ds-color-border-strong:#404040;--ds-color-primary:#FAFAFA;--ds-color-primary-foreground:#0A0A0A;--ds-color-accent:#3B82F6;--ds-color-accent-soft:rgba(59,130,246,.16);--ds-color-focus-ring:#3B82F6}
*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--ds-font-sans);background:var(--ds-color-background);color:var(--ds-color-foreground)}.ds-page{min-height:100vh}.ds-topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 24px;background:color-mix(in srgb,var(--ds-color-surface) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ds-color-border)}.ds-brand{display:flex;align-items:center;gap:8px;font:500 13px/1.4 var(--ds-font-sans)}.ds-mark{width:18px;height:18px;border:1.5px solid var(--ds-color-foreground);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font:700 11px/1 var(--ds-font-sans)}.ds-crumb{color:var(--ds-color-muted-foreground);font:400 13px/1.45 var(--ds-font-sans)}.ds-crumb b{color:var(--ds-color-foreground);font-weight:500}.ds-theme-toggle{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;font:500 12px/1.35 var(--ds-font-sans);color:var(--ds-color-foreground);background:var(--ds-color-surface);border:1px solid var(--ds-color-border);border-radius:var(--ds-radius-sm);cursor:pointer}.ds-theme-toggle:hover{background:var(--ds-color-surface-hover)}.ds-theme-toggle:focus-visible{outline:2px solid var(--ds-color-focus-ring);outline-offset:2px}.ds-intro{max-width:980px;margin:0 auto;padding:32px 24px 40px}.ds-eyebrow{font:600 11px/1.3 var(--ds-font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ds-color-muted-foreground);margin:0 0 8px}.ds-title{font:600 18px/1.35 var(--ds-font-sans);letter-spacing:-.01em;margin:0 0 8px}.ds-lede{color:var(--ds-color-muted-foreground);font:400 14px/1.5 var(--ds-font-sans);margin:0;max-width:60ch}.ds-stage{width:100%}.ds-footer{border-top:1px solid var(--ds-color-border);padding:24px;text-align:center;font:400 12px/1.4 var(--ds-font-sans);color:var(--ds-color-muted-foreground)}.ds-footer code{font-family:var(--ds-font-mono)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){.ds-topbar{padding:0 16px}.ds-crumb{display:none}.ds-intro{padding:24px 16px 32px}}
.ds-intro{max-width:980px;margin:0 auto;padding:32px 24px 40px;}
.ds-stage{width:100%;}
</style>
</head>
<body>
<div class="ds-page">
  <header class="ds-topbar">
    <div class="ds-brand">
      <span class="ds-mark" aria-hidden="true">D</span>
      <span>DevSnips</span>
      <span class="ds-crumb" aria-hidden="true">/ <b>React</b> / Sections / Comparison / bento</span>
    </div>
    <button class="ds-theme-toggle" id="ds-theme-toggle" type="button" aria-pressed="false">
      <span id="ds-theme-label">Dark</span>
    </button>
  </header>
  <div class="ds-intro">
    <p class="ds-eyebrow">React Sections · Comparison</p>
    <h1 class="ds-title">Comparison — Bento</h1>
    <p class="ds-lede">A genuine 12-column decision map built from varied comparison cells.</p>
  </div>
  <main class="ds-stage">
    <div id="ds-root"></div>
  </main>
  <footer class="ds-footer">DevSnips React · Sections · Comparison · <code>bento</code> · live render of code.tsx</footer>
</div>
<script>
(function(){
  var root = document.documentElement;
  function apply(t){
    root.setAttribute("data-theme", t);
    try{ localStorage.setItem("ds-react-theme", t); }catch(e){}
    var b = document.getElementById("ds-theme-toggle");
    var l = document.getElementById("ds-theme-label");
    if(b){ b.setAttribute("aria-pressed", t === "dark" ? "true" : "false"); }
    if(l){ l.textContent = t === "dark" ? "Light" : "Dark"; }
  }
  var saved = null;
  try{ saved = localStorage.getItem("ds-react-theme"); }catch(e){}
  if(!saved){
    saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  apply(saved);
  document.getElementById("ds-theme-toggle").addEventListener("click", function(){
    apply(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
})();
</script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useId } = React;
const DEFAULT_OPTIONS = [
  { id: "devsnips", name: "DevSnips", description: "Sections, components, and patterns", featured: true },
  { id: "starter", name: "Starter kit", description: "A focused baseline" },
  { id: "custom", name: "In-house", description: "Built and maintained by your team" },
];
const DEFAULT_FEATURES = [
  { label: "Responsive", values: { devsnips: true, starter: "Core layouts", custom: "Team-defined" } },
  { label: "Accessible states", values: { devsnips: true, starter: "Review needed", custom: "Team-owned" } },
  { label: "Token architecture", values: { devsnips: "Semantic", starter: "Lightweight", custom: "Custom" } },
  { label: "Exportable source", values: { devsnips: true, starter: true, custom: true } },
  { label: "Maintenance model", values: { devsnips: "Library updates", starter: "Self-managed", custom: "Team-owned" } },
];
const FOCUS = "focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ds-color-focus-ring)]";
function Mark({ value }) {
  if (value === true) return <span className="font-medium">Included<span className="sr-only"> in this comparison</span></span>;
  if (value === false) return <span className="text-[var(--ds-color-muted-foreground)]">Not included</span>;
  return <span>{value}</span>;
}
function ComparisonSection({
  eyebrow = "Compare by what matters",
  title = "A decision map, not another giant table.",
  description = "Each cell isolates one part of the trade-off so teams can scan capability, ownership, and fit without losing the bigger picture.",
  options = DEFAULT_OPTIONS,
  features = DEFAULT_FEATURES,
}) {
  const headingId = useId();
  const recommended = options.find((option) => option.featured) ?? options[0];
  const primaryFeatures = features.slice(0, Math.min(3, features.length));
  const remainingFeatures = features.slice(primaryFeatures.length);
  return (
    <section aria-labelledby={headingId} className="bg-[var(--ds-color-background)] font-[var(--ds-font-sans)] text-[var(--ds-color-foreground)]">
      <div className="mx-auto max-w-[1280px] px-4 py-[clamp(4rem,3rem+4vw,6rem)] sm:px-6 lg:px-8">
        <header className="max-w-3xl">
          <p className="text-xs font-semibold uppercase tracking-[0.05em] text-[var(--ds-color-muted-foreground)]">{eyebrow}</p>
          <h2 id={headingId} className="mt-3 text-[clamp(2rem,1.6rem+1.5vw,3rem)] font-semibold leading-[1.08] tracking-[-0.03em]">{title}</h2>
          <p className="mt-4 max-w-2xl text-base leading-7 text-[var(--ds-color-muted-foreground)]">{description}</p>
        </header>
        <div className="mt-10 grid grid-cols-1 gap-4 md:grid-cols-12 lg:gap-6">
          <article className="flex min-h-[280px] flex-col justify-between rounded-[var(--ds-radius-lg)] border border-[var(--ds-color-border)] bg-[var(--ds-color-surface)] p-6 md:col-span-7 lg:p-8">
            <div>
              <p className="font-[var(--ds-font-mono)] text-[10px] uppercase tracking-[0.06em] text-[var(--ds-color-muted-foreground)]">Why choose a library</p>
              <h3 className="mt-3 max-w-lg text-xl font-semibold tracking-[-0.015em]">Move interface decisions closer to the point of use.</h3>
            </div>
            <div className="mt-10 grid grid-cols-1 gap-5 sm:grid-cols-3">
              {primaryFeatures.map((feature) => (
                <div key={feature.label} className="border-t border-[var(--ds-color-border)] pt-3">
                  <p className="text-sm font-semibold">{feature.label}</p>
                  <p className="mt-1 text-xs leading-5 text-[var(--ds-color-muted-foreground)]">{feature.description ?? "A concrete capability to compare."}</p>
                </div>
              ))}
            </div>
          </article>
          <article className="rounded-[var(--ds-radius-lg)] border border-[var(--ds-color-border-strong)] bg-[var(--ds-color-surface)] p-6 md:col-span-5 lg:p-8">
            <p className="font-[var(--ds-font-mono)] text-[10px] uppercase tracking-[0.06em] text-[var(--ds-color-muted-foreground)]">Recommended path</p>
            <h3 className="mt-3 text-xl font-semibold">{recommended?.name ?? "Choose an option"}</h3>
            <p className="mt-2 text-sm leading-6 text-[var(--ds-color-muted-foreground)]">{recommended?.description ?? "Start with the option that best fits your team."}</p>
            <div className="mt-8 border-t border-[var(--ds-color-border)] pt-5">
              <p className="text-xs text-[var(--ds-color-muted-foreground)]">Best fit when</p>
              <p className="mt-2 text-sm font-medium">You want polished defaults without giving up source ownership.</p>
            </div>
          </article>
          <article className="rounded-[var(--ds-radius-lg)] border border-[var(--ds-color-border)] bg-[var(--ds-color-surface)] p-6 md:col-span-4 lg:p-8">
            <p className="font-[var(--ds-font-mono)] text-[10px] uppercase tracking-[0.06em] text-[var(--ds-color-muted-foreground)]">Capability snapshot</p>
            <dl className="mt-6 space-y-5">
              {primaryFeatures.map((feature) => (
                <div key={feature.label}>
                  <dt className="text-sm font-medium">{feature.label}</dt>
                  <dd className="mt-1 text-xs leading-5 text-[var(--ds-color-muted-foreground)]">{options.length} approaches compared</dd>
                </div>
              ))}
            </dl>
          </article>
          <article className="rounded-[var(--ds-radius-lg)] border border-[var(--ds-color-border)] bg-[var(--ds-color-surface)] p-6 md:col-span-8 lg:p-8">
            <p className="font-[var(--ds-font-mono)] text-[10px] uppercase tracking-[0.06em] text-[var(--ds-color-muted-foreground)]">Feature fit</p>
            <div className="mt-5 divide-y divide-[var(--ds-color-border-subtle)]">
              {remainingFeatures.map((feature) => (
                <div key={feature.label} className="grid grid-cols-1 gap-3 py-4 sm:grid-cols-[minmax(0,1fr)_2fr]">
                  <div>
                    <p className="text-sm font-medium">{feature.label}</p>
                    {feature.description ? <p className="mt-1 text-xs leading-5 text-[var(--ds-color-muted-foreground)]">{feature.description}</p> : null}
                  </div>
                  <div className="grid grid-cols-1 gap-2 sm:grid-cols-3">
                    {options.map((option) => (
                      <p key={option.id} className="text-xs leading-5">
                        <span className="font-medium">{option.name}: </span>
                        <Mark value={feature.values[option.id] ?? "Not specified"} />
                      </p>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </article>
          <div className="flex items-center justify-between gap-5 rounded-[var(--ds-radius-lg)] border border-[var(--ds-color-border)] bg-[var(--ds-color-surface-subtle)] p-6 md:col-span-12 lg:p-7">
            <div>
              <p className="text-sm font-semibold">Keep the decision reversible.</p>
              <p className="mt-1 text-xs leading-5 text-[var(--ds-color-muted-foreground)]">The sample data is intentionally fictional. Exported source keeps implementation choices yours.</p>
            </div>
            <a href="#comparison-details" className={"hidden shrink-0 rounded-[var(--ds-radius-sm)] border border-[var(--ds-color-border-strong)] px-4 py-2.5 text-sm font-semibold transition-colors duration-150 hover:bg-[var(--ds-color-surface-hover)] motion-reduce:transition-none sm:inline-flex " + FOCUS}>View details</a>
          </div>
        </div>
      </div>
    </section>
  );
}
</script>
<script type="text/babel" data-presets="react">
ReactDOM.createRoot(document.getElementById("ds-root")).render(<ComparisonSection />);
</script>
</body>
</html>
