<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Input With Clear — DevSnips React</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{color-scheme:light;--ds-color-background:#FAFAFA;--ds-color-foreground:#171717;--ds-color-surface:#FFFFFF;--ds-color-surface-subtle:#F5F5F5;--ds-color-surface-elevated:#FFFFFF;--ds-color-surface-hover:#F5F5F5;--ds-color-surface-selected:#F5F5F5;--ds-color-muted:#F5F5F5;--ds-color-muted-foreground:#737373;--ds-color-border:#E5E5E5;--ds-color-border-strong:#D4D4D4;--ds-color-input:#FFFFFF;--ds-color-primary:#171717;--ds-color-primary-foreground:#FFFFFF;--ds-color-destructive:#C2261B;--ds-color-success:#15803D;--ds-color-focus-ring:#2563EB;--ds-radius-xs:3px;--ds-radius-sm:5px;--ds-radius-md:8px;--ds-shadow-sm:0 1px 3px rgba(10,10,10,.08),0 1px 2px rgba(10,10,10,.04)}[data-theme="dark"]{color-scheme:dark;--ds-color-background:#0A0A0A;--ds-color-foreground:#FAFAFA;--ds-color-surface:#171717;--ds-color-surface-subtle:#1F1F1F;--ds-color-surface-elevated:#1F1F1F;--ds-color-surface-hover:#1F1F1F;--ds-color-surface-selected:#1F1F1F;--ds-color-muted:#1F1F1F;--ds-color-muted-foreground:#A3A3A3;--ds-color-border:#2A2A2A;--ds-color-border-strong:#404040;--ds-color-input:#171717;--ds-color-primary:#FAFAFA;--ds-color-primary-foreground:#0A0A0A;--ds-color-destructive:#F1635A;--ds-color-success:#4ADE80;--ds-color-focus-ring:#3B82F6;--ds-shadow-sm:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4)}body{margin:0;background:var(--ds-color-background);color:var(--ds-color-foreground);font-family:Inter,system-ui,sans-serif}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<main class="mx-auto max-w-3xl px-6 py-10">
  <header class="mb-6 flex items-center justify-between border-b border-[var(--ds-color-border)] pb-3">
    <div><p class="text-xs font-semibold uppercase tracking-[0.06em] text-[var(--ds-color-muted-foreground)]">DevSnips React / Inputs</p><h1 class="mt-1 text-xl font-semibold">Input With Clear</h1></div>
    <button id="theme-toggle" type="button" class="h-8 rounded-[var(--ds-radius-sm)] border border-[var(--ds-color-border)] px-3 text-xs">Dark</button>
  </header>
  <section id="root" class="rounded-[var(--ds-radius-md)] border border-[var(--ds-color-border)] bg-[var(--ds-color-surface)] p-5"></section>
</main>
<script type="text/babel">
/* DevSnips React — JavaScript parity build. Same API and behavior as code.tsx; TypeScript types removed. */
const { useId, useState } = React;

function cx(...parts) {
  return parts.filter(Boolean).join(" ");
}

const INPUT_SIZES = {
  sm: "h-8 px-2.5 text-[13px]",
  md: "h-9 px-3 text-sm",
  lg: "h-11 px-3.5 text-sm",
};

const ICON_SIZES = {
  sm: "[&_svg]:size-[14px]",
  md: "[&_svg]:size-4",
  lg: "[&_svg]:size-[18px]",
};

function inputClasses(size, tone, hasLeading = false, hasTrailing = false) {
  return cx(
    "w-full rounded-[var(--ds-radius-sm)] border bg-[var(--ds-color-input)] text-[var(--ds-color-foreground)] shadow-none transition-colors duration-150 ease-out placeholder:text-[var(--ds-color-muted-foreground)] hover:bg-[var(--ds-color-input-hover,var(--ds-color-input))] focus:bg-[var(--ds-color-input-focus,var(--ds-color-input))] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ds-color-focus-ring)] disabled:pointer-events-none disabled:bg-[var(--ds-color-muted)] disabled:text-[var(--ds-color-muted-foreground)] disabled:opacity-60 read-only:bg-[var(--ds-color-surface-subtle)] read-only:text-[var(--ds-color-muted-foreground)] motion-reduce:transition-none",
    tone === "error" ? "border-[var(--ds-color-destructive)]" : tone === "success" ? "border-[var(--ds-color-success)]" : "border-[var(--ds-color-border)] focus:border-[var(--ds-color-border-strong)]",
    INPUT_SIZES[size],
    hasLeading && "pl-9",
    hasTrailing && "pr-9",
  );
}

function Spinner() {
  return (
    <svg className="size-4 animate-spin motion-reduce:animate-none" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="3" className="opacity-25" />
      <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" strokeWidth="3" strokeLinecap="round" />
    </svg>
  );
}

function InputWithClear({ label = "Input with Clear", helperText, error, success, size = "md", tone = "default", id, className, value, defaultValue = "", onChange, clearLabel = "Clear input", onClear,  ...props }) {
  const generatedId = useId();
  const inputId = id ?? `input-${generatedId}`;
  const messageId = `${inputId}-message`;
  const [internalValue, setInternalValue] = useState(String(defaultValue ?? ""));
  const currentValue = value === undefined ? internalValue : String(value);
  const message = error ?? success ?? helperText;
  const resolvedTone = error ? "error" : success ? "success" : tone;
  function handleChange(event) { if (value === undefined) setInternalValue(event.target.value); onChange?.(event); }
  function clearInput() { if (value === undefined) setInternalValue(""); onClear?.(); document.getElementById(inputId)?.focus(); }
  return <div className="w-full"><label htmlFor={inputId} className="mb-2 block text-[13px] font-medium leading-5 text-[var(--ds-color-foreground)]">{label}</label><div className="relative flex items-center"><input id={inputId} type="text" className={cx(inputClasses(size, resolvedTone, false, true), className)} value={currentValue} onChange={handleChange} aria-invalid={error ? true : undefined} aria-describedby={message ? messageId : undefined} {...props} />{currentValue ?         <button type="button" aria-label={clearLabel} onClick={clearInput} className="absolute right-2 inline-flex size-6 items-center justify-center rounded-[var(--ds-radius-xs)] text-[var(--ds-color-muted-foreground)] transition-colors hover:bg-[var(--ds-color-surface-hover)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ds-color-focus-ring)] motion-reduce:transition-none">×</button> : null}</div>{message ? <p id={messageId} className="mt-2 text-xs text-[var(--ds-color-muted-foreground)]">{message}</p> : null}</div>;
}



function Showcase() {
  return <div className="grid gap-5"><InputWithClear placeholder="Workspace name" helperText="Use a name teammates recognize." /><InputWithClear placeholder="billing@example.com" error="Enter a valid value before saving." /><InputWithClear defaultValue="prod-api-01" readOnly /><InputWithClear placeholder="Unavailable" disabled /></div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Showcase />);
document.getElementById("theme-toggle").addEventListener("click", () => { const root = document.documentElement; const next = root.dataset.theme === "dark" ? "light" : "dark"; root.dataset.theme = next; document.getElementById("theme-toggle").textContent = next === "dark" ? "Light" : "Dark"; });
</script>
</body>
</html>
