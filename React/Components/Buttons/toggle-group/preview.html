<style>
/* Shared stylesheet fragment for buttons. Kept in one place to keep all 30
   button assets in sync with React/DESIGN_TOKENS.md. Embedded into every
   preview.html via the generator. The class system (ds-btn + modifiers) is
   the component-token layer consumed by every button code.jsx. */

/* ---- Theme tokens (semantic) ---- */
:root {
  color-scheme: light;
  /* neutrals */
  --ds-color-background: #FAFAFA;
  --ds-color-foreground: #171717;
  --ds-color-surface: #FFFFFF;
  --ds-color-surface-subtle: #F5F5F5;
  --ds-color-surface-elevated: #FFFFFF;
  --ds-color-surface-hover: #F5F5F5;
  --ds-color-surface-active: #E5E5E5;
  --ds-color-surface-selected: #F5F5F5;
  --ds-color-muted: #F5F5F5;
  --ds-color-muted-foreground: #737373;
  --ds-color-border: #E5E5E5;
  --ds-color-border-subtle: #EFEFEF;
  --ds-color-border-strong: #D4D4D4;
  --ds-color-input: #FFFFFF;
  --ds-color-primary: #171717;
  --ds-color-primary-foreground: #FFFFFF;
  --ds-color-secondary: #F5F5F5;
  --ds-color-secondary-foreground: #171717;
  --ds-color-accent: #2563EB;
  --ds-color-accent-foreground: #FFFFFF;
  --ds-color-accent-soft: rgba(37, 99, 235, 0.10);
  --ds-color-destructive: #C2261B;
  --ds-color-destructive-foreground: #FFFFFF;
  --ds-color-destructive-soft: rgba(194, 38, 27, 0.10);
  --ds-color-success: #15803D;
  --ds-color-success-foreground: #FFFFFF;
  --ds-color-success-soft: rgba(21, 128, 61, 0.12);
  --ds-color-warning: #B45309;
  --ds-color-warning-foreground: #FFFFFF;
  --ds-color-info: #2563EB;
  --ds-color-info-foreground: #FFFFFF;
  --ds-color-link: #2563EB;
  --ds-color-link-hover: #1D4ED8;
  --ds-color-focus-ring: #2563EB;
  --ds-color-overlay: rgba(10, 10, 10, 0.50);

  /* spacing (4px base) */
  --ds-spacing-0: 0;
  --ds-spacing-1: 4px;
  --ds-spacing-2: 8px;
  --ds-spacing-3: 12px;
  --ds-spacing-4: 16px;
  --ds-spacing-5: 20px;
  --ds-spacing-6: 24px;
  --ds-spacing-8: 32px;
  --ds-spacing-10: 40px;
  --ds-spacing-12: 48px;
  --ds-spacing-16: 64px;

  /* radius */
  --ds-radius-none: 0;
  --ds-radius-xs: 3px;
  --ds-radius-sm: 5px;
  --ds-radius-md: 8px;
  --ds-radius-lg: 12px;
  --ds-radius-xl: 16px;
  --ds-radius-full: 9999px;

  /* shadows */
  --ds-shadow-none: none;
  --ds-shadow-xs: 0 1px 2px rgba(10, 10, 10, 0.04);
  --ds-shadow-sm: 0 1px 3px rgba(10, 10, 10, 0.08), 0 1px 2px rgba(10, 10, 10, 0.04);
  --ds-shadow-md: 0 4px 12px rgba(10, 10, 10, 0.10), 0 2px 4px rgba(10, 10, 10, 0.06);
  --ds-shadow-lg: 0 12px 32px rgba(10, 10, 10, 0.14), 0 4px 8px rgba(10, 10, 10, 0.08);

  /* typography */
  --ds-font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ds-font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --ds-text-label-lg: 500 14px/1.4 var(--ds-font-sans);
  --ds-text-label-md: 500 13px/1.4 var(--ds-font-sans);
  --ds-text-label-sm: 500 12px/1.35 var(--ds-font-sans);
  --ds-text-body-md: 400 14px/1.5 var(--ds-font-sans);
  --ds-text-body-sm: 400 13px/1.45 var(--ds-font-sans);
  --ds-text-caption: 400 12px/1.4 var(--ds-font-sans);
  --ds-text-heading-md: 600 18px/1.35 var(--ds-font-sans);
  --ds-text-heading-sm: 600 16px/1.4 var(--ds-font-sans);

  /* motion */
  --ds-duration-fast: 120ms;
  --ds-duration-default: 160ms;
  --ds-duration-slow: 260ms;
  --ds-ease: cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  color-scheme: dark;
  --ds-color-background: #0A0A0A;
  --ds-color-foreground: #FAFAFA;
  --ds-color-surface: #171717;
  --ds-color-surface-subtle: #1F1F1F;
  --ds-color-surface-elevated: #1F1F1F;
  --ds-color-surface-hover: #1F1F1F;
  --ds-color-surface-active: #2A2A2A;
  --ds-color-surface-selected: #1F1F1F;
  --ds-color-muted: #1F1F1F;
  --ds-color-muted-foreground: #A3A3A3;
  --ds-color-border: #2A2A2A;
  --ds-color-border-subtle: #1F1F1F;
  --ds-color-border-strong: #404040;
  --ds-color-input: #171717;
  --ds-color-primary: #FAFAFA;
  --ds-color-primary-foreground: #0A0A0A;
  --ds-color-secondary: #1F1F1F;
  --ds-color-secondary-foreground: #FAFAFA;
  --ds-color-accent: #3B82F6;
  --ds-color-accent-foreground: #FFFFFF;
  --ds-color-accent-soft: rgba(59, 130, 246, 0.16);
  --ds-color-destructive: #F1635A;
  --ds-color-destructive-foreground: #0A0A0A;
  --ds-color-destructive-soft: rgba(241, 99, 90, 0.16);
  --ds-color-success: #4ADE80;
  --ds-color-success-foreground: #052E16;
  --ds-color-success-soft: rgba(74, 222, 128, 0.18);
  --ds-color-warning: #FBBF24;
  --ds-color-warning-foreground: #1A1206;
  --ds-color-info: #3B82F6;
  --ds-color-info-foreground: #FFFFFF;
  --ds-color-link: #60A5FA;
  --ds-color-link-hover: #93C5FD;
  --ds-color-focus-ring: #3B82F6;
  --ds-color-overlay: rgba(0, 0, 0, 0.65);
  --ds-shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.40);
  --ds-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.50), 0 1px 2px rgba(0, 0, 0, 0.40);
  --ds-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.55), 0 2px 4px rgba(0, 0, 0, 0.45);
  --ds-shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.65), 0 4px 8px rgba(0, 0, 0, 0.50);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ds-color-background: #0A0A0A;
    --ds-color-foreground: #FAFAFA;
    --ds-color-surface: #171717;
    --ds-color-surface-subtle: #1F1F1F;
    --ds-color-surface-elevated: #1F1F1F;
    --ds-color-surface-hover: #1F1F1F;
    --ds-color-surface-active: #2A2A2A;
    --ds-color-surface-selected: #1F1F1F;
    --ds-color-muted: #1F1F1F;
    --ds-color-muted-foreground: #A3A3A3;
    --ds-color-border: #2A2A2A;
    --ds-color-border-subtle: #1F1F1F;
    --ds-color-border-strong: #404040;
    --ds-color-input: #171717;
    --ds-color-primary: #FAFAFA;
    --ds-color-primary-foreground: #0A0A0A;
    --ds-color-secondary: #1F1F1F;
    --ds-color-secondary-foreground: #FAFAFA;
    --ds-color-accent: #3B82F6;
    --ds-color-accent-foreground: #FFFFFF;
    --ds-color-accent-soft: rgba(59, 130, 246, 0.16);
    --ds-color-destructive: #F1635A;
    --ds-color-destructive-foreground: #0A0A0A;
    --ds-color-destructive-soft: rgba(241, 99, 90, 0.16);
    --ds-color-success: #4ADE80;
    --ds-color-success-foreground: #052E16;
    --ds-color-success-soft: rgba(74, 222, 128, 0.18);
    --ds-color-warning: #FBBF24;
    --ds-color-warning-foreground: #1A1206;
    --ds-color-info: #3B82F6;
    --ds-color-info-foreground: #FFFFFF;
    --ds-color-link: #60A5FA;
    --ds-color-link-hover: #93C5FD;
    --ds-color-focus-ring: #3B82F6;
    --ds-color-overlay: rgba(0, 0, 0, 0.65);
    --ds-shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.40);
    --ds-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.50), 0 1px 2px rgba(0, 0, 0, 0.40);
    --ds-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.55), 0 2px 4px rgba(0, 0, 0, 0.45);
    --ds-shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.65), 0 4px 8px rgba(0, 0, 0, 0.50);
  }
}

/* ---- Reset for previews ---- */
.ds-scope, .ds-scope *, .ds-scope *::before, .ds-scope *::after { box-sizing: border-box; }
.ds-scope { font-family: var(--ds-font-sans); }

/* ---- Button base (component-token layer) ---- */
.ds-btn {
  --ds-btn-bg: transparent;
  --ds-btn-fg: var(--ds-color-foreground);
  --ds-btn-bd: transparent;
  --ds-btn-h-bg: var(--ds-btn-bg);
  --ds-btn-h-bd: var(--ds-btn-bd);
  --ds-btn-a-bg: var(--ds-btn-h-bg);
  --ds-btn-height: 36px;
  --ds-btn-px: 14px;
  --ds-btn-font: var(--ds-text-label-md);
  --ds-btn-icon: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--ds-spacing-2);
  height: var(--ds-btn-height);
  padding: 0 var(--ds-btn-px);
  font: var(--ds-btn-font);
  letter-spacing: 0;
  white-space: nowrap;
  user-select: none;
  color: var(--ds-btn-fg);
  background: var(--ds-btn-bg);
  border: 1px solid var(--ds-btn-bd);
  border-radius: var(--ds-radius-sm);
  cursor: pointer;
  text-decoration: none;
  transition: background-color var(--ds-duration-default) var(--ds-ease),
              border-color var(--ds-duration-default) var(--ds-ease),
              color var(--ds-duration-default) var(--ds-ease),
              box-shadow var(--ds-duration-default) var(--ds-ease),
              opacity var(--ds-duration-default) var(--ds-ease);
}
.ds-btn:hover { background: var(--ds-btn-h-bg); border-color: var(--ds-btn-h-bd); }
.ds-btn:active { background: var(--ds-btn-a-bg); }
.ds-btn:disabled, .ds-btn[aria-disabled="true"] {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}
.ds-btn:focus { outline: none; }
.ds-btn:focus-visible {
  outline: 2px solid var(--ds-color-focus-ring);
  outline-offset: 2px;
}
.ds-btn .ds-btn-icon { width: var(--ds-btn-icon); height: var(--ds-btn-icon); flex: 0 0 auto; }
.ds-btn .ds-btn-spinner {
  width: var(--ds-btn-icon);
  height: var(--ds-btn-icon);
  flex: 0 0 auto;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: var(--ds-radius-full);
  animation: ds-spin 0.6s linear infinite;
}
@keyframes ds-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .ds-btn { transition-duration: 1ms; }
  .ds-btn .ds-btn-spinner { animation-duration: 1.2s; }
}

/* sizes */
.ds-btn--xs { --ds-btn-height: 28px; --ds-btn-px: 8px; --ds-btn-font: var(--ds-text-label-sm); --ds-btn-icon: 14px; }
.ds-btn--sm { --ds-btn-height: 32px; --ds-btn-px: 12px; --ds-btn-font: var(--ds-text-label-sm); --ds-btn-icon: 14px; }
.ds-btn--md { --ds-btn-height: 36px; --ds-btn-px: 14px; --ds-btn-font: var(--ds-text-label-md); --ds-btn-icon: 16px; }
.ds-btn--lg { --ds-btn-height: 40px; --ds-btn-px: 18px; --ds-btn-font: var(--ds-text-label-md); --ds-btn-icon: 18px; }
.ds-btn--xl { --ds-btn-height: 44px; --ds-btn-px: 20px; --ds-btn-font: var(--ds-text-label-lg); --ds-btn-icon: 20px; }

/* icon-only sizing */
.ds-btn--icon { padding: 0; aspect-ratio: 1; width: var(--ds-btn-height); }

/* variants */
.ds-btn--solid {
  --ds-btn-bg: var(--ds-color-primary);
  --ds-btn-fg: var(--ds-color-primary-foreground);
  --ds-btn-h-bg: color-mix(in srgb, var(--ds-color-primary) 88%, var(--ds-color-foreground));
  --ds-btn-a-bg: color-mix(in srgb, var(--ds-color-primary) 80%, var(--ds-color-foreground));
}
.ds-btn--outline {
  --ds-btn-bg: transparent;
  --ds-btn-fg: var(--ds-color-foreground);
  --ds-btn-bd: var(--ds-color-border-strong);
  --ds-btn-h-bg: var(--ds-color-surface-hover);
  --ds-btn-h-bd: var(--ds-color-border-strong);
}
.ds-btn--secondary {
  --ds-btn-bg: var(--ds-color-secondary);
  --ds-btn-fg: var(--ds-color-secondary-foreground);
  --ds-btn-bd: var(--ds-color-border);
  --ds-btn-h-bg: var(--ds-color-surface-active);
  --ds-btn-h-bd: var(--ds-color-border);
}
.ds-btn--ghost {
  --ds-btn-bg: transparent;
  --ds-btn-fg: var(--ds-color-foreground);
  --ds-btn-h-bg: var(--ds-color-surface-hover);
}
.ds-btn--link {
  --ds-btn-height: auto;
  --ds-btn-px: 0;
  --ds-btn-fg: var(--ds-color-link);
  border-radius: 0;
  text-underline-offset: 3px;
}
.ds-btn--link:hover { text-decoration: underline; color: var(--ds-color-link-hover); }
.ds-btn--destructive {
  --ds-btn-bg: var(--ds-color-destructive);
  --ds-btn-fg: var(--ds-color-destructive-foreground);
  --ds-btn-h-bg: color-mix(in srgb, var(--ds-color-destructive) 86%, #000);
  --ds-btn-a-bg: color-mix(in srgb, var(--ds-color-destructive) 78%, #000);
}
.ds-btn--success {
  --ds-btn-bg: var(--ds-color-success);
  --ds-btn-fg: var(--ds-color-success-foreground);
  --ds-btn-h-bg: color-mix(in srgb, var(--ds-color-success) 86%, #000);
  --ds-btn-a-bg: color-mix(in srgb, var(--ds-color-success) 78%, #000);
}
.ds-btn--outline-destructive {
  --ds-btn-bg: transparent;
  --ds-btn-fg: var(--ds-color-destructive);
  --ds-btn-bd: var(--ds-color-border-strong);
  --ds-btn-h-bg: var(--ds-color-destructive-soft);
}
.ds-btn--block { display: flex; width: 100%; }

/* ---- Shared bits used across components ---- */
.ds-menu {
  min-width: 180px;
  background: var(--ds-color-surface-elevated);
  border: 1px solid var(--ds-color-border);
  border-radius: var(--ds-radius-md);
  box-shadow: var(--ds-shadow-md);
  padding: var(--ds-spacing-1);
  z-index: 40;
}
.ds-menu-item {
  display: flex;
  align-items: center;
  gap: var(--ds-spacing-2);
  width: 100%;
  padding: var(--ds-spacing-2) var(--ds-spacing-2);
  font: var(--ds-text-body-sm);
  color: var(--ds-color-foreground);
  background: transparent;
  border: 0;
  border-radius: var(--ds-radius-sm);
  cursor: pointer;
  text-align: left;
}
.ds-menu-item:hover { background: var(--ds-color-surface-hover); }
.ds-menu-item:focus-visible { outline: 2px solid var(--ds-color-focus-ring); outline-offset: -2px; }
.ds-menu-item[data-variant="destructive"] { color: var(--ds-color-destructive); }

.ds-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 18px;
  min-width: 18px;
  padding: 0 5px;
  font: 600 11px/1 var(--ds-font-sans);
  color: var(--ds-color-accent-foreground);
  background: var(--ds-color-accent);
  border-radius: var(--ds-radius-full);
}

/* ---- Showcase layout ---- */
.ds-page { background: var(--ds-color-background); color: var(--ds-color-foreground); min-height: 100vh; }
.ds-topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px; padding: 0 var(--ds-spacing-6);
  background: color-mix(in srgb, var(--ds-color-surface) 85%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--ds-color-border);
}
.ds-topbar .ds-brand { display: flex; align-items: center; gap: var(--ds-spacing-2); font: var(--ds-text-label-md); }
.ds-brand .ds-mark { width: 18px; height: 18px; border: 1.5px solid var(--ds-color-foreground); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font: 700 11px/1 var(--ds-font-sans); }
.ds-topbar .ds-crumb { color: var(--ds-color-muted-foreground); font: var(--ds-text-body-sm); }
.ds-topbar .ds-crumb b { color: var(--ds-color-foreground); font-weight: 500; }
.ds-theme-toggle { display: inline-flex; align-items: center; gap: var(--ds-spacing-2); height: 32px; padding: 0 var(--ds-spacing-3); font: var(--ds-text-label-sm); color: var(--ds-color-foreground); background: var(--ds-color-surface); border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-sm); cursor: pointer; }
.ds-theme-toggle:hover { background: var(--ds-color-surface-hover); }
.ds-theme-toggle:focus-visible { outline: 2px solid var(--ds-color-focus-ring); outline-offset: 2px; }
.ds-main { max-width: 980px; margin: 0 auto; padding: var(--ds-spacing-8) var(--ds-spacing-6) var(--ds-spacing-16); }
.ds-eyebrow { font: 600 11px/1.3 var(--ds-font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ds-color-muted-foreground); margin: 0 0 var(--ds-spacing-2); }
.ds-title { font: var(--ds-text-heading-md); margin: 0 0 var(--ds-spacing-2); letter-spacing: -0.01em; }
.ds-lede { color: var(--ds-color-muted-foreground); font: var(--ds-text-body-md); margin: 0 0 var(--ds-spacing-8); max-width: 60ch; }
.ds-section { margin-top: var(--ds-spacing-8); }
.ds-section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 var(--ds-spacing-4); padding-bottom: var(--ds-spacing-2); border-bottom: 1px solid var(--ds-color-border-subtle); }
.ds-section-h h2 { font: var(--ds-text-heading-sm); margin: 0; letter-spacing: -0.01em; }
.ds-section-h .ds-note { font: var(--ds-text-caption); color: var(--ds-color-muted-foreground); }
.ds-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ds-spacing-3); }
.ds-stack { display: flex; flex-direction: column; gap: var(--ds-spacing-3); }
.ds-grid { display: grid; gap: var(--ds-spacing-4); }
.ds-label { font: var(--ds-text-label-sm); color: var(--ds-color-muted-foreground); margin: 0 0 var(--ds-spacing-2); text-transform: uppercase; letter-spacing: 0.04em; }
.ds-card { background: var(--ds-color-surface); border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-md); padding: var(--ds-spacing-5); }
.ds-card .ds-label { margin-top: var(--ds-spacing-3); }
.ds-canvas { background: var(--ds-color-surface); border: 1px solid var(--ds-color-border); border-radius: var(--ds-radius-md); padding: var(--ds-spacing-5); }
.ds-panel { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ds-spacing-4); }
@media (max-width: 720px) { .ds-panel { grid-template-columns: 1fr; } }
.ds-code { font: 400 12px/1.5 var(--ds-font-mono); color: var(--ds-color-muted-foreground); background: var(--ds-color-surface-subtle); border: 1px solid var(--ds-color-border-subtle); border-radius: var(--ds-radius-sm); padding: var(--ds-spacing-3); white-space: pre-wrap; }
.ds-state-line { display: flex; align-items: center; gap: var(--ds-spacing-4); flex-wrap: wrap; }
.ds-pos-wrap { position: relative; }
.ds-footer { border-top: 1px solid var(--ds-color-border); padding: var(--ds-spacing-6); text-align: center; font: var(--ds-text-caption); color: var(--ds-color-muted-foreground); }
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>
<body>
<div class="ds-scope ds-page">
  <header class="ds-topbar">
    <div class="ds-brand"><span class="ds-mark" aria-hidden="true">D</span><span>DevSnips</span><span class="ds-crumb" aria-hidden="true">/ <b>React</b> / Buttons / toggle-group</span></div>
    <button class="ds-theme-toggle" id="ds-theme-toggle" type="button" aria-pressed="false">
      <span id="ds-theme-label">Dark</span>
    </button>
  </header>
  <main class="ds-main">
    <p class="ds-eyebrow">React Component</p>
    <h1 class="ds-title">Toggle Group</h1>
    <p class="ds-lede">A set of toggle buttons where any number can be on (multi-select) or exactly one (single-select). WrapsToggleButton in a joined group with roving focus and clear selected states.</p>
    <div id="ds-root" class="ds-pos-wrap"></div>
  </main>
  <footer class="ds-footer">DevSnips React · Buttons · <code style="font-family:var(--ds-font-mono)">toggle-group</code></footer>
</div>
<script>
(function(){
  var root = document.documentElement;

// Close a popover/menu on outside click + Escape. Returns a ref to attach
// to the container element.
function useClickOutside(onClose, active) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!active) return;

    document.addEventListener("mousedown", onDown);
    document.addEventListener("keydown", onKey);

      document.removeEventListener("mousedown", onDown);
      document.removeEventListener("keydown", onKey);
    };
  }, [active, onClose]);
  return ref;
}

// Copy text to clipboard with graceful fallback. Returns [copied, copy].

        ta.value = text;
