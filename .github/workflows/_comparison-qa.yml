name: Comparison QA

on:
  push:
    branches:
      - feat/react-sections-comparison

jobs:
  verify-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: TypeScript strict verification
        run: npx --yes typescript@latest tsc --strict --noUncheckedIndexedAccess

      - name: Generator drift verification
        run: python _gen_react_sections_comparison.py --check

      - name: Comparison Playwright QA
        run: python scripts/_qa_react_sections_comparison.py

      - name: Repository validation
        run: python scripts/validate.py
