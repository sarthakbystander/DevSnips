name: Regenerate Team previews

on:
  push:
    branches:
      - feat/react-sections-team
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/react-sections-team
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate Team previews
        run: python3 _gen_react_sections_team.py

      - name: Commit generated previews when changed
        run: |
          if git diff --quiet -- React/Sections/Team/*/preview.html; then
            echo "Previews already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add React/Sections/Team/*/preview.html
          git commit -m "chore(team): regenerate generated previews"
          git push origin HEAD:feat/react-sections-team
