<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Northstar | DevSnips</title>
  <meta name="description" content="Notification center: unread and read notifications, categories, mark as read, mark all as read.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-page="notifications">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <main class="main" id="main" data-page="notifications">
      <div class="page-head">
        <div class="titles">
          <div id="crumbs"></div>
          <h1>Notifications</h1>
          <p class="sub">Stay on top of everything happening across your workspace.</p>
        </div>
        <div class="page-actions">
          <button class="btn" id="mark-all"><span class="btn-text">Mark all as read</span></button>
          <a class="btn" href="preferences.html">Preferences</a>
        </div>
      </div>

      <div data-tabs class="panel mb-0">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="all" aria-selected="true">All <span class="tab-count" id="c-all">0</span></button>
          <button role="tab" data-tab="unread" aria-selected="false">Unread <span class="tab-count" id="c-unread">0</span></button>
          <button role="tab" data-tab="read" aria-selected="false">Read</button>
        </div>
        <div class="panel-body flush">
          <div class="table-head">
            <select class="select" id="notif-cat" aria-label="Filter by category"><option value="">All categories</option></select>
          </div>
          <ul class="notif-center" id="notif-list"></ul>
          <div class="table-foot"><span class="page-info" id="count"></span></div>
        </div>
      </div>

      <footer class="foot">
        <span>© 2026 Northstar — DevSnips Vanilla template demo. Data is illustrative.</span>
        <div class="links"><a href="help-center.html">Docs</a><a href="support.html">Support</a><a href="system-status.html">Status</a></div>
      </footer>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
  (function () {
    'use strict';
    var NS = window.NS, DB = window.DB, esc = NS.esc, ICONS = NS.ICONS;
    function onReady(fn) { if (document.querySelector('.topbar')) fn(); else window.addEventListener('ns:ready', fn); }
    onReady(function () {
      document.getElementById('crumbs').innerHTML = NS.crumbs([{label:'Communication',href:'notifications.html'},{label:'Notifications'}]);
      var state = { tab: 'all', cat: '' };
      var cats = {}; DB.notifications.forEach(function (n) { cats[n.category] = true; });
      var sel = document.getElementById('notif-cat');
      sel.innerHTML = '<option value="">All categories</option>' + Object.keys(cats).map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');

      function updateCounts() {
        document.getElementById('c-all').textContent = DB.notifications.length;
        document.getElementById('c-unread').textContent = DB.notifications.filter(function (n) { return n.unread; }).length;
      }
      function filtered() {
        return DB.notifications.filter(function (n) {
          if (state.tab === 'unread' && !n.unread) return false;
          if (state.tab === 'read' && n.unread) return false;
          if (state.cat && n.category !== state.cat) return false;
          return true;
        });
      }
      function render() {
        updateCounts();
        var list = filtered();
        document.getElementById('notif-list').innerHTML = list.map(function (n) {
          return '<li class="' + (n.unread ? 'unread' : '') + '" data-id="' + n.id + '"><span class="ic" style="background:' + n.tone + '">' + (ICONS[n.icon] || ICONS.bell) + '</span><div class="body"><p class="txt">' + n.body + '</p><p class="when">' + esc(n.category) + ' • ' + esc(n.time) + '</p></div><div class="acts">' + (n.unread ? '<button class="row-act" data-action="read" data-id="' + n.id + '" aria-label="Mark as read">' + ICONS.check + '</button>' : '') + '</div></li>';
        }).join('') || '<div class="state"><span class="ic">' + ICONS.bell + '</span><h3>No notifications</h3><p>You are all caught up.</p></div>';
        document.getElementById('count').textContent = 'Showing ' + list.length + ' of ' + DB.notifications.length;
      }
      render();
      document.querySelector('[data-tabs]').addEventListener('click', function (e) {
        var b = e.target.closest('[role="tab"]'); if (!b) return;
        state.tab = b.dataset.tab; render();
      });
      sel.addEventListener('change', function () { state.cat = this.value; render(); });
      document.getElementById('notif-list').addEventListener('click', function (e) {
        var b = e.target.closest('[data-action="read"]'); if (!b) return;
        var n = DB.notifications.find(function (x) { return x.id === b.dataset.id; });
        if (n) n.unread = false; render();
      });
      document.getElementById('mark-all').addEventListener('click', function () {
        DB.notifications.forEach(function (n) { n.unread = false; }); render(); NS.toast('All notifications marked as read', 'success');
      });
    });
  })();
  </script>
  
</body>
</html>
