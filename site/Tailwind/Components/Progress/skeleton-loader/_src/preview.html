<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Loader | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::selection { background: rgba(37, 99, 235, 0.15); }
    .skeleton-shimmer {
      background-image: linear-gradient(90deg, rgb(229 231 235) 25%, rgb(243 244 246) 37%, rgb(229 231 235) 63%);
      background-size: 400% 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
    }
    @keyframes skeleton-shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton-shimmer { animation: none; }
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased">

  <header class="sticky top-0 z-20 border-b border-gray-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6">
      <div class="flex items-center gap-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-600 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        </div>
        <span class="text-[15px] font-semibold tracking-tight">DevSnips</span>
        <span class="ml-2 rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-500">Feed</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-6 py-12">
    <nav class="mb-3 flex items-center gap-1.5 text-sm text-gray-400">
      <a href="#" class="hover:text-gray-600">Workspace</a>
      <span>/</span>
      <span class="text-gray-600">Feed</span>
    </nav>

    <h1 class="text-3xl font-bold tracking-tight text-gray-900">Activity feed</h1>
    <p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-gray-500">
      Content is loading. These skeletons match the shape of the incoming cards so the layout doesn't shift when data arrives.
    </p>

    <div class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <!-- Component: Skeleton Loader (card) -->
      <div class="w-full overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm" role="status" aria-live="polite" aria-label="Loading content">
        <div class="skeleton-shimmer relative h-40 w-full bg-gray-200"></div>
        <div class="space-y-4 p-5">
          <div class="flex items-center gap-3">
            <div class="skeleton-shimmer h-10 w-10 rounded-full bg-gray-200"></div>
            <div class="flex-1 space-y-2">
              <div class="skeleton-shimmer h-3 w-1/2 rounded bg-gray-200"></div>
              <div class="skeleton-shimmer h-3 w-1/3 rounded bg-gray-200"></div>
            </div>
          </div>
          <div class="space-y-2">
            <div class="skeleton-shimmer h-3 w-full rounded bg-gray-200"></div>
            <div class="skeleton-shimmer h-3 w-full rounded bg-gray-200"></div>
            <div class="skeleton-shimmer h-3 w-2/3 rounded bg-gray-200"></div>
          </div>
        </div>
      </div>

      <div class="w-full overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm" role="status" aria-live="polite" aria-label="Loading content">
        <div class="skeleton-shimmer relative h-40 w-full bg-gray-200"></div>
        <div class="space-y-4 p-5">
          <div class="flex items-center gap-3">
            <div class="skeleton-shimmer h-10 w-10 rounded-full bg-gray-200"></div>
            <div class="flex-1 space-y-2">
              <div class="skeleton-shimmer h-3 w-1/2 rounded bg-gray-200"></div>
              <div class="skeleton-shimmer h-3 w-1/3 rounded bg-gray-200"></div>
            </div>
          </div>
          <div class="space-y-2">
            <div class="skeleton-shimmer h-3 w-full rounded bg-gray-200"></div>
            <div class="skeleton-shimmer h-3 w-full rounded bg-gray-200"></div>
            <div class="skeleton-shimmer h-3 w-2/3 rounded bg-gray-200"></div>
          </div>
        </div>
      </div>

      <div class="w-full overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm" role="status" aria-live="polite" aria-label="Loading content">
        <div class="skeleton-shimmer relative h-40 w-full bg-gray-200"></div>
        <div class="space-y-4 p-5">
          <div class="flex items-center gap-3">
            <div class="skeleton-shimmer h-10 w-10 rounded-full bg-gray-200"></div>
            <div class="flex-1 space-y-2">
              <div class="skeleton-shimmer h-3 w-1/2 rounded bg-gray-200"></div>
              <div class="skeleton-shimmer h-3 w-1/3 rounded bg-gray-200"></div>
            </div>
          </div>
          <div class="space-y-2">
            <div class="skeleton-shimmer h-3 w-full rounded bg-gray-200"></div>
            <div class="skeleton-shimmer h-3 w-full rounded bg-gray-200"></div>
            <div class="skeleton-shimmer h-3 w-2/3 rounded bg-gray-200"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- List skeleton -->
    <div class="mt-10 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">
      <h2 class="border-b border-gray-100 px-6 py-4 text-sm font-semibold text-gray-900">Recent items</h2>
      <ul class="divide-y divide-gray-100" role="status" aria-live="polite" aria-label="Loading recent items">
        <li class="flex items-center gap-4 p-4">
          <div class="skeleton-shimmer h-9 w-9 rounded-lg bg-gray-200"></div>
          <div class="flex-1 space-y-2"><div class="skeleton-shimmer h-3 w-1/4 rounded bg-gray-200"></div><div class="skeleton-shimmer h-3 w-1/2 rounded bg-gray-200"></div></div>
          <div class="skeleton-shimmer h-3 w-16 rounded bg-gray-200"></div>
        </li>
        <li class="flex items-center gap-4 p-4">
          <div class="skeleton-shimmer h-9 w-9 rounded-lg bg-gray-200"></div>
          <div class="flex-1 space-y-2"><div class="skeleton-shimmer h-3 w-1/3 rounded bg-gray-200"></div><div class="skeleton-shimmer h-3 w-2/5 rounded bg-gray-200"></div></div>
          <div class="skeleton-shimmer h-3 w-16 rounded bg-gray-200"></div>
        </li>
        <li class="flex items-center gap-4 p-4">
          <div class="skeleton-shimmer h-9 w-9 rounded-lg bg-gray-200"></div>
          <div class="flex-1 space-y-2"><div class="skeleton-shimmer h-3 w-1/5 rounded bg-gray-200"></div><div class="skeleton-shimmer h-3 w-1/2 rounded bg-gray-200"></div></div>
          <div class="skeleton-shimmer h-3 w-16 rounded bg-gray-200"></div>
        </li>
      </ul>
    </div>
  </main>

</body>
</html>
