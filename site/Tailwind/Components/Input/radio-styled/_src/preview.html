<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Styled Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Radio Styled</h1>
      <p class="text-gray-600 mt-2">Styled radio button components</p>
    </header>

    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm space-y-6 max-w-md">
        <div class="space-y-3">
          <p class="text-sm font-medium text-gray-700">Select a plan</p>
          <div class="space-y-2">
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="radio" name="plan" class="w-5 h-5 border-gray-300 text-blue-600 focus:ring-blue-500" />
              <span class="text-sm text-gray-700">Free plan</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="radio" name="plan" checked class="w-5 h-5 border-gray-300 text-blue-600 focus:ring-blue-500" />
              <span class="text-sm text-gray-700">Pro plan - $9/month</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="radio" name="plan" class="w-5 h-5 border-gray-300 text-blue-600 focus:ring-blue-500" />
              <span class="text-sm text-gray-700">Enterprise - Contact us</span>
            </label>
          </div>
        </div>

        <div class="pt-4 border-t">
          <p class="text-sm font-medium text-gray-700 mb-3">Choose delivery method</p>
          <div class="grid grid-cols-2 gap-3">
            <label class="relative p-4 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-blue-300 transition-colors">
              <input type="radio" name="delivery" class="sr-only" />
              <div class="text-center">
                <svg class="w-8 h-8 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                </svg>
                <p class="text-sm font-medium text-gray-700">Standard</p>
                <p class="text-xs text-gray-500">3-5 days</p>
              </div>
            </label>
            <label class="relative p-4 border-2 border-blue-500 bg-blue-50 rounded-xl cursor-pointer transition-colors">
              <input type="radio" name="delivery" checked class="sr-only" />
              <div class="text-center">
                <svg class="w-8 h-8 mx-auto text-blue-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <p class="text-sm font-medium text-blue-700">Express</p>
                <p class="text-xs text-blue-600">1-2 days</p>
              </div>
            </label>
          </div>
        </div>

        <div class="pt-4 border-t">
          <p class="text-sm font-medium text-gray-700 mb-3">File format (Button Group)</p>
          <div class="inline-flex rounded-lg border border-gray-300 overflow-hidden">
            <label class="px-4 py-2.5 bg-blue-600 text-sm font-medium text-white cursor-pointer">
              <input type="radio" name="format" class="sr-only" checked />
              PNG
            </label>
            <label class="px-4 py-2.5 bg-white text-sm font-medium text-gray-700 cursor-pointer border-l border-gray-300 hover:bg-gray-50">
              <input type="radio" name="format" class="sr-only" />
              JPG
            </label>
            <label class="px-4 py-2.5 bg-white text-sm font-medium text-gray-700 cursor-pointer border-l border-gray-300 hover:bg-gray-50">
              <input type="radio" name="format" class="sr-only" />
              SVG
            </label>
            <label class="px-4 py-2.5 bg-white text-sm font-medium text-gray-700 cursor-pointer border-l border-gray-300 hover:bg-gray-50">
              <input type="radio" name="format" class="sr-only" />
              PDF
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-8 p-4 bg-teal-50 rounded-lg border border-teal-200">
      <p class="text-sm text-teal-800"><strong>Patterns:</strong> Radio buttons work best for mutually exclusive options. Card-style and button-group styles improve visual selection.</p>
    </div>
  </section>

</body>
</html>
