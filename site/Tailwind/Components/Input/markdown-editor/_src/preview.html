<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Markdown Editor</h1>
      <p class="text-gray-600 mt-2">Markdown editor with toolbar and syntax highlighting</p>
    </header>
    <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-md">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description (Markdown)</label>
        <textarea rows="4" placeholder="Write your content here using **Markdown**..." class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm resize-none"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Content (with Toolbar)</label>
        <div class="border border-gray-300 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-blue-500">
          <div class="flex items-center gap-1 p-2 bg-gray-50 border-b border-gray-300">
            <button class="p-2 text-gray-600 hover:bg-gray-200 rounded text-sm font-bold">B</button>
            <button class="p-2 text-gray-600 hover:bg-gray-200 rounded text-sm italic">I</button>
            <button class="p-2 text-gray-600 hover:bg-gray-200 rounded text-sm">H</button>
          </div>
          <textarea rows="4" placeholder="# Heading" class="w-full px-4 py-3 bg-white focus:outline-none font-mono text-sm resize-none"></textarea>
        </div>
      </div>
      <div class="p-4 bg-slate-900 rounded-xl">
        <label class="block text-sm font-medium text-gray-300 mb-1">README.md (Dark)</label>
        <textarea rows="3" placeholder="# My Project" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-400 font-mono text-sm resize-none"></textarea>
      </div>
    </div>
  </section>
</body>
</html>
