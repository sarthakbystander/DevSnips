<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filled Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Filled</h1>
      <p class="text-gray-600 mt-2">Input fields with solid background colors</p>
    </header>

    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="p-6 bg-white rounded-xl shadow-sm space-y-6 max-w-md">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input type="text" placeholder="Enter username" class="w-full px-4 py-3 bg-gray-100 border-0 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">With Background</label>
          <input type="text" placeholder="Type something" class="w-full px-4 py-3 bg-blue-50 border-0 rounded-lg text-blue-900 placeholder-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors" />
        </div>

        <div class="p-4 bg-gray-800 rounded-lg">
          <label class="block text-sm font-medium text-gray-300 mb-1">Dark Fill</label>
          <input type="text" placeholder="Dark style" class="w-full px-4 py-3 bg-gray-700 border-0 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Soft Rounded</label>
          <input type="text" placeholder="Fully rounded" class="w-full px-4 py-3 bg-gray-100 border-0 rounded-full focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-purple-50 transition-colors" />
        </div>
      </div>
    </div>

    <div class="mt-8 p-4 bg-green-50 rounded-lg border border-green-200">
      <p class="text-sm text-green-800"><strong>Tip:</strong> Filled inputs reduce visual noise. The background shifts on focus for visual feedback.</p>
    </div>
  </section>

</body>
</html>
