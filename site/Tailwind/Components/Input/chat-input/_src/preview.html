<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Input | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Input — Chat</h1>
      <p class="text-gray-600 mt-2">Chat input components for messaging interfaces</p>
    </header>
    <div class="p-6 bg-white rounded-xl shadow-sm space-y-5 max-w-md">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Standard</label>
        <div class="flex items-end gap-3">
          <div class="flex-1">
            <textarea rows="1" placeholder="Type a message..." class="w-full px-4 py-3 bg-white border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
          </div>
          <button class="p-3 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
          </button>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Modern</label>
        <div class="flex items-end gap-3">
          <button class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors">📎</button>
          <div class="flex-1 relative">
            <input type="text" placeholder="Write a message..." class="w-full px-4 py-3 pr-12 bg-white border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500 transition-colors" />
            <button class="absolute right-2 bottom-1.5 p-2 text-gray-400 hover:text-blue-600 rounded-full transition-colors">😊</button>
          </div>
          <button class="p-3 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-colors shadow-lg shadow-blue-600/30">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
          </button>
        </div>
      </div>
      <div class="p-4 bg-slate-800 rounded-2xl">
        <label class="block text-sm font-medium text-gray-300 mb-2">Dark Mode</label>
        <div class="flex items-end gap-3">
          <button class="p-2 text-gray-400 hover:text-white hover:bg-slate-700 rounded-full transition-colors">📎</button>
          <div class="flex-1">
            <input type="text" placeholder="Type a message..." class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-full text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-colors" />
          </div>
          <button class="p-3 bg-blue-500 text-white rounded-full hover:bg-blue-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
          </button>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
