<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breadcrumb | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Breadcrumb -->
  
  <div class="max-w-4xl mx-auto px-4 sm:px-8">
    <div class="bg-white rounded-2xl p-4 sm:p-8 shadow-sm border border-gray-100">
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Breadcrumb Navigation</h1>
      
      <!-- Example 1: Standard -->
      <div class="mb-8">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Standard</h2>
        <nav aria-label="Breadcrumb">
          <ol class="flex items-center gap-2 text-sm overflow-x-auto max-w-full -mx-1 px-1 pb-2">
            <li class="shrink-0 whitespace-nowrap">
              <a href="#" class="text-gray-500 hover:text-gray-700 shrink-0 whitespace-nowrap transition-colors">Home</a>
            </li>
            <li class="text-gray-400 shrink-0">/</li>
            <li class="shrink-0 whitespace-nowrap">
              <a href="#" class="text-gray-500 hover:text-gray-700 shrink-0 whitespace-nowrap transition-colors">Products</a>
            </li>
            <li class="text-gray-400 shrink-0">/</li>
            <li class="shrink-0 whitespace-nowrap">
              <a href="#" class="text-gray-500 hover:text-gray-700 shrink-0 whitespace-nowrap transition-colors">Electronics</a>
            </li>
            <li class="text-gray-400 shrink-0">/</li>
            <li class="text-gray-900 font-medium shrink-0 whitespace-nowrap" aria-current="page">Smartphones</li>
          </ol>
        </nav>
      </div>

      <!-- Example 2: With Icons -->
      <div class="mb-8">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">With Icons</h2>
        <nav aria-label="Breadcrumb">
          <ol class="flex items-center gap-1.5 text-sm overflow-x-auto max-w-full -mx-1 px-1 pb-2">
            <li class="shrink-0 whitespace-nowrap">
              <a href="#" class="flex items-center gap-1 text-gray-500 hover:text-gray-700 transition-colors shrink-0 whitespace-nowrap">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Home
              </a>
            </li>
            <li class="text-gray-400 shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </li>
            <li class="shrink-0 whitespace-nowrap">
              <a href="#" class="flex items-center gap-1 text-gray-500 hover:text-gray-700 transition-colors shrink-0 whitespace-nowrap">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                </svg>
                Products
              </a>
            </li>
            <li class="text-gray-400 shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </li>
            <li class="text-gray-900 font-medium shrink-0 whitespace-nowrap" aria-current="page">Current Page</li>
          </ol>
        </nav>
      </div>

      <!-- Example 3: Collapsed -->
      <div>
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Collapsed</h2>
        <nav aria-label="Breadcrumb">
          <ol class="flex items-center gap-2 text-sm overflow-x-auto max-w-full -mx-1 px-1 pb-2">
            <li class="shrink-0 whitespace-nowrap">
              <a href="#" class="text-gray-500 hover:text-gray-700 shrink-0 whitespace-nowrap transition-colors">Home</a>
            </li>
            <li class="text-gray-400 shrink-0">/</li>
            <li>
              <button class="text-gray-500 hover:text-gray-700 transition-colors">...</button>
            </li>
            <li class="text-gray-400 shrink-0">/</li>
            <li class="text-gray-900 font-medium shrink-0 whitespace-nowrap" aria-current="page">Current Page</li>
          </ol>
        </nav>
      </div>
    </div>
  </div>

</body>
</html>
