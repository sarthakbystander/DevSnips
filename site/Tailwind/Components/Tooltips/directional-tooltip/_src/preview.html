<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directional Tooltip | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::selection { background: rgba(37, 99, 235, 0.15); }
    .tt { position: relative; }
    .tt::after {
      content: attr(data-tooltip);
      position: absolute;
      padding: 6px 10px;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity .15s ease, transform .15s ease, visibility .15s;
      pointer-events: none;
      z-index: 50;
    }
    .tt::before {
      content: '';
      position: absolute;
      border: 6px solid transparent;
      opacity: 0;
      visibility: hidden;
      transition: opacity .15s ease, visibility .15s;
      pointer-events: none;
      z-index: 50;
    }
    .tt[data-tooltip-pos="top"]::after { left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%) translateY(4px); }
    .tt[data-tooltip-pos="top"]::before { left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); border-top-color: #111827; }
    .tt[data-tooltip-pos="right"]::after { top: 50%; left: calc(100% + 10px); transform: translateY(-50%) translateX(-4px); }
    .tt[data-tooltip-pos="right"]::before { top: 50%; left: calc(100% + 4px); transform: translateY(-50%); border-right-color: #111827; }
    .tt[data-tooltip-pos="bottom"]::after { left: 50%; top: calc(100% + 10px); transform: translateX(-50%) translateY(-4px); }
    .tt[data-tooltip-pos="bottom"]::before { left: 50%; top: calc(100% + 4px); transform: translateX(-50%); border-bottom-color: #111827; }
    .tt[data-tooltip-pos="left"]::after { top: 50%; right: calc(100% + 10px); transform: translateY(-50%) translateX(4px); }
    .tt[data-tooltip-pos="left"]::before { top: 50%; right: calc(100% + 4px); transform: translateY(-50%); border-left-color: #111827; }
    .tt:hover::after, .tt:focus-visible::after { opacity: 1; visibility: visible; }
    .tt[data-tooltip-pos="top"]:hover::after, .tt[data-tooltip-pos="top"]:focus-visible::after { transform: translateX(-50%) translateY(0); }
    .tt[data-tooltip-pos="right"]:hover::after, .tt[data-tooltip-pos="right"]:focus-visible::after { transform: translateY(-50%) translateX(0); }
    .tt[data-tooltip-pos="bottom"]:hover::after, .tt[data-tooltip-pos="bottom"]:focus-visible::after { transform: translateX(-50%) translateY(0); }
    .tt[data-tooltip-pos="left"]:hover::after, .tt[data-tooltip-pos="left"]:focus-visible::after { transform: translateY(-50%) translateX(0); }
    .tt:hover::before, .tt:focus-visible::before { opacity: 1; visibility: visible; }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-gray-50 text-gray-900 antialiased">

  <header class="sticky top-0 z-20 border-b border-gray-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6">
      <div class="flex items-center gap-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-600 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        </div>
        <span class="text-[15px] font-semibold tracking-tight">DevSnips</span>
        <span class="ml-2 rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-500">Canvas</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-12">
    <h1 class="text-3xl font-bold tracking-tight text-gray-900">Directional Tooltip</h1>
    <p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-gray-500">
      The same tooltip can point in any direction. Each button uses <code class="rounded bg-gray-100 px-1 py-0.5 text-[12px]">data-tooltip-pos</code> to set top, right, bottom, or left — the arrow repositions automatically.
    </p>

    <!-- Component: Directional Tooltip -->
    <div class="mt-12 flex min-h-[260px] flex-wrap items-center justify-center gap-12 overflow-x-auto rounded-2xl border border-dashed border-gray-300 bg-white p-6 sm:p-10">
      <button type="button" class="tt rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2" data-tooltip="Appears on top" data-tooltip-pos="top">Top</button>
      <button type="button" class="tt rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2" data-tooltip="Appears on the right" data-tooltip-pos="right">Right</button>
      <button type="button" class="tt rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2" data-tooltip="Appears on bottom" data-tooltip-pos="bottom">Bottom</button>
      <button type="button" class="tt rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2" data-tooltip="Appears on the left" data-tooltip-pos="left">Left</button>
    </div>

    <p class="mt-6 text-center text-sm text-gray-400">Hover or Tab-focus each button to preview the direction.</p>
  </main>

</body>
</html>
