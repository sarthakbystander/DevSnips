<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashed Outline Button | DevSnips</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
  
  <!-- Component: Button / Outline / Dashed -->
  
  <section class="max-w-4xl mx-auto space-y-8">
    <header class="border-b pb-4">
      <h1 class="text-3xl font-bold text-gray-900">Button — Outline — Dashed</h1>
      <p class="text-gray-600 mt-2">Outline buttons with dashed borders</p>
    </header>

    <!-- Preview -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-800">Preview</h2>
      <div class="flex flex-wrap gap-4 p-6 bg-white rounded-xl shadow-sm">
        <button class="px-6 py-3 border-2 border-dashed border-gray-400 text-gray-600 font-medium rounded-lg hover:border-gray-600 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
          Dashed Outline
        </button>
        <button class="px-6 py-3 border-2 border-dashed border-blue-400 text-blue-600 font-medium rounded-lg hover:border-blue-600 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
          Dashed Blue
        </button>
      </div>
    </div>

  </section>

</body>
</html>
