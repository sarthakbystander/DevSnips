<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browse the DevSnips open-source UI library."><title>Library — DevSnips</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/site.css"><style>.library{padding:70px 0}.library-head{display:flex;justify-content:space-between;gap:30px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:35px}.library h1{font-size:clamp(48px,7vw,82px);line-height:.9;letter-spacing:-.07em;margin:12px 0}.library-head p{max-width:400px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 30px}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 11px;font:11px 'JetBrains Mono',monospace;cursor:pointer}.filter.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}#results{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.resource{background:var(--surface);min-height:245px;padding:23px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;transition:.2s}.resource:hover{background:var(--accent);transform:translateY(-3px);z-index:2}.resource small{font:10px 'JetBrains Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.resource h2{font-size:20px;letter-spacing:-.04em;margin:35px 0 8px}.resource p{font-size:12px;color:var(--muted);margin:0}.resource-foot{margin-top:auto;padding-top:25px;font:10px 'JetBrains Mono',monospace;color:var(--muted)}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}@media(max-width:800px){.library-head{display:block}.library-head p{margin-top:25px}#results{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="nav-shell"><a class="brand" href="../"><span class="brand-mark">D</span><span>DevSnips</span></a><nav class="desktop-nav"><a href="./">Library</a><a href="../docs/">Docs</a><a href="https://github.com/sarthakbystander/DevSnips">GitHub</a></nav><div class="nav-actions"><button class="icon-button" data-theme-toggle aria-label="Toggle theme">◐</button></div></div></header><main class="section-shell library"><div class="library-head"><div><p class="section-kicker">DevSnips / Library</p><h1>Find your<br>starting point.</h1></div><p>Browse the registry by technology and resource type. The repository remains the source of truth; this interface is its readable front door.</p></div><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="Tailwind">Tailwind</button><button class="filter" data-filter="React">React</button><button class="filter" data-filter="Vanilla">Vanilla</button><button class="filter" data-filter="Components">Components</button><button class="filter" data-filter="Sections">Sections</button><button class="filter" data-filter="Templates">Templates</button></div><div id="results"><div class="empty">Loading the library…</div></div></main><footer class="site-footer"><div class="footer-bottom section-shell"><span>DevSnips</span><span>MIT License</span></div></footer><script src="../assets/js/site.js"></script><script>const results=document.querySelector('#results');let data=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function norm(x){return typeof x==='string'?x:String(x??'')}function draw(filter='all'){const list=data.filter(x=>{const blob=JSON.stringify(x).toLowerCase();return filter==='all'||blob.includes(filter.toLowerCase())}).slice(0,120);results.innerHTML=list.length?list.map(x=>{const name=x.name||x.title||x.slug||'Untitled resource';const tech=x.technology||x.tech||x.framework||'DevSnips';const type=x.type||x.category||'Resource';return `<a class="resource" href="#"><small>${esc(tech)} / ${esc(type)}</small><h2>${esc(name)}</h2><p>${esc(x.description||x.summary||'Production-ready UI resource.')}</p><div class="resource-foot">View resource ↗</div></a>`}).join(''):'<div class="empty">No resources matched that filter.</div>'}fetch('../../snippets-index.json').then(r=>r.json()).then(x=>{data=Array.isArray(x)?x:(x.snippets||x.resources||[]);draw()}).catch(()=>{results.innerHTML='<div class="empty">The registry could not be loaded. Try again from the deployed site.</div>'});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.filter)})</script></body></html>
