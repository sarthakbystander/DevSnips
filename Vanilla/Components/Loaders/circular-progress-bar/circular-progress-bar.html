<!-- Snippet Name: Circular Progress Bar | Use Case: Displaying progress | Description: A circular progress bar. -->
<style>
.progress-circle {
  position: relative;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: conic-gradient(var(--ds-accent, #4a90e2) 75%, var(--ds-surface-3, #eee) 0);
  display: flex;
  justify-content: center;
  align-items: center;
}
.progress-circle::before {
  content: '';
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: white;
}
.progress-circle span {
  position: relative;
  font-size: 24px;
  color: var(--ds-foreground, #333);
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
<div class="progress-circle" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Progress">
  <span>75%</span>
</div>
