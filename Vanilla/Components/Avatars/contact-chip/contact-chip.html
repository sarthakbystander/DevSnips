<!-- Snippet Name: Contact Chip | Use Case: Contact lists | Description: A contact chip with an image. -->
<style>
.chip {
  display: inline-block;
  padding: 0 25px;
  height: 50px;
  font-size: 16px;
  line-height: 50px;
  border-radius: var(--ds-radius-2xl, 25px);
  background-color: var(--ds-surface-2, #f1f1f1);
}
.chip img {
  float: left;
  margin: 0 10px 0 -25px;
  height: 50px;
  width: 50px;
  border-radius: 50%;
}

:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}
