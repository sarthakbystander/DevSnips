<!--
Snippet Name: Toast Notification Markup
Description: Non-blocking toast notification container with ARIA live region.
Author: DevSnips Contributors
Usage Example: Inject toast messages into the list at runtime with JavaScript.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toast Notification Markup</title>
  <style>
/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
</head>
  <body>
    <section aria-label="Notifications">
      <ul aria-live="polite" aria-atomic="true">
        <li role="status">
          <p>Profile updated successfully.</p>
          <button type="button" aria-label="Dismiss notification">Dismiss</button>
        </li>
      </ul>
    </section>
  </body>
</html>
