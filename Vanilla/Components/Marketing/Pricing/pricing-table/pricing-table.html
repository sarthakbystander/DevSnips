<!-- Snippet Name: Pricing Table | Use Case: Displaying subscription plans | Description: A responsive pricing table. -->
<style>
.pricing-table {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}
.pricing-plan {
  border: 1px solid var(--ds-border-strong, #ccc);
  border-radius: var(--ds-radius-sm, 5px);
  padding: 20px;
  margin: 10px;
  text-align: center;
  width: 300px;
}
.pricing-plan h3 {
  margin-top: 0;
}
.pricing-plan .price {
  font-size: 24px;
  font-weight: bold;
}
.pricing-plan ul {
  list-style: none;
  padding: 0;
}
.pricing-plan .btn {
  background: var(--ds-accent, #4a90e2);
  color: white;
  padding: 10px 20px;
  border-radius: var(--ds-radius-sm, 5px);
  text-decoration: none;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
<div class="pricing-table">
  <div class="pricing-plan">
    <h3>Basic</h3>
    <div class="price">$10/mo</div>
    <ul>
      <li>Feature 1</li>
      <li>Feature 2</li>
    </ul>
    <a href="#" class="btn">Select</a>
  </div>
  <div class="pricing-plan">
    <h3>Pro</h3>
    <div class="price">$20/mo</div>
    <ul>
      <li>Feature 1</li>
      <li>Feature 2</li>
      <li>Feature 3</li>
    </ul>
    <a href="#" class="btn">Select</a>
  </div>
</div>
