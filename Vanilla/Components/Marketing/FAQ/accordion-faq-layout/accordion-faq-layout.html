<!--
Snippet Name: Accordion FAQ Layout
Description: Semantic FAQ accordion using details/summary elements.
Author: DevSnips Contributors
Usage Example: Duplicate each details block to add more FAQ entries.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion FAQ Layout</title>
  <style>
/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
</head>
  <body>
    <section aria-labelledby="faq-title">
      <h2 id="faq-title">Frequently asked questions</h2>

      <details>
        <summary>How do I use this snippet?</summary>
        <p>Copy the section and customize text/content for your product.</p>
      </details>

      <details>
        <summary>Is this accessible?</summary>
        <p>Yes, details/summary provides native keyboard and screen reader support.</p>
      </details>
    </section>
  </body>
</html>
