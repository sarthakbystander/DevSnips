<!-- Image Slider/Carousel -->
<div class="slider">
  <button class="prev">&#8592;</button>
  <img class="slide" src="https://placehold.co/300x180?text=1" alt="Slide 1">
  <img class="slide" src="https://placehold.co/300x180?text=2" alt="Slide 2" style="display:none;">
  <img class="slide" src="https://placehold.co/300x180?text=3" alt="Slide 3" style="display:none;">
  <button class="next">&#8594;</button>
</div>

<style>
.slider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1em;
  margin: 2em auto;
  max-width: 350px;
}
.slide {
  width: 300px;
  height: 180px;
  object-fit: cover;
  border-radius: var(--ds-radius-md, 8px);
  box-shadow: 0 2px 8px #0002;
}
button.prev, button.next {
  background: var(--ds-accent, #6366f1);
  color: var(--ds-surface, #fff);
  border: none;
  border-radius: 50%;
  width: 2.5em;
  height: 2.5em;
  font-size: 1.2em;
  cursor: pointer;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>

<script>
const slides = document.querySelectorAll('.slide');
let idx = 0;
document.querySelector('.next').onclick = () => {
  slides[idx].style.display = 'none';
  idx = (idx + 1) % slides.length;
  slides[idx].style.display = '';
};
document.querySelector('.prev').onclick = () => {
  slides[idx].style.display = 'none';
  idx = (idx - 1 + slides.length) % slides.length;
  slides[idx].style.display = '';
};
</script>
