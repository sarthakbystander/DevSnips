<!--
  Snippet Name: Canvas Element
  Use Case: Drawing graphics, on the fly, via scripting (usually JavaScript).
  Description: The <canvas> tag is used to draw graphics, on the fly, via scripting (usually JavaScript).
-->
<canvas id="myCanvas" width="200" height="100" style="border:1px solid var(--ds-foreground, #000000);">
</canvas>
<script>
var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");
ctx.fillStyle = "#FF0000";
ctx.fillRect(0,0,150,75);
</script>
