<!-- Snippet Name: Diagonal Background | Use Case: Sections, headers | Description: A section with a diagonal background. -->
<style>
.diagonal-box {
  background: var(--ds-foreground, #333);
  color: white;
  padding: 50px;
  position: relative;
}

.diagonal-box:before {
  content: "";
  position: absolute;
  left: 0;
  top: -50px;
  right: 0;
  bottom: 0;
  transform: skewY(-5deg);
  transform-origin: 50% 0;
  outline: 1px solid transparent;
  background: inherit;
  backface-visibility: hidden;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>

<div class="diagonal-box">
  <h2>Diagonal Background</h2>
</div>
