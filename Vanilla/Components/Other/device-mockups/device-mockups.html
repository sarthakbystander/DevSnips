<!-- Snippet Name: Device Mockups | Use Case: Portfolios, product showcases | Description: Device mockups for showcasing websites or apps. -->
<style>
.device {
  position: relative;
  width: 300px;
  height: 600px;
  background: var(--ds-foreground, #111);
  border: 16px solid var(--ds-foreground, #000);
  border-top-width: 60px;
  border-bottom-width: 60px;
  border-radius: 36px;
}

.device-content {
  width: 100%;
  height: 100%;
  background: white;
  overflow: hidden;
}

.device-content img {
  width: 100%;
  height: auto;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>

<div class="device">
  <div class="device-content">
    <img src="https://via.placeholder.com/300x540" alt="screenshot">
  </div>
</div>
