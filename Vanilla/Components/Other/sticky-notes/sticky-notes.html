<!-- Snippet Name: Sticky Notes | Use Case: Notes, reminders | Description: A simple sticky note effect. -->
<style>
.note {
  background: #ffc;
  padding: 1em;
  box-shadow: 5px 5px 7px rgba(33,33,33,.7);
  width: 200px;
  height: 200px;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid #2563eb;outline-offset:2px;}
</style>

<div class="note">
  <p>This is a sticky note.</p>
</div>
