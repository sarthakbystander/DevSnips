<!-- Snippet Name: Holy Grail Layout | Use Case: Layout | Description: A responsive holy grail layout. -->
<style>
.container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.header, .footer {
  background: var(--ds-foreground, #333);
  color: white;
  padding: 10px;
}
.main {
  display: flex;
  flex: 1;
}
.nav, .aside {
  background: var(--ds-surface-2, #f4f4f4);
  padding: 10px;
}
.content {
  flex: 1;
  padding: 10px;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>

<div class="container">
  <header class="header">Header</header>
  <main class="main">
    <nav class="nav">Navigation</nav>
    <article class="content">Main Content</article>
    <aside class="aside">Sidebar</aside>
  </main>
  <footer class="footer">Footer</footer>
</div>
