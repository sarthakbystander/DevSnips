<!-- Snippet Name: Creative Image Hover | Use Case: Image galleries, portfolios | Description: An image with a creative hover effect. -->
<style>
.image-container {
  position: relative;
  width: 300px;
  overflow: hidden;
}
.image-container img {
  width: 100%;
  transition: transform 0.3s;
}
.image-container:hover img {
  transform: scale(1.1);
}
.image-container .overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  color: white;
  opacity: 0;
  transition: opacity 0.3s;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.image-container:hover .overlay {
  opacity: 1;
}

/* devsnips-qa:quality-bar */
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
<div class="image-container">
  <img src="https://via.placeholder.com/300" alt="Placeholder">
  <div class="overlay">
    <h3>Image Title</h3>
    <p>A short description.</p>
  </div>
</div>
