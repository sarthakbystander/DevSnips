<!-- Snippet Name: Calendar Widget | Use Case: Calendars, date pickers | Description: A simple calendar widget. -->
<style>
.calendar {
  width: 300px;
  border: 1px solid var(--ds-border-strong, #ccc);
  border-radius: var(--ds-radius-sm, 5px);
  overflow: hidden;
}

.month {
  padding: 10px;
  background: var(--ds-foreground, #333);
  color: white;
  text-align: center;
}

.days {
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.day {
  text-align: center;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>

<div class="calendar">
  <div class="month">
    <h3 id="month-name"></h3>
  </div>
  <div class="days" id="days-grid">
  </div>
</div>

<script>
  const monthNameEl = document.getElementById('month-name');
  const daysGridEl = document.getElementById('days-grid');

  const date = new Date();
  const month = date.toLocaleString('default', { month: 'long' });
  const year = date.getFullYear();

  monthNameEl.innerText = `${month} ${year}`;

  const daysInMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
  const firstDayOfMonth = new Date(date.getFullYear(), date.getMonth(), 1).getDay();

  const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  weekdays.forEach(day => {
    const dayEl = document.createElement('div');
    dayEl.classList.add('day');
    dayEl.innerText = day;
    daysGridEl.appendChild(dayEl);
  });

  for (let i = 0; i < firstDayOfMonth; i++) {
    const dayEl = document.createElement('div');
    dayEl.classList.add('day');
    daysGridEl.appendChild(dayEl);
  }

  for (let i = 1; i <= daysInMonth; i++) {
    const dayEl = document.createElement('div');
    dayEl.classList.add('day');
    dayEl.innerText = i;
    daysGridEl.appendChild(dayEl);
  }
</script>
