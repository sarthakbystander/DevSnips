  Snippet Name: Blockquote with Cite
  Use Case: Quoting a section from another source.
  Description: The <blockquote> element is used to indicate that the enclosed text is an extended quotation. The cite attribute can be used to provide the URL of the source.

<blockquote cite="https://www.huxley.net/bnw/four.html">
  <p>Words can be like X-rays, if you use them properly—they’ll go through anything. You read and you’re pierced.</p>
</blockquote>
<p>—Aldous Huxley, <cite>Brave New World</cite></p>
