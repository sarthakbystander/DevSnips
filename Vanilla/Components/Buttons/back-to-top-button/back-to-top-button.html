<!-- Snippet Name: Back to Top Button | Use Case: Long pages | Description: A button that appears after scrolling and takes the user to the top of the page. -->
<style>
.back-to-top {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #4a90e2;
  color: white;
  padding: 10px;
  border-radius: 50%;
  display: none;
  cursor: pointer;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid #2563eb;outline-offset:2px;}
</style>
<a id="back-to-top" class="back-to-top" href="#top" role="button" aria-label="Back to top" tabindex="0">TOP</a>
<script>
window.onscroll = function() {
  if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
    document.getElementById("back-to-top").style.display = "block";
  } else {
    document.getElementById("back-to-top").style.display = "none";
  }
};
var btt = document.getElementById("back-to-top");
btt.onclick = function() {
  document.body.scrollTop = 0;
  document.documentElement.scrollTop = 0;
};
btt.addEventListener("keydown", function(e) {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); btt.click(); }
});
</script>
