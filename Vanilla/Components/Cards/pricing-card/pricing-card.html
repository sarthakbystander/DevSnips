<!--
Snippet Name: Pricing Card
Description: Semantic pricing card with plan name, price, feature list, and CTA.
Author: DevSnips Contributors
Usage Example: Place multiple cards in a grid for tiered pricing sections.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Card Snippet</title>
  <style>
/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
</head>
  <body>
    <article aria-labelledby="starter-plan-title">
      <h3 id="starter-plan-title">Starter</h3>
      <p><strong>$12</strong> / month</p>
      <ul>
        <li>Up to 5 projects</li>
        <li>Email support</li>
        <li>Community access</li>
      </ul>
      <button type="button" aria-label="Choose Starter plan">Choose plan</button>
    </article>
  </body>
</html>
