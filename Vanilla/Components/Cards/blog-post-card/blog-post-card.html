<!-- Snippet Name: Blog Post Card | Use Case: Blog feeds | Description: A card for a blog post. -->
<style>
.card {
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
  transition: 0.3s;
  width: 40%;
}
.card:hover {
  box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
}
.container {
  padding: 2px 16px;
}

/* devsnips-qa:quality-bar */

</style>
<div class="card">
  <img src="https://via.placeholder.com/400x300" alt="Avatar" style="width:100%">
  <div class="container">
    <h4><b>John Doe</b></h4>
    <p>Architect & Engineer</p>
  </div>
</div>
