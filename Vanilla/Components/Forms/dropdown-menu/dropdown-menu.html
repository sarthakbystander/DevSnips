<!-- Snippet Name: Dropdown Menu | Use Case: Navigation | Description: A simple dropdown menu. -->
<style>
.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f9f9f9;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}

.dropdown:hover .dropdown-content {
  display: block;
}

.dropdown-trigger {
  background: inherit;
  border: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  padding: 0;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid #2563eb;outline-offset:2px;}
</style>

<div class="dropdown">
  <button type="button" class="dropdown-trigger" aria-haspopup="true" aria-expanded="false">Mouse over me</button>
  <div class="dropdown-content" role="menu" aria-label="Dropdown options">
    <p role="menuitem">Hello World!</p>
  </div>
</div>
