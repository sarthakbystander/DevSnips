<!-- Snippet Name: Dropdown Menu | Use Case: Navigation | Description: A simple dropdown menu. -->
<style>
.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: var(--ds-surface-2, #f9f9f9);
  min-width: 160px;
  box-shadow: var(--ds-shadow-lg, 0px 8px 16px 0px rgba(0,0,0,0.2));
  z-index: 1;
}

.dropdown-content a {
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}

.dropdown:hover .dropdown-content {
  display: block;
}

.dropdown-trigger {
  background: inherit;
  border: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  padding: 0;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>

<div class="dropdown">
  <button type="button" class="dropdown-trigger" aria-haspopup="true" aria-expanded="false">Mouse over me</button>
  <div class="dropdown-content" role="menu" aria-label="Dropdown options">
    <p role="menuitem">Hello World!</p>
  </div>
</div>
