<!--
  Snippet Name: Datalist for Autocomplete
  Use Case: Providing an "autocomplete" feature for <input> elements.
  Description: The <datalist> element contains a set of <option> elements that represent the permissible or recommended values for the <input> element.
-->
<label for="browser">Choose your browser from the list:</label>
<input list="browsers" name="browser" id="browser">
<datalist id="browsers">
  <option value="Edge"></option>
  <option value="Firefox"></option>
  <option value="Chrome"></option>
  <option value="Opera"></option>
  <option value="Safari"></option>
</datalist>
