<!-- Form Validation -->
<form id="myForm" novalidate>
  <input type="text" id="name" placeholder="Name (required)" required>
  <input type="email" id="email" placeholder="Email (required)" required>
  <button type="submit">Submit</button>
  <div id="errorMsg" style="color:var(--ds-danger, #dc2626);margin-top:0.5em;"></div>
</form>

<style>
#myForm {
  max-width: 350px;
  margin: 2em auto;
  display: flex;
  flex-direction: column;
  gap: 0.75em;
}
input {
  padding: 0.5em;
  border: 1px solid #d1d5db;
  border-radius: var(--ds-radius-sm, 4px);
}
button {
  background: var(--ds-accent, #6366f1);
  color: var(--ds-surface, #fff);
  border: none;
  border-radius: var(--ds-radius-sm, 4px);
  padding: 0.5em 1em;
  cursor: pointer;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>

<script>
const form = document.getElementById('myForm');
const errorMsg = document.getElementById('errorMsg');
form.onsubmit = e => {
  e.preventDefault();
  errorMsg.textContent = '';
  if (!form.name.value.trim() || !form.email.value.trim()) {
    errorMsg.textContent = 'Please fill in all required fields.';
    return;
  }
  if (!/^[^@]+@[^@]+\.[^@]+$/.test(form.email.value)) {
    errorMsg.textContent = 'Please enter a valid email address.';
    return;
  }
  errorMsg.textContent = 'Form submitted!';
};
</script>
