<!-- Tooltip: Hover tooltip without JavaScript -->
<button class="tooltip-btn">Hover me
  <span class="tooltip-text">Tooltip text appears here</span>
</button>
<style>
.tooltip-btn {
  position: relative;
  background: var(--ds-accent, #6a5af9);
  color: var(--ds-surface, #fff);
  border: none;
  padding: 0.7em 1.5em;
  border-radius: var(--ds-radius-md, 6px);
  cursor: pointer;
  font-size: 1em;
}
.tooltip-text {
  visibility: hidden;
  opacity: 0;
  width: 140px;
  background: var(--ds-foreground, #222);
  color: var(--ds-surface, #fff);
  text-align: center;
  border-radius: var(--ds-radius-md, 6px);
  padding: 0.5em 0.7em;
  position: absolute;
  z-index: 1;
  left: 50%;
  bottom: 125%;
  transform: translateX(-50%);
  transition: opacity 0.3s;
  pointer-events: none;
}
.tooltip-btn:hover .tooltip-text {
  visibility: visible;
  opacity: 1;
}
@media (max-width: 500px) {
  .tooltip-text {
    width: 90vw;
    left: 5vw;
    transform: none;
  }
}

@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
