<!-- Snippet Name: Cookie Consent Banner | Use Case: GDPR compliance | Description: A banner to inform users about cookie usage. -->
<style>
.cookie-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: var(--ds-foreground, #333);
  color: white;
  padding: 15px;
  text-align: center;
}
.cookie-banner .btn {
  background: var(--ds-accent, #4a90e2);
  color: white;
  padding: 5px 10px;
  border-radius: var(--ds-radius-sm, 5px);
  text-decoration: none;
  margin-left: 10px;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
<div id="cookie-banner" class="cookie-banner">
  <p>This website uses cookies to ensure you get the best experience on our website. <a href="#" class="btn" onclick="document.getElementById('cookie-banner').style.display = 'none'">Got it!</a></p>
</div>
