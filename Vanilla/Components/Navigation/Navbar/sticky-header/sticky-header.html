<!-- Snippet Name: Sticky Header | Use Case: Creating a header that stays fixed at the top of the viewport while scrolling | Description: Uses `position: sticky` to keep the header visible. A fallback to `position: fixed` can be used for older browsers. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Header</title>
    <style>
        body {
            font-family: var(--ds-font-sans, Arial, sans-serif);
            margin: 0;
            line-height: 1.6;
        }
        .header {
            position: sticky;
            top: 0;
            background-color: var(--ds-foreground, #333);
            color: white;
            padding: 1rem;
            text-align: center;
            z-index: 1000;
        }
        .content {
            padding: 2rem;
            height: 200vh; /* Make page scrollable to demonstrate stickiness */
        }
    
/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
</head>
<body>

    <header class="header">
        <h1>Sticky Header</h1>
    </header>

    <main class="content">
        <h2>Scroll down to see the header stick.</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. ... </p>
    </main>

</body>
</html>
