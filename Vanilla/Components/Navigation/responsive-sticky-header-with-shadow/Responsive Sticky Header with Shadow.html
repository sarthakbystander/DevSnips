<header class="sticky-header">My Site</header>


<style>
.sticky-header{position:sticky;top:0;background:var(--ds-surface, #fff);padding:1rem;transition:box-shadow .25s}
.sticky-header.scrolled{box-shadow:0 6px 18px rgba(0,0,0,.08)}

/* devsnips-qa:quality-bar */
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

<script>
const h=document.querySelector('.sticky-header');window.addEventListener('scroll',()=>h.classList.toggle('scrolled',window.scrollY>40));
</script>
