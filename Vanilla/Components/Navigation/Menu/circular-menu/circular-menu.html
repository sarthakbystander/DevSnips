<!-- Snippet Name: Circular Menu | Use Case: Navigation | Description: A circular navigation menu. -->
<style>
.menu {
  position: relative;
  width: 200px;
  height: 200px;
  border-radius: 50%;
}

.menu-item {
  position: absolute;
  left: 50%;
  top: 50%;
  transform-origin: 0 0;
  width: 50px;
  height: 50px;
  background: var(--ds-foreground, #333);
  color: white;
  text-align: center;
  line-height: 50px;
  border-radius: 50%;
}

/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>

<div class="menu">
  <div class="menu-item" style="transform: rotate(0deg) translate(100px) rotate(0deg);">1</div>
  <div class="menu-item" style="transform: rotate(60deg) translate(100px) rotate(-60deg);">2</div>
  <div class="menu-item" style="transform: rotate(120deg) translate(100px) rotate(-120deg);">3</div>
  <div class="menu-item" style="transform: rotate(180deg) translate(100px) rotate(-180deg);">4</div>
  <div class="menu-item" style="transform: rotate(240deg) translate(100px) rotate(-240deg);">5</div>
  <div class="menu-item" style="transform: rotate(300deg) translate(100px) rotate(-300deg);">6</div>
</div>
