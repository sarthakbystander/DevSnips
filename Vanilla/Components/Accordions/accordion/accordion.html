<!-- Accordion: Expand/collapse UI using :checked selector (CSS-only) -->
<div class="accordion">
  <input type="checkbox" id="section1">
  <label for="section1">Accordion Title</label>
  <div class="content">
    <p>This is the accordion content. It expands and collapses smoothly.</p>
  </div>
</div>
<style>
.accordion {
  max-width: 400px;
  margin: 2em auto;
  font-family: var(--ds-font-sans, Arial, sans-serif);
}
.accordion input[type="checkbox"] {
  display: none;
}
.accordion label {
  display: block;
  background: var(--ds-accent, #6a5af9);
  color: var(--ds-surface, #fff);
  padding: 1em;
  cursor: pointer;
  border-radius: var(--ds-radius-md, 8px) 8px 0 0;
  font-weight: bold;
}
.accordion .content {
  max-height: 0;
  overflow: hidden;
  background: #f3f3f3;
  transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
  border-radius: 0 0 8px 8px;
  padding: 0 1em;
}
.accordion input:checked ~ .content {
  max-height: 100px;
  padding: 1em;
}
@media (max-width: 500px) {
  .accordion {
    max-width: 95vw;
  }
}

/* devsnips-qa:quality-bar */
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
