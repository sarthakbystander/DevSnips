<!-- Accordion Panel -->
<div class="accordion">
  <div class="accordion-item">
    <button class="accordion-header">Section 1</button>
    <div class="accordion-content">Content for section 1.</div>
  </div>
  <div class="accordion-item">
    <button class="accordion-header">Section 2</button>
    <div class="accordion-content">Content for section 2.</div>
  </div>
</div>

<style>
.accordion {
  max-width: 400px;
  margin: 1em auto;
  border-radius: var(--ds-radius-md, 8px);
  overflow: hidden;
  box-shadow: 0 2px 8px #0001;
}
.accordion-header {
  width: 100%;
  padding: 1em;
  background: var(--ds-accent, #6366f1);
  color: var(--ds-surface, #fff);
  border: none;
  text-align: left;
  cursor: pointer;
  outline: none;
  font-size: 1.1em;
  transition: background 0.2s;
}
.accordion-header:hover { background: #4338ca; }
.accordion-content {
  max-height: 0;
  overflow: hidden;
  background: var(--ds-surface-3, #f4f4f5);
  transition: max-height 0.3s ease;
  padding: 0 1em;
}
.accordion-item.active .accordion-content {
  max-height: 100px;
  padding: 1em;
}

/* devsnips-qa:quality-bar */
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>

<script>
// Accordion toggle logic
const headers = document.querySelectorAll('.accordion-header');
headers.forEach(header => {
  header.onclick = function() {
    const item = this.parentElement;
    item.classList.toggle('active');
  };
});
</script>
