<div class="collapsible-accordion">
  <div class="accordion-item">
    <button class="accordion-header" aria-expanded="false">
      <span>Section 1</span>
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/>
      </svg>
    </button>
    <div class="accordion-content">
      <p>Content for section 1 goes here.</p>
    </div>
  </div>

  <div class="accordion-item">
    <button class="accordion-header" aria-expanded="false">
      <span>Section 2</span>
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/>
      </svg>
    </button>
    <div class="accordion-content">
      <p>Content for section 2 goes here.</p>
    </div>
  </div>
</div>

<style>
.collapsible-accordion {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}

.accordion-item {
  border: 1px solid var(--ds-border, #ddd);
  margin-bottom: 5px;
}

.accordion-header {
  width: 100%;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: none;
  background: var(--ds-surface-2, #f4f4f4);
  cursor: pointer;
}

.accordion-header:hover {
  background: #e4e4e4;
}

.accordion-content {
  padding: 0 15px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.2s ease-out;
}

.accordion-header[aria-expanded="true"] + .accordion-content {
  max-height: 100px;
}

.icon {
  width: 24px;
  height: 24px;
  transition: transform 0.2s ease;
}

.accordion-header[aria-expanded="true"] .icon {
  transform: rotate(180deg);
}

@media (max-width: 480px) {
  .accordion-header {
    padding: 10px;
  }
  
  .accordion-content {
    padding: 0 10px;
  }
}

/* devsnips-qa:quality-bar */
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}}
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>

<script>
document.querySelectorAll('.accordion-header').forEach(button => {
  button.addEventListener('click', () => {
    const expanded = button.getAttribute('aria-expanded') === 'true';
    button.setAttribute('aria-expanded', !expanded);
  });
});
</script>
