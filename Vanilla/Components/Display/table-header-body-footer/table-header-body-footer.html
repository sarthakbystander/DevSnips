<!-- Table with Header, Body, and Footer HTML Example -->
<table>
  <thead>
    <tr>
      <th>Product</th>
      <th>Price</th>
      <th>Stock</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Widget A</td>
      <td>$10</td>
      <td>25</td>
    </tr>
    <tr>
      <td>Widget B</td>
      <td>$15</td>
      <td>12</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td colspan="3">End of List</td>
    </tr>
  </tfoot>
</table>
