<!-- Snippet Name: Sticky Footer | Use Case: Creating a footer that stays fixed at the bottom of the viewport | Description: Uses `position: fixed` to keep the footer visible at all times. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Footer</title>
    <style>
        body {
            font-family: var(--ds-font-sans, Arial, sans-serif);
            margin: 0;
            padding-bottom: 60px; /* Adjust this value to match the footer's height */
            line-height: 1.6;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--ds-foreground, #333);
            color: white;
            text-align: center;
            padding: 1rem;
            z-index: 1000;
        }
        .content {
            padding: 2rem;
            height: 150vh; /* Make page scrollable */
        }
    
/* devsnips-qa:quality-bar */
:focus-visible{outline:2px solid var(--ds-accent, #2563eb);outline-offset:2px;}

/* DevSnips design tokens (Swiss) — override by editing tokens.css */
:root{
--ds-surface:#fff;--ds-surface-2:#f7f7f7;--ds-foreground:#0a0a0a;--ds-muted:#525252;--ds-border:#e5e5e5;--ds-accent:#2563eb;--ds-accent-fg:#fff;--ds-radius-sm:4px;--ds-radius-md:8px;--ds-radius-lg:12px;--ds-shadow-sm:0 1px 2px rgba(0,0,0,.05);--ds-shadow-md:0 4px 6px -1px rgba(0,0,0,.08);--ds-font-sans:system-ui,sans-serif;
}
</style>
</head>
<body>

    <main class="content">
        <h2>Scroll down the page.</h2>
        <p>The footer will remain at the bottom.</p>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. ... </p>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Sticky Footer</p>
    </footer>

</body>
</html>
