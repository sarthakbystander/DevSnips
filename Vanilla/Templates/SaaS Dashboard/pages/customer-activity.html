<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer activity — Northstar | DevSnips</title>
  <meta name="description" content="Per-customer activity: logins, purchases, subscription events, support, account changes.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-page="customers">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <main class="main" id="main" data-page="customers">
      <div id="crumbs"></div>
      <div class="page-head">
        <div class="titles"><h1>Customer activity</h1><p class="sub" id="c-sub"></p></div>
        <div class="page-actions">
          <select class="select" id="act-type" aria-label="Filter by type"><option value="">All events</option><option>login</option><option>purchase</option><option>subscription</option><option>support</option><option>account</option></select>
          <button class="btn" data-toast="Exporting activity…"><span class="btn-text">Export</span></button>
        </div>
      </div>

      <section class="stat-grid mb-16" id="c-stats"></section>

      <section class="panel mb-0">
        <div class="panel-head"><div class="titles"><h2>Event timeline</h2><p class="desc">Every recorded action for this customer</p></div></div>
        <ul class="timeline-icon" id="c-act"></ul>
        <div class="table-foot"><span class="page-info" id="count"></span></div>
      </section>

      <footer class="foot">
        <span>© 2026 Northstar — DevSnips Vanilla template demo. Data is illustrative.</span>
        <div class="links"><a href="help-center.html">Docs</a><a href="support.html">Support</a><a href="system-status.html">Status</a></div>
      </footer>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
  (function () {
    'use strict';
    var NS = window.NS, DB = window.DB, esc = NS.esc, ICONS = NS.ICONS;
    var TYPE_ICON = { login: 'user', purchase: 'card', subscription: 'plans', support: 'support', account: 'settings' };
    var TYPE_TONE = { login: '#4f46e5', purchase: '#10b981', subscription: '#0ea5e9', support: '#f59e0b', account: '#64748b' };
    function onReady(fn) { if (document.querySelector('.topbar')) fn(); else window.addEventListener('ns:ready', fn); }
    onReady(function () {
      var params = new URLSearchParams(location.search);
      var c = DB.customers.find(function (x) { return x.id === params.get('id'); }) || DB.customers[0];
      document.getElementById('crumbs').innerHTML = NS.crumbs([{label:'Customers',href:'customers.html'},{label:esc(c.name),href:'customer-details.html?id='+c.id},{label:'Activity'}]);
      document.getElementById('c-sub').textContent = c.name + ' · ' + c.company;

      // build a richer per-customer event set
      var events = [
        { type: 'login', text: 'Signed in from Stockholm, SE (Chrome · macOS)', time: '2 min ago' },
        { type: 'purchase', text: 'Paid invoice INV-2042 for $840.00 (Visa •• 4242)', time: '14 min ago' },
        { type: 'subscription', text: 'Upgraded from Growth to Scale plan', time: '2 hours ago' },
        { type: 'account', text: 'Updated billing email to billing@northwind.io', time: '5 hours ago' },
        { type: 'support', text: 'Opened a conversation: "Scale plan upgrade question"', time: '6 hours ago' },
        { type: 'login', text: 'Signed in from Stockholm, SE (Safari · iPhone)', time: '1 day ago' },
        { type: 'purchase', text: 'Paid invoice INV-2035 for $49.00 (Visa •• 4242)', time: '2 days ago' },
        { type: 'subscription', text: 'Started a 14-day trial of Growth', time: '5 days ago' },
        { type: 'account', text: 'Created account', time: '5 days ago' }
      ];

      document.getElementById('c-stats').innerHTML = [
        { lbl: 'Logins (30d)', val: '47' }, { lbl: 'Purchases', val: '12' }, { lbl: 'Support tickets', val: '3' }, { lbl: 'Plan changes', val: '2' }
      ].map(function (s) { return '<div class="stat"><div class="lbl">' + s.lbl + '</div><div class="val">' + s.val + '</div></div>'; }).join('');

      var filter = '';
      function render() {
        var rows = events.filter(function (e) { return !filter || e.type === filter; });
        document.getElementById('c-act').innerHTML = rows.map(function (e) {
          return '<li><span class="ic" style="background:' + TYPE_TONE[e.type] + '">' + (ICONS[TYPE_ICON[e.type]] || ICONS.activity) + '</span><div class="body"><p class="ev">' + esc(e.text) + '</p><p class="meta"><span>' + esc(e.type) + '</span><span class="sep">•</span><span>' + esc(e.time) + '</span></p></div></li>';
        }).join('') || NS.emptyState('No events', 'No events match this filter.');
        document.getElementById('count').textContent = 'Showing ' + rows.length + ' of ' + events.length + ' events';
      }
      render();
      document.getElementById('act-type').addEventListener('change', function () { filter = this.value; render(); });
    });
  })();
  </script>
  
</body>
</html>
