<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer segments — Northstar | DevSnips</title>
  <meta name="description" content="Create and manage customer segments with dynamic filters and customer counts.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-page="customer-segments">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <main class="main" id="main" data-page="customer-segments">
      <div class="page-head">
        <div class="titles">
          <div id="crumbs"></div>
          <h1>Segments</h1>
          <p class="sub">Dynamic customer groups based on rules and attributes.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="new-segment"><span class="btn-text">New segment</span></button>
        </div>
      </div>

      <div class="grid-3" id="seg-cards"></div>

      <section class="panel mb-0">
        <div class="panel-head"><div class="titles"><h2>Segment details</h2><p class="desc">High-value accounts — 6 customers match</p></div>
          <div class="actions"><button class="btn btn-sm" data-toast="Exporting segment…">Export</button></div>
        </div>
        <div class="data-table-wrap">
          <table class="data">
            <thead><tr><th>Customer</th><th class="nosort">Plan</th><th class="nosort">Status</th><th class="nosort" style="text-align:right">ARR</th><th class="nosort">Last active</th></tr></thead>
            <tbody id="seg-members"></tbody>
          </table>
        </div>
      </section>

      <footer class="foot">
        <span>© 2026 Northstar — DevSnips Vanilla template demo. Data is illustrative.</span>
        <div class="links"><a href="help-center.html">Docs</a><a href="support.html">Support</a><a href="system-status.html">Status</a></div>
      </footer>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
  (function () {
    'use strict';
    var NS = window.NS, DB = window.DB, esc = NS.esc, money = NS.money, pill = NS.pill, ICONS = NS.ICONS;
    function onReady(fn) { if (document.querySelector('.topbar')) fn(); else window.addEventListener('ns:ready', fn); }
    onReady(function () {
      document.getElementById('crumbs').innerHTML = NS.crumbs([{label:'Customers',href:'customers.html'},{label:'Segments'}]);
      document.getElementById('seg-cards').innerHTML = DB.segments.map(function (s) {
        return '<section class="panel mb-0" style="border-top:3px solid ' + s.color + '"><div class="panel-body"><div class="flex items-center justify-between mb-8"><h3 class="font-bold">' + esc(s.name) + '</h3><span class="tag">' + s.count + ' customers</span></div><p class="muted-block">' + esc(s.desc) + '</p><div class="field mt-16 mb-0"><label class="field-label">Criteria</label><code class="mono text-sm" style="background:var(--ds-sunken);padding:4px 8px;border-radius:4px;display:block">' + esc(s.criteria) + '</code></div><div class="flex gap-8 mt-16"><a class="btn btn-sm btn-primary" href="#">View customers</a><button class="btn btn-sm" data-toast="Editing ' + esc(s.name) + '">Edit</button></div></div></section>';
      }).join('');

      // show members of "High-value accounts" segment
      var members = DB.customers.filter(function (c) { return c.plan === 'Scale' && c.arr > 10000; });
      document.getElementById('seg-members').innerHTML = members.map(function (c) {
        return '<tr><td><div class="cust"><span class="pic" style="background:' + c.tone + '">' + c.initials + '</span><div class="meta"><div class="nm">' + esc(c.name) + '</div><div class="em">' + esc(c.email) + '</div></div></div></td><td class="plan-cell">' + esc(c.plan) + '</td><td>' + pill(c.status) + '</td><td class="amount mono">' + money(c.arr) + '</td><td class="muted">' + esc(c.lastActive) + '</td></tr>';
      }).join('') || '<tr><td colspan="5" class="empty-row">No customers in this segment.</td></tr>';

      document.getElementById('new-segment').addEventListener('click', function () {
        NS.modal({
          title: 'New segment', sub: 'Define rules to group customers dynamically',
          body: '<div class="field"><label class="field-label">Segment name <span class="req">*</span></label><input class="input" placeholder="e.g. At-risk accounts"></div>' +
            '<div class="field"><label class="field-label">Description</label><textarea class="textarea" placeholder="What does this segment represent?"></textarea></div>' +
            '<div class="field"><label class="field-label">Match</label><select class="select"><option>All conditions (AND)</option><option>Any condition (OR)</option></select></div>' +
            '<div class="field"><label class="field-label">Condition 1</label><div class="form-row-3"><select class="select"><option>Plan</option><option>Status</option><option>ARR</option><option>Country</option><option>Signup date</option></select><select class="select"><option>equals</option><option>is not</option><option>is greater than</option><option>is less than</option><option>contains</option></select><input class="input" placeholder="value"></div></div>' +
            '<div class="field"><label class="field-label">Condition 2</label><div class="form-row-3"><select class="select"><option>Status</option><option>Plan</option><option>ARR</option></select><select class="select"><option>equals</option><option>is not</option></select><input class="input" placeholder="value"></div></div>' +
            '<div class="usage-note"><strong>Live preview:</strong> 8 customers match these conditions.</div>',
          foot: '<button class="btn" data-cancel-modal>Cancel</button><button class="btn btn-primary" id="create-seg">Create segment</button>',
          onOpen: function (bd, close) { bd.querySelector('[data-cancel-modal]').addEventListener('click', close); bd.querySelector('#create-seg').addEventListener('click', function () { close(); NS.toast('Segment created', 'success'); }); }
        });
      });
    });
  })();
  </script>
  
</body>
</html>
