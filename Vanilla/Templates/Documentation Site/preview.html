<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevSnips — Documentation</title>
  <meta name="description" content="DevSnips documentation — an open-source, framework-free frontend component library. Introduction, installation, components, templates, design tokens, API reference, guides, and contribution guides.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    /* ============================================================
       DevSnips Documentation — design system
       Built on Pico CSS + the shared DevSnips --ds-* token system.
       Neutral-first, one blue accent, hairline borders, tight rhythm.
       Editorial, technical, typography-driven. Light + dark.
       ============================================================ */

    /* ---- Primitive + semantic tokens (light) -------------------- */
    :root {
      /* neutral ramp (warm-neutral paper) */
      --ds-gray-0:   #ffffff;
      --ds-gray-25:  #fcfcfd;
      --ds-gray-50:  #f8f9fa;
      --ds-gray-100: #f1f3f5;
      --ds-gray-150: #e9ecef;
      --ds-gray-200: #e3e7eb;
      --ds-gray-300: #d4d9e0;
      --ds-gray-400: #b0b8c4;
      --ds-gray-500: #8a93a3;
      --ds-gray-600: #5f6b7d;
      --ds-gray-700: #46505f;
      --ds-gray-800: #2a323e;
      --ds-gray-850: #1a2029;
      --ds-gray-900: #11161e;
      --ds-gray-950: #0b0f15;
      --ds-gray-1000:#06090d;

      /* accent (blue-600 family — the DevSnips default, never violet) */
      --ds-blue-50:  #eff6ff;
      --ds-blue-100: #dbeafe;
      --ds-blue-200: #bfdbfe;
      --ds-blue-500: #3b82f6;
      --ds-blue-600: #2563eb;
      --ds-blue-700: #1d4ed8;

      /* status */
      --ds-green-600: #16a34a;
      --ds-amber-600: #d97706;
      --ds-red-600:   #dc2626;
      --ds-sky-600:   #0284c7;

      /* semantic surfaces */
      --ds-bg-canvas:        var(--ds-gray-50);
      --ds-bg-surface:       var(--ds-gray-0);
      --ds-bg-surface-subtle:var(--ds-gray-25);
      --ds-bg-sunken:        var(--ds-gray-100);
      --ds-bg-overlay:       rgba(11, 15, 21, 0.45);

      /* semantic text */
      --ds-text-primary:   var(--ds-gray-900);
      --ds-text-secondary: var(--ds-gray-700);
      --ds-text-muted:     var(--ds-gray-500);
      --ds-text-faint:     var(--ds-gray-400);
      --ds-text-inverse:   var(--ds-gray-0);

      /* borders */
      --ds-border-subtle:  var(--ds-gray-150);
      --ds-border-default: var(--ds-gray-200);
      --ds-border-strong:  var(--ds-gray-300);
      --ds-border-focus:   var(--ds-blue-500);

      /* actions */
      --ds-action-primary:        var(--ds-blue-600);
      --ds-action-primary-hover:  var(--ds-blue-700);
      --ds-action-primary-active:#1e40af;
      --ds-action-secondary:      var(--ds-gray-0);
      --ds-action-secondary-hover: var(--ds-gray-50);
      --ds-action-secondary-active:var(--ds-gray-100);
      --ds-action-danger:        var(--ds-red-600);
      --ds-action-danger-hover:  #b91c1c;

      /* status semantic */
      --ds-status-success:        var(--ds-green-600);
      --ds-status-success-bg:    #ecfdf5;
      --ds-status-success-border:#bbf7d0;
      --ds-status-warning:        var(--ds-amber-600);
      --ds-status-warning-bg:    #fffbeb;
      --ds-status-warning-border:#fde68a;
      --ds-status-danger:        var(--ds-red-600);
      --ds-status-danger-bg:    #fef2f2;
      --ds-status-danger-border:#fecaca;
      --ds-status-info:          var(--ds-sky-600);
      --ds-status-info-bg:      #f0f9ff;
      --ds-status-info-border:  #bae6fd;

      /* type */
      --ds-font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --ds-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --ds-font-display: var(--ds-font-sans);

      /* type scale */
      --ds-text-xs: 12px;
      --ds-text-sm: 13.5px;
      --ds-text-md: 15px;
      --ds-text-lg: 17px;
      --ds-text-xl: 20px;
      --ds-text-2xl: 24px;
      --ds-text-3xl: 30px;
      --ds-text-4xl: 36px;

      /* weights + leading + tracking */
      --ds-weight-regular: 400;
      --ds-weight-medium:  500;
      --ds-weight-semibold:600;
      --ds-weight-bold:    700;
      --ds-leading-tight: 1.25;
      --ds-leading-snug:  1.4;
      --ds-leading-normal: 1.6;
      --ds-leading-relaxed:1.7;
      --ds-tracking-tight:-0.011em;
      --ds-tracking-normal:0;
      --ds-tracking-wide: 0.02em;

      /* spacing */
      --ds-space-1: 4px;
      --ds-space-2: 8px;
      --ds-space-3: 12px;
      --ds-space-4: 16px;
      --ds-space-5: 20px;
      --ds-space-6: 24px;
      --ds-space-8: 32px;
      --ds-space-10: 40px;
      --ds-space-12: 48px;
      --ds-space-16: 64px;

      /* radius */
      --ds-radius-none: 0;
      --ds-radius-xs: 3px;
      --ds-radius-sm: 5px;
      --ds-radius-md: 7px;
      --ds-radius-lg: 10px;
      --ds-radius-xl: 14px;
      --ds-radius-full: 9999px;

      /* shadow (subtle) */
      --ds-shadow-xs: 0 1px 0 rgba(17,22,30,0.04);
      --ds-shadow-sm: 0 1px 2px rgba(17,22,30,0.06), 0 1px 1px rgba(17,22,30,0.03);
      --ds-shadow-md: 0 4px 14px rgba(17,22,30,0.08);
      --ds-shadow-lg: 0 16px 40px rgba(17,22,30,0.12);

      /* motion */
      --ds-duration-fast: 90ms;
      --ds-duration-normal: 160ms;
      --ds-duration-slow: 240ms;
      --ds-ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
      --ds-ease-emphasized: cubic-bezier(0.2, 0, 0, 1);

      /* z-index */
      --ds-z-sticky: 100;
      --ds-z-overlay: 200;
      --ds-z-drawer: 300;
      --ds-z-modal: 400;

      /* template tokens */
      --template-sidebar-width: 268px;
      --template-toc-width: 232px;
      --template-content-max: 760px;
      --template-header-height: 56px;
      --template-accent: var(--ds-blue-600);
      --template-accent-soft: var(--ds-blue-50);
      --template-radius: var(--ds-radius-md);

      /* code token colors (light) */
      --c-bg: var(--ds-gray-950);
      --c-fg: #e6e9ef;
      --c-comment: #6b7689;
      --c-punct: #9aa5b8;
      --c-tag: #7dd3fc;
      --c-attr: #c4b5fd;
      --c-string: #86efac;
      --c-number: #fca5a5;
      --c-keyword: #f0abfc;
      --c-fn: #93c5fd;
      --c-prop: #fcd34d;
    }

    /* ---- Dark theme --------------------------------------------- */
    [data-theme="dark"] {
      --ds-bg-canvas:        #0b0f15;
      --ds-bg-surface:       #11161e;
      --ds-bg-surface-subtle:#0e131a;
      --ds-bg-sunken:        #161c26;
      --ds-bg-overlay:       rgba(0, 0, 0, 0.6);

      --ds-text-primary:   #e6e9ef;
      --ds-text-secondary:#aeb6c4;
      --ds-text-muted:    #7a8494;
      --ds-text-faint:     #5a6473;
      --ds-text-inverse:   #0b0f15;

      --ds-border-subtle:  #1a2029;
      --ds-border-default: #222a36;
      --ds-border-strong:  #2f3845;
      --ds-border-focus:   #60a5fa;

      --ds-action-primary:        #3b82f6;
      --ds-action-primary-hover:  #60a5fa;
      --ds-action-primary-active:#2563eb;
      --ds-action-secondary:      var(--ds-gray-850);
      --ds-action-secondary-hover:#1a2029;
      --ds-action-secondary-active:#222a36;
      --ds-action-danger:        #f87171;
      --ds-action-danger-hover:  #fb7185;

      --ds-status-success:        #4ade80;
      --ds-status-success-bg:    #052e1b;
      --ds-status-success-border:#14532d;
      --ds-status-warning:        #fbbf24;
      --ds-status-warning-bg:    #2a1c02;
      --ds-status-warning-border:#78350f;
      --ds-status-danger:        #fb7185;
      --ds-status-danger-bg:    #2c0a12;
      --ds-status-danger-border:#7f1d1d;
      --ds-status-info:          #38bdf8;
      --ds-status-info-bg:      #08243a;
      --ds-status-info-border:  #0c4a6e;

      --ds-shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --ds-shadow-md: 0 4px 14px rgba(0,0,0,0.4);
      --ds-shadow-lg: 0 16px 40px rgba(0,0,0,0.55);

      --template-accent: var(--ds-blue-500);
      --template-accent-soft: rgba(59,130,246,0.12);
    }

    /* no-JS / no-persist fallback: follow system on first paint */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --ds-bg-canvas:#0b0f15; --ds-bg-surface:#11161e;
        --ds-bg-surface-subtle:#0e131a; --ds-bg-sunken:#161c26;
        --ds-bg-overlay:rgba(0,0,0,0.6);
        --ds-text-primary:#e6e9ef; --ds-text-secondary:#aeb6c4;
        --ds-text-muted:#7a8494; --ds-text-faint:#5a6473; --ds-text-inverse:#0b0f15;
        --ds-border-subtle:#1a2029; --ds-border-default:#222a36;
        --ds-border-strong:#2f3845; --ds-border-focus:#60a5fa;
        --ds-action-primary:#3b82f6; --ds-action-primary-hover:#60a5fa;
        --ds-action-primary-active:#2563eb;
        --ds-action-secondary:#1a2029; --ds-action-secondary-hover:#222a36;
        --ds-action-secondary-active:#2f3845; --ds-action-danger:#f87171;
        --template-accent:var(--ds-blue-500); --template-accent-soft:rgba(59,130,246,0.12);
      }
    }

    /* ---- Pico overrides ----------------------------------------- */
    :root {
      --pico-font-family: var(--ds-font-sans);
      --pico-font-family-monospace: var(--ds-font-mono);
      --pico-font-size: var(--ds-text-md);
      --pico-line-height: var(--ds-leading-normal);
      --pico-primary: var(--template-accent);
      --pico-primary-hover: var(--ds-action-primary-hover);
      --pico-background-color: var(--ds-bg-surface);
      --pico-color: var(--ds-text-primary);
      --pico-muted-color: var(--ds-text-muted);
      --pico-border-color: var(--ds-border-default);
      --pico-spacing: var(--ds-space-4);
      --pico-border-radius: var(--ds-radius-md);
      --pico-form-element-background-color: var(--ds-bg-surface);
      --pico-form-element-border-color: var(--ds-border-default);
      --pico-form-element-color: var(--ds-text-primary);
      --pico-form-element-focus-color: var(--ds-text-primary);
      --pico-switch-color: var(--ds-blue-500);
      --pico-zindex-modal-overlay: var(--ds-z-modal);
      --pico-blockquote-border-color: var(--ds-border-default);
      --pico-mark-background: var(--ds-blue-50);
      --pico-mark-color: var(--ds-text-primary);
    }

    /* ---- Base reset / typography --------------------------------- */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
    body {
      margin: 0;
      font-family: var(--ds-font-sans);
      font-size: var(--ds-text-md);
      line-height: var(--ds-leading-normal);
      color: var(--ds-text-primary);
      background: var(--ds-bg-canvas);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, h5, h6, p, ul, ol, figure { margin: 0; }
    a { color: var(--template-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img, svg { display: block; max-width: 100%; }
    code, kbd, samp, pre { font-family: var(--ds-font-mono); font-feature-settings: 'tnum' 1, 'liga' 0; }
    .mono { font-family: var(--ds-font-mono); }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--ds-border-strong); border-radius: var(--ds-radius-full); border: 2px solid var(--ds-bg-canvas); }
    ::-webkit-scrollbar-thumb:hover { background: var(--ds-text-faint); }

    :focus-visible {
      outline: 2px solid var(--ds-border-focus);
      outline-offset: 2px;
      border-radius: var(--ds-radius-xs);
    }

    .skip-link {
      position: absolute; left: -9999px; top: 8px; z-index: var(--ds-z-modal);
      background: var(--ds-action-primary); color: #fff; padding: 8px 14px;
      border-radius: var(--ds-radius-sm); font-weight: 600; font-size: var(--ds-text-sm);
    }
    .skip-link:focus { left: 8px; }

    .sr-only {
      position: absolute !important; width: 1px !important; height: 1px !important;
      padding: 0 !important; margin: -1px !important; overflow: hidden !important;
      clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important;
    }

    /* ---- App shell layout ---------------------------------------- */
    .app {
      display: grid;
      grid-template-columns: var(--template-sidebar-width) minmax(0, 1fr);
      grid-template-rows: var(--template-header-height) 1fr;
      grid-template-areas:
        "header header"
        "sidebar main";
      min-height: 100vh;
    }
    .app-header { grid-area: header; }
    .app-sidebar { grid-area: sidebar; }
    .app-main { grid-area: main; }

    /* ---- Header -------------------------------------------------- */
    .app-header {
      display: flex; align-items: center; gap: var(--ds-space-3);
      height: var(--template-header-height);
      padding: 0 var(--ds-space-5);
      background: color-mix(in srgb, var(--ds-bg-surface) 88%, transparent);
      backdrop-filter: saturate(180%) blur(10px);
      -webkit-backdrop-filter: saturate(180%) blur(10px);
      border-bottom: 1px solid var(--ds-border-default);
      position: sticky; top: 0; z-index: var(--ds-z-sticky);
    }
    .header-left { display: flex; align-items: center; gap: var(--ds-space-3); min-width: 0; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: var(--ds-radius-sm);
      border: 1px solid transparent; background: transparent;
      color: var(--ds-text-secondary); cursor: pointer;
      transition: background var(--ds-duration-fast) var(--ds-ease-standard), color var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .icon-btn:hover { background: var(--ds-bg-sunken); color: var(--ds-text-primary); }
    .icon-btn svg { width: 18px; height: 18px; }
    #menu-toggle { display: none; }

    .brand {
      display: inline-flex; align-items: center; gap: 9px;
      color: var(--ds-text-primary); text-decoration: none; font-weight: var(--ds-weight-bold);
    }
    .brand:hover { text-decoration: none; }
    .brand .mark { width: 26px; height: 26px; border-radius: 7px; flex: 0 0 26px; }
    .brand .name { font-size: var(--ds-text-md); letter-spacing: var(--ds-tracking-tight); }
    .brand .sep { color: var(--ds-text-faint); margin: 0 2px; font-weight: var(--ds-weight-regular); }
    .brand .ctx { color: var(--ds-text-secondary); font-weight: var(--ds-weight-semibold); font-size: var(--ds-text-md); }

    .header-search {
      position: relative; flex: 1; max-width: 380px; margin-left: auto;
    }
    .search-trigger {
      display: flex; align-items: center; gap: var(--ds-space-2);
      width: 100%; height: 36px; padding: 0 var(--ds-space-3);
      background: var(--ds-bg-surface-subtle);
      border: 1px solid var(--ds-border-default);
      border-radius: var(--ds-radius-md);
      color: var(--ds-text-muted); font-size: var(--ds-text-sm);
      cursor: pointer; text-align: left;
      transition: border-color var(--ds-duration-fast) var(--ds-ease-standard), background var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .search-trigger:hover { border-color: var(--ds-border-strong); background: var(--ds-bg-surface); }
    .search-trigger svg { width: 15px; height: 15px; flex: 0 0 15px; }
    .search-trigger .label { flex: 1; }
    .search-trigger .kbd {
      font-family: var(--ds-font-mono); font-size: 11px; line-height: 1;
      padding: 3px 6px; border: 1px solid var(--ds-border-default);
      border-radius: var(--ds-radius-xs); background: var(--ds-bg-surface); color: var(--ds-text-muted);
    }

    .header-actions { display: flex; align-items: center; gap: var(--ds-space-1); margin-left: var(--ds-space-2); }
    .header-actions .icon-btn.navlink { width: auto; padding: 0 10px; gap: 6px; font-size: var(--ds-text-sm); color: var(--ds-text-secondary); }
    .header-actions .icon-btn.navlink svg { width: 16px; height: 16px; }

    /* ---- Sidebar ------------------------------------------------- */
    .app-sidebar {
      background: var(--ds-bg-surface);
      border-right: 1px solid var(--ds-border-default);
      position: sticky; top: var(--template-header-height);
      height: calc(100vh - var(--template-header-height));
      overflow-y: auto; overflow-x: hidden;
      padding: var(--ds-space-4) 0 var(--ds-space-8);
    }
    .nav-search { padding: 0 var(--ds-space-4) var(--ds-space-3); }
    .nav-search input {
      width: 100%; height: 34px; padding: 0 var(--ds-space-3) 0 var(--ds-space-8);
      background: var(--ds-bg-surface-subtle);
      border: 1px solid var(--ds-border-default);
      border-radius: var(--ds-radius-md);
      color: var(--ds-text-primary); font-size: var(--ds-text-sm);
      transition: border-color var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .nav-search input::placeholder { color: var(--ds-text-faint); }
    .nav-search input:focus { border-color: var(--ds-border-focus); outline: none; background: var(--ds-bg-surface); }
    .nav-search { position: relative; }
    .nav-search .ns-ic { position: absolute; left: calc(var(--ds-space-4) + 10px); top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ds-text-faint); pointer-events: none; }

    .nav { list-style: none; padding: 0; margin: 0; }
    .nav-group { margin-bottom: var(--ds-space-4); }
    .nav-group-label {
      font-size: 11px; font-weight: var(--ds-weight-semibold);
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--ds-text-faint);
      padding: 0 var(--ds-space-5); margin-bottom: var(--ds-space-1);
    }
    .nav-list { list-style: none; padding: 0; margin: 0; }
    .nav-item { margin: 0; }
    .nav-link {
      display: flex; align-items: center; gap: var(--ds-space-2);
      padding: 6px var(--ds-space-5); margin: 1px 0;
      color: var(--ds-text-secondary); font-size: var(--ds-text-sm); font-weight: var(--ds-weight-medium);
      border-left: 2px solid transparent; text-decoration: none;
      transition: color var(--ds-duration-fast) var(--ds-ease-standard), background var(--ds-duration-fast) var(--ds-ease-standard), border-color var(--ds-duration-fast) var(--ds-ease-standard);
      line-height: 1.35;
    }
    .nav-link:hover { color: var(--ds-text-primary); background: var(--ds-bg-surface-subtle); text-decoration: none; }
    .nav-link[aria-current="page"] {
      color: var(--template-accent); font-weight: var(--ds-weight-semibold);
      border-left-color: var(--template-accent); background: var(--template-accent-soft);
    }
    .nav-link .badge-count {
      margin-left: auto; font-size: 10px; font-weight: var(--ds-weight-semibold);
      padding: 1px 6px; border-radius: var(--ds-radius-full);
      background: var(--ds-bg-sunken); color: var(--ds-text-muted); line-height: 1.5;
    }
    .nav-link[aria-current="page"] .badge-count { background: var(--template-accent); color: #fff; }

    /* nested */
    .nav-children { list-style: none; padding: 0; margin: 0 0 2px 0; }
    .nav-children .nav-link { padding-left: calc(var(--ds-space-5) + var(--ds-space-4)); font-size: var(--ds-text-xs); font-weight: var(--ds-weight-regular); color: var(--ds-text-muted); }
    .nav-children .nav-link:hover { color: var(--ds-text-primary); }
    .nav-children .nav-link[aria-current="page"] { color: var(--template-accent); font-weight: var(--ds-weight-medium); }

    .nav-toggle {
      display: flex; align-items: center; gap: var(--ds-space-2); width: 100%;
      padding: 6px var(--ds-space-5); margin: 1px 0;
      color: var(--ds-text-secondary); font-size: var(--ds-text-sm); font-weight: var(--ds-weight-medium);
      background: none; border: none; border-left: 2px solid transparent; cursor: pointer; text-align: left;
      transition: color var(--ds-duration-fast) var(--ds-ease-standard), background var(--ds-duration-fast) var(--ds-ease-standard);
      line-height: 1.35;
    }
    .nav-toggle:hover { color: var(--ds-text-primary); background: var(--ds-bg-surface-subtle); }
    .nav-toggle .chev { margin-left: auto; width: 14px; height: 14px; color: var(--ds-text-faint); transition: transform var(--ds-duration-normal) var(--ds-ease-standard); flex: 0 0 14px; }
    .nav-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
    .nav-toggle .icon { width: 16px; height: 16px; color: var(--ds-text-faint); flex: 0 0 16px; }

    .sidebar-foot {
      margin-top: var(--ds-space-6); padding: var(--ds-space-4) var(--ds-space-5);
      border-top: 1px solid var(--ds-border-default);
      font-size: var(--ds-text-xs); color: var(--ds-text-muted);
    }
    .sidebar-foot a { color: var(--ds-text-secondary); display: inline-flex; align-items: center; gap: 6px; }
    .sidebar-foot a:hover { color: var(--ds-text-primary); }
    .sidebar-foot .ver { font-family: var(--ds-font-mono); color: var(--ds-text-faint); }

    /* ---- Main content area --------------------------------------- */
    .app-main { min-width: 0; }
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--template-toc-width);
      gap: var(--ds-space-10);
      max-width: calc(var(--template-sidebar-width) + 880px + var(--template-toc-width) + var(--ds-space-10));
      margin: 0 auto; padding: 0 var(--ds-space-8) var(--ds-space-16);
    }
    .content-grid > .toc { display: flex; }

    .article { min-width: 0; max-width: var(--template-content-max); margin: 0 auto; padding-top: var(--ds-space-8); }
    .article-home { max-width: none; }

    /* breadcrumbs */
    .breadcrumbs {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      font-size: var(--ds-text-xs); color: var(--ds-text-muted); margin-bottom: var(--ds-space-5);
    }
    .breadcrumbs a { color: var(--ds-text-muted); text-decoration: none; }
    .breadcrumbs a:hover { color: var(--ds-text-primary); }
    .breadcrumbs .sep { color: var(--ds-text-faint); }
    .breadcrumbs [aria-current="page"] { color: var(--ds-text-secondary); }

    /* article header */
    .article-head { margin-bottom: var(--ds-space-6); padding-bottom: var(--ds-space-5); border-bottom: 1px solid var(--ds-border-subtle); }
    .article-eyebrow {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: var(--ds-text-xs); font-weight: var(--ds-weight-semibold);
      text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--template-accent); margin-bottom: var(--ds-space-2);
    }
    .article-title { font-size: var(--ds-text-4xl); font-weight: var(--ds-weight-bold); letter-spacing: var(--ds-tracking-tight); line-height: var(--ds-leading-tight); margin-bottom: var(--ds-space-2); }
    .article-desc { font-size: var(--ds-text-lg); color: var(--ds-text-secondary); line-height: var(--ds-leading-snug); max-width: 64ch; }
    .article-meta { display: flex; align-items: center; gap: var(--ds-space-4); flex-wrap: wrap; margin-top: var(--ds-space-4); font-size: var(--ds-text-xs); color: var(--ds-text-muted); }
    .article-meta .meta-item { display: inline-flex; align-items: center; gap: 5px; }
    .article-meta svg { width: 13px; height: 13px; color: var(--ds-text-faint); }
    .article-meta a { color: var(--ds-text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
    .article-meta a:hover { color: var(--template-accent); }
    .article-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ds-text-faint); }

    /* prose */
    .prose { font-size: var(--ds-text-md); line-height: var(--ds-leading-relaxed); color: var(--ds-text-secondary); }
    .prose > * + * { margin-top: var(--ds-space-5); }
    .prose p { color: var(--ds-text-secondary); }
    .prose strong { color: var(--ds-text-primary); font-weight: var(--ds-weight-semibold); }
    .prose a { color: var(--template-accent); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
    .prose h2 { font-size: var(--ds-text-2xl); font-weight: var(--ds-weight-bold); letter-spacing: var(--ds-tracking-tight); color: var(--ds-text-primary); margin-top: var(--ds-space-12); margin-bottom: var(--ds-space-3); scroll-margin-top: calc(var(--template-header-height) + var(--ds-space-4)); line-height: var(--ds-leading-tight); }
    .prose h2:first-child { margin-top: 0; }
    .prose h3 { font-size: var(--ds-text-lg); font-weight: var(--ds-weight-semibold); color: var(--ds-text-primary); margin-top: var(--ds-space-8); margin-bottom: var(--ds-space-2); scroll-margin-top: calc(var(--template-header-height) + var(--ds-space-4)); line-height: var(--ds-leading-snug); }
    .prose h4 { font-size: var(--ds-text-md); font-weight: var(--ds-weight-semibold); color: var(--ds-text-primary); margin-top: var(--ds-space-6); margin-bottom: var(--ds-space-2); }
    .prose ul, .prose ol { padding-left: 1.3em; }
    .prose li { margin-top: 6px; }
    .prose li::marker { color: var(--ds-text-faint); }
    .prose ul li::marker { content: '–  '; }
    .prose code:not(pre code) {
      font-size: 0.875em; padding: 1.5px 5px; border-radius: var(--ds-radius-xs);
      background: var(--ds-bg-sunken); color: var(--ds-text-primary); border: 1px solid var(--ds-border-subtle);
      white-space: nowrap;
    }
    .prose blockquote { margin: var(--ds-space-5) 0; padding: 0 0 0 var(--ds-space-4); border-left: 3px solid var(--ds-border-strong); color: var(--ds-text-secondary); }
    .prose blockquote p { color: var(--ds-text-secondary); }
    .prose hr { border: 0; border-top: 1px solid var(--ds-border-subtle); margin: var(--ds-space-8) 0; }

    /* anchor links on headings */
    .anchor { position: relative; }
    .anchor-link {
      position: absolute; left: -1.4em; top: 50%; transform: translateY(-50%);
      opacity: 0; color: var(--ds-text-faint); text-decoration: none;
      width: 1em; height: 1em; display: inline-flex; align-items: center; justify-content: center;
      transition: opacity var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .anchor-link svg { width: 14px; height: 14px; }
    .anchor:hover .anchor-link { opacity: 1; }
    .anchor-link:hover { color: var(--template-accent); text-decoration: none; }

    /* ---- Code blocks --------------------------------------------- */
    .code-group { margin: var(--ds-space-6) 0; }
    .code-tabs {
      display: flex; align-items: stretch; gap: 2px; padding: 4px 4px 0;
      background: var(--c-bg); border: 1px solid var(--c-bg); border-bottom: none;
      border-radius: var(--ds-radius-md) var(--ds-radius-md) 0 0; overflow-x: auto;
    }
    .code-tab {
      appearance: none; border: none; background: transparent;
      color: rgba(230,233,239,0.55); font-family: var(--ds-font-mono); font-size: 12px; font-weight: var(--ds-weight-medium);
      padding: 7px 12px; border-radius: var(--ds-radius-sm) var(--ds-radius-sm) 0 0; cursor: pointer;
      white-space: nowrap; transition: color var(--ds-duration-fast) var(--ds-ease-standard), background var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .code-tab:hover { color: rgba(230,233,239,0.85); }
    .code-tab[aria-selected="true"] { color: #fff; background: rgba(255,255,255,0.07); }

    .code-block { position: relative; margin: var(--ds-space-5) 0; }
    .code-block .code-tabs + .code-body { margin-top: 0; border-top-left-radius: 0; }
    .code-body {
      position: relative; background: var(--c-bg); border: 1px solid var(--c-bg);
      border-radius: var(--ds-radius-md); margin: 0; overflow: hidden;
    }
    .code-body.with-tabs { border-top-left-radius: 0; }
    .code-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
    }
    .code-lang { font-family: var(--ds-font-mono); font-size: 11px; font-weight: var(--ds-weight-semibold); color: rgba(230,233,239,0.6); text-transform: uppercase; letter-spacing: 0.05em; }
    .copy-btn {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
      color: rgba(230,233,239,0.7); font-size: 11px; font-weight: var(--ds-weight-medium);
      padding: 3px 9px; border-radius: var(--ds-radius-sm); cursor: pointer;
      transition: background var(--ds-duration-fast) var(--ds-ease-standard), color var(--ds-duration-fast) var(--ds-ease-standard), border-color var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .copy-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }
    .copy-btn svg { width: 13px; height: 13px; }
    .copy-btn.copied { color: #86efac; border-color: rgba(134,239,172,0.4); }
    .copy-btn.copied .copy-label::after { content: ' ✓'; }

    pre.code-pre {
      margin: 0; padding: var(--ds-space-4) var(--ds-space-4);
      background: var(--c-bg); color: var(--c-fg);
      font-family: var(--ds-font-mono); font-size: 12.5px; line-height: 1.65;
      overflow-x: auto; tab-size: 2; -moz-tab-size: 2;
    }
    pre.code-pre code { font-family: inherit; font-size: inherit; background: none; border: none; padding: 0; color: inherit; white-space: pre; }
    .code-body:has(pre.code-pre) .code-header { display: none; }
    .code-body.has-header pre.code-pre { padding-top: var(--ds-space-4); }

    /* syntax token colors */
    .tok-comment { color: var(--c-comment); font-style: italic; }
    .tok-punct { color: var(--c-punct); }
    .tok-tag { color: var(--c-tag); }
    .tok-attr { color: var(--c-attr); }
    .tok-string { color: var(--c-string); }
    .tok-number { color: var(--c-number); }
    .tok-keyword { color: var(--c-keyword); }
    .tok-fn { color: var(--c-fn); }
    .tok-prop { color: var(--c-prop); }
    .tok-bool { color: var(--c-number); font-style: italic; }

    /* ---- Callouts ----------------------------------------------- */
    .callout {
      display: flex; gap: var(--ds-space-3); align-items: flex-start;
      padding: var(--ds-space-4) var(--ds-space-4);
      border: 1px solid var(--ds-border-default); border-left-width: 3px;
      border-radius: var(--ds-radius-md); background: var(--ds-bg-surface-subtle);
      margin: var(--ds-space-6) 0; font-size: var(--ds-text-sm); line-height: var(--ds-leading-normal);
    }
    .callout .co-ic { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 1px; }
    .callout .co-body { flex: 1; min-width: 0; }
    .callout .co-body > *:first-child { margin-top: 0; }
    .callout .co-body > * + * { margin-top: 6px; }
    .callout p { color: var(--ds-text-secondary); margin: 0; }
    .callout strong { color: var(--ds-text-primary); }
    .callout .co-title { font-weight: var(--ds-weight-semibold); color: var(--ds-text-primary); display: block; margin-bottom: 2px; }
    .callout code { font-size: 0.85em; }
    .callout.info    { border-left-color: var(--ds-status-info); background: var(--ds-status-info-bg); }
    .callout.info .co-ic { color: var(--ds-status-info); }
    .callout.note    { border-left-color: var(--ds-text-faint); }
    .callout.note .co-ic { color: var(--ds-text-muted); }
    .callout.tip     { border-left-color: var(--ds-status-success); background: var(--ds-status-success-bg); }
    .callout.tip .co-ic { color: var(--ds-status-success); }
    .callout.warning { border-left-color: var(--ds-status-warning); background: var(--ds-status-warning-bg); }
    .callout.warning .co-ic { color: var(--ds-status-warning); }
    .callout.danger  { border-left-color: var(--ds-status-danger); background: var(--ds-status-danger-bg); }
    .callout.danger .co-ic { color: var(--ds-status-danger); }

    /* ---- Tables -------------------------------------------------- */
    .table-wrap { overflow-x: auto; margin: var(--ds-space-6) 0; border: 1px solid var(--ds-border-default); border-radius: var(--ds-radius-md); }
    table.doc-table { width: 100%; border-collapse: collapse; font-size: var(--ds-text-sm); margin: 0; min-width: 460px; }
    table.doc-table th, table.doc-table td { padding: 10px var(--ds-space-4); text-align: left; border-bottom: 1px solid var(--ds-border-subtle); vertical-align: top; }
    table.doc-table thead th { background: var(--ds-bg-surface-subtle); font-weight: var(--ds-weight-semibold); color: var(--ds-text-secondary); font-size: var(--ds-text-xs); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--ds-border-default); white-space: nowrap; }
    table.doc-table tbody tr:last-child td { border-bottom: none; }
    table.doc-table tbody tr:hover { background: var(--ds-bg-surface-subtle); }
    table.doc-table td code, table.doc-table th code { font-size: 0.85em; }
    table.doc-table .col-name { font-family: var(--ds-font-mono); color: var(--ds-text-primary); font-size: var(--ds-text-xs); white-space: nowrap; }
    table.doc-table .col-type { font-family: var(--ds-font-mono); color: var(--template-accent); font-size: var(--ds-text-xs); }
    table.doc-table .col-default { font-family: var(--ds-font-mono); color: var(--ds-text-muted); font-size: var(--ds-text-xs); }

    /* ---- Badges -------------------------------------------------- */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: var(--ds-weight-semibold); line-height: 1;
      padding: 3px 8px; border-radius: var(--ds-radius-full);
      border: 1px solid var(--ds-border-default); background: var(--ds-bg-surface-subtle); color: var(--ds-text-secondary);
      white-space: nowrap; vertical-align: middle;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 6px; }
    .badge.stable    { color: var(--ds-status-success); border-color: var(--ds-status-success-border); background: var(--ds-status-success-bg); }
    .badge.beta      { color: var(--ds-status-info); border-color: var(--ds-status-info-border); background: var(--ds-status-info-bg); }
    .badge.deprecated{ color: var(--ds-status-warning); border-color: var(--ds-status-warning-border); background: var(--ds-status-warning-bg); }
    .badge.accent    { color: var(--template-accent); border-color: color-mix(in srgb, var(--template-accent) 35%, transparent); background: var(--template-accent-soft); }
    .badge.neutral   { color: var(--ds-text-muted); }
    .badge.solid     { background: var(--ds-text-primary); color: var(--ds-text-inverse); border-color: transparent; }

    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; }

    /* ---- Cards --------------------------------------------------- */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--ds-space-3); margin: var(--ds-space-6) 0; }
    .doc-card {
      display: flex; flex-direction: column; gap: 6px;
      padding: var(--ds-space-4); border: 1px solid var(--ds-border-default); border-radius: var(--ds-radius-md);
      background: var(--ds-bg-surface); text-decoration: none; color: inherit;
      transition: border-color var(--ds-duration-fast) var(--ds-ease-standard), box-shadow var(--ds-duration-fast) var(--ds-ease-standard), transform var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .doc-card:hover { border-color: var(--ds-border-strong); box-shadow: var(--ds-shadow-sm); text-decoration: none; transform: translateY(-1px); }
    .doc-card .dc-ic { width: 30px; height: 30px; border-radius: var(--ds-radius-sm); background: var(--template-accent-soft); color: var(--template-accent); display: grid; place-items: center; margin-bottom: 4px; }
    .doc-card .dc-ic svg { width: 16px; height: 16px; }
    .doc-card .dc-title { font-size: var(--ds-text-sm); font-weight: var(--ds-weight-semibold); color: var(--ds-text-primary); }
    .doc-card .dc-desc { font-size: var(--ds-text-xs); color: var(--ds-text-muted); line-height: 1.5; }
    .doc-card .dc-meta { margin-top: auto; display: flex; gap: 6px; align-items: center; padding-top: 6px; }

    /* ---- Definition lists / API rows ----------------------------- */
    .api-block { border: 1px solid var(--ds-border-default); border-radius: var(--ds-radius-md); margin: var(--ds-space-6) 0; overflow: hidden; }
    .api-head { display: flex; align-items: center; gap: var(--ds-space-3); padding: var(--ds-space-3) var(--ds-space-4); background: var(--ds-bg-surface-subtle); border-bottom: 1px solid var(--ds-border-default); flex-wrap: wrap; }
    .api-head .api-sig { font-family: var(--ds-font-mono); font-size: var(--ds-text-sm); color: var(--ds-text-primary); display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .api-head .api-sig .fn-name { color: var(--template-accent); font-weight: var(--ds-weight-semibold); }
    .api-head .api-sig .ret { color: var(--ds-text-muted); }
    .api-body { padding: var(--ds-space-4); }
    .api-body > * + * { margin-top: var(--ds-space-4); }
    .api-params { list-style: none; padding: 0; margin: 0; }
    .api-params li { padding: 8px 0; border-bottom: 1px solid var(--ds-border-subtle); display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: var(--ds-space-3); font-size: var(--ds-text-sm); }
    .api-params li:last-child { border-bottom: none; }
    .api-params .p-name { font-family: var(--ds-font-mono); color: var(--ds-text-primary); font-size: var(--ds-text-xs); }
    .api-params .p-name .opt { color: var(--ds-text-faint); font-weight: var(--ds-weight-regular); }
    .api-params .p-type { font-family: var(--ds-font-mono); color: var(--template-accent); font-size: 11px; display: block; margin-top: 2px; }
    .api-params .p-desc { color: var(--ds-text-secondary); }

    /* ---- Prev / next --------------------------------------------- */
    .pager {
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--ds-space-3);
      margin-top: var(--ds-space-12); padding-top: var(--ds-space-6); border-top: 1px solid var(--ds-border-subtle);
    }
    .pager a {
      display: flex; flex-direction: column; gap: 4px;
      padding: var(--ds-space-4); border: 1px solid var(--ds-border-default); border-radius: var(--ds-radius-md);
      text-decoration: none; color: inherit; transition: border-color var(--ds-duration-fast) var(--ds-ease-standard), box-shadow var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .pager a:hover { border-color: var(--ds-border-strong); box-shadow: var(--ds-shadow-sm); text-decoration: none; }
    .pager a.next { text-align: right; align-items: flex-end; }
    .pager .p-label { font-size: 11px; color: var(--ds-text-muted); font-weight: var(--ds-weight-semibold); text-transform: uppercase; letter-spacing: 0.04em; display: inline-flex; align-items: center; gap: 5px; }
    .pager .p-label svg { width: 13px; height: 13px; }
    .pager .p-title { font-size: var(--ds-text-sm); font-weight: var(--ds-weight-semibold); color: var(--ds-text-primary); }

    /* ---- TOC ("On this page") ----------------------------------- */
    .toc {
      position: sticky; top: calc(var(--template-header-height) + var(--ds-space-6));
      align-self: start; max-height: calc(100vh - var(--template-header-height) - var(--ds-space-12));
      overflow-y: auto; padding-bottom: var(--ds-space-4);
    }
    .toc-inner { width: var(--template-toc-width); }
    .toc-label { font-size: 11px; font-weight: var(--ds-weight-semibold); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ds-text-faint); margin-bottom: var(--ds-space-3); }
    .toc-list { list-style: none; padding: 0; margin: 0; border-left: 1px solid var(--ds-border-subtle); }
    .toc-list li { margin: 0; }
    .toc-list a {
      display: block; padding: 4px 0 4px var(--ds-space-3); margin-left: -1px;
      color: var(--ds-text-muted); font-size: var(--ds-text-xs); line-height: 1.45;
      border-left: 1px solid transparent; text-decoration: none;
      transition: color var(--ds-duration-fast) var(--ds-ease-standard), border-color var(--ds-duration-fast) var(--ds-ease-standard);
    }
    .toc-list a:hover { color: var(--ds-text-primary); }
    .toc-list a.lvl3 { padding-left: calc(var(--ds-space-3) + var(--ds-space-3)); font-size: 11px; }
    .toc-list a[aria-current="true"] { color: var(--template-accent); border-left-color: var(--template-accent); font-weight: var(--ds-weight-medium); }
    .toc-edit { margin-top: var(--ds-space-5); padding-top: var(--ds-space-4); border-top: 1px solid var(--ds-border-subtle); font-size: var(--ds-text-xs); }
    .toc-edit a { color: var(--ds-text-secondary); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .toc-edit a:hover { color: var(--template-accent); }
    .toc-edit svg { width: 14px; height: 14px; }

    /* mobile TOC toggle */
    .toc-mobile-toggle { display: none; }

    /* ---- Search modal ------------------------------------------- */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: var(--ds-z-modal);
      background: var(--ds-bg-overlay); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: none; align-items: flex-start; justify-content: center; padding: 12vh var(--ds-space-4) var(--ds-space-4);
    }
    .modal-backdrop.open { display: flex; }
    .search-modal {
      width: 100%; max-width: 580px; background: var(--ds-bg-surface);
      border: 1px solid var(--ds-border-default); border-radius: var(--ds-radius-lg);
      box-shadow: var(--ds-shadow-lg); overflow: hidden; display: flex; flex-direction: column; max-height: 60vh;
    }
    .search-modal-input { display: flex; align-items: center; gap: var(--ds-space-2); padding: var(--ds-space-3) var(--ds-space-4); border-bottom: 1px solid var(--ds-border-default); }
    .search-modal-input svg { width: 18px; height: 18px; color: var(--ds-text-muted); flex: 0 0 18px; }
    .search-modal-input input { flex: 1; border: none; background: none; outline: none; font: inherit; font-size: var(--ds-text-md); color: var(--ds-text-primary); }
    .search-modal-input input::placeholder { color: var(--ds-text-faint); }
    .search-modal-input .kbd { font-family: var(--ds-font-mono); font-size: 11px; padding: 3px 6px; border: 1px solid var(--ds-border-default); border-radius: var(--ds-radius-xs); color: var(--ds-text-muted); }
    .search-results { list-style: none; margin: 0; padding: var(--ds-space-2); overflow-y: auto; flex: 1; }

    /* Lightweight syntax highlighter. Escapes HTML first, then applies
       language-aware token spans via regex. Returns safe HTML. */
    function highlight(code, lang) {
      var s = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      function span(cls, txt) { return '<span class="tok-' + cls + '">' + txt + '</span>'; }
      var TK = '\u0000', tokens = [];
      function stash(html) { tokens.push(html); return TK + (tokens.length - 1) + TK; }

      if (lang === 'html') {
        s = s.replace(/(&lt;!--[\s\S]*?--&gt;)/g, function (m) { return stash(span('comment', m)); });
        s = s.replace(/(&lt;\/?)([a-zA-Z][\w:-]*)/g, function (m, p1, p2) { return stash(span('punct', p1)) + stash(span('tag', p2)); });
        s = s.replace(/([\w:-]+)(=)(&quot;[^&]*&quot;|&#39;[^&]*&#39;)/g, function (m, a, eq, v) { return stash(span('attr', a)) + stash(span('punct', eq)) + stash(span('string', v)); });
        s = s.replace(/(&gt;|&lt;\/?)/g, function (m) { return stash(span('punct', m)); });
      } else if (lang === 'css') {
        s = s.replace(/(\/\*[\s\S]*?\*\/)/g, function (m) { return stash(span('comment', m)); });
        s = s.replace(/([a-zA-Z-]+)(\s*:)/g, function (m, p, c) { return stash(span('prop', p)) + c; });
        s = s.replace(/(#[0-9a-fA-F]{3,8}\b|rgba?\([^)]*\)|var\(--[\w-]+\))/g, function (m) { return stash(span('number', m)); });
        s = s.replace(/(@[a-z-]+)/g, function (m) { return stash(span('keyword', m)); });
      } else if (lang === 'js') {
        var kw = /\b(const|let|var|function|return|if|else|for|while|new|this|typeof|instanceof|class|extends|import|export|from|default|async|await|try|catch|finally|throw|delete|in|of|do|switch|case|break|continue|void|null|true|false|undefined)\b/g;
        s = s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g, function (m) { return stash(span('comment', m)); });
        s = s.replace(/(['"`])(?:\\.|(?!\1)[^\n])*\1/g, function (m) { return stash(span('string', m)); });
        s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, function (m) { return stash(span('number', m)); });
        s = s.replace(kw, function (m) { return stash(span('keyword', m)); });
        s = s.replace(/\b([a-zA-Z_$][\w$]*)(?=\()/g, function (m, f) { return stash(span('fn', f)); });
      } else if (lang === 'json') {
        s = s.replace(/(&quot;[^&]*&quot;)(\s*:)/g, function (m, k, c) { return stash(span('attr', k)) + c; });
        s = s.replace(/:\s*(&quot;[^&]*&quot;)/g, function (m, v) { return ': ' + stash(span('string', v)); });

        s = s.replace(/\b(-?\d+(?:\.\d+)?)\b/g, function (m) { return stash(span('number', m)); });
      } else if (lang === 'bash') {
        s = s.replace(/(^|\n)(# [^\n]*|\#[^\n]*)/g, function (m, p, c) { return p + stash(span('comment', c)); });
        s = s.replace(/(^|\s)(npm|npx|pnpm|yarn|git|cd|python3|node|curl|mkdir|cp|mv|rm|pip|echo|export)\b/g, function (m, p, c) { return p + stash(span('keyword', c)); });
        s = s.replace(/(--?[a-zA-Z][\w-]*)/g, function (m) { return stash(span('attr', m)); });
        s = s.replace(/(['"`])(?:\\.|(?!\1)[^\n])*\1/g, function (m) { return stash(span('string', m)); });
      } else {

      s = s.replace(new RegExp(TK + '(\\d+)' + TK, 'g'), function (m, i) { return tokens[+i]; });

      '<p>Every component lives in a folder on disk. A Vanilla accordion is a <code>.html</code> file with inline <code>&lt;style&gt;</code> and <code>&lt;script&gt;</code>, a <code>metadata.json</code> describing it, and a <code>README.md</code>. A Tailwind component is a <code>code.html</code> (the snippet only) plus a <code>preview.html</code> (full page with Tailwind CDN) plus <code>metadata.json</code>. There is no package to install, no registry to query, no transpiler between you and the markup.</p>' +
      h2('philosophy', 'Design philosophy') +
      '<p>The DevSnips design language is deliberately <strong>neutral-first</strong>. Hierarchy comes from typography, spacing, alignment, and hairline borders — not from glow, gradients, or oversized shadows. The shared <a href="#/design-tokens" data-nav="design-tokens">design-token specification</a> establishes the foundation; individual templates adapt it without redefining the whole system.</p>' +

    /* ---- Design Tokens ---- */
    PAGES['design-tokens'] = function () {
      return '<p>The shared <code>--ds-*</code> token system is the single source of truth for the DevSnips visual language. The specification lives at <code>Vanilla/Templates/design-tokens.md</code>. It uses a three-layer architecture: <strong>primitive</strong> → <strong>semantic</strong> → <strong>template</strong> → components.</p>' +
      h2('architecture', 'Token architecture') +
      '<div class="table-wrap"><table class="doc-table"><thead><tr><th>Layer</th><th>Purpose</th><th>Example</th></tr></thead><tbody>' +
      '<tr><td><strong>Primitive</strong></td><td>Raw values</td><td><code>--ds-blue-600</code></td></tr>' +
      '<tr><td><strong>Semantic</strong></td><td>Meaning</td><td><code>--ds-action-primary</code></td></tr>' +
      '<tr><td><strong>Template</strong></td><td>Per-template adaptation</td><td><code>--template-sidebar-width</code></td></tr>' +
      '<tr><td><strong>Component</strong></td><td>Consumes semantic</td><td><code>var(--ds-text-primary)</code></td></tr>' +
      '</tbody></table></div>' +
      h2('naming', 'Naming convention') +
      '<p>All shared tokens use the <code>--ds-[category]-[property]</code> form. Template-specific tokens use <code>--template-[property]</code>. This keeps naming predictable across the entire collection.</p>' +
      code('--ds-bg-canvas       /* semantic background */\n--ds-text-primary    /* semantic text */\n--ds-border-default /* semantic border */\n--ds-space-4         /* spacing scale */\n--ds-radius-md       /* radius scale */\n--template-accent    /* per-template */', 'css') +
      h2('color', 'Color system') +
      '<p>The system is <strong>neutral-first</strong> with one controlled blue accent. The accent is <strong>blue-600</strong> (<code>#2563eb</code>) — never violet or neon. A complete neutral ramp plus controlled blue/green/red/yellow/orange scales support light and dark mode.</p>' +
      table(['Token', 'Light', 'Dark', 'Role'], [
        ['<code>--ds-bg-canvas</code>', '#f8f9fa', '#0b0f15', 'Page background'],
        ['<code>--ds-bg-surface</code>', '#ffffff', '#11161e', 'Cards, panels'],
        ['<code>--ds-text-primary</code>', '#11161e', '#e6e9ef', 'Body text'],
        ['<code>--ds-text-muted</code>', '#8a93a3', '#7a8494', 'Secondary text'],
        ['<code>--ds-border-default</code>', '#e3e7eb', '#222a36', '1px structural borders'],
        ['<code>--ds-action-primary</code>', '#2563eb', '#3b82f6', 'Primary actions']

      h2('typography', 'Typography') +
      '<p>Typography is a primary design element. Inter is the sans, JetBrains Mono the mono. The type scale runs from <code>xs</code> (metadata) to <code>4xl</code> (page heading). Large display sizes are used rarely.</p>' +
      table(['Token', 'Value', 'Use'], [
        ['<code>--ds-text-xs</code>', '12px', 'Metadata, captions'],
        ['<code>--ds-text-sm</code>', '13.5px', 'Supporting text, sidebar'],
        ['<code>--ds-text-md</code>', '15px', 'Standard content'],
        ['<code>--ds-text-lg</code>', '17px', 'Emphasized content'],

        ['<code>--ds-text-2xl</code>', '24px', 'Large section heading'],
        ['<code>--ds-text-4xl</code>', '36px', 'Page heading']

      h2('radius', 'Radius + shadow') +
      '<p>Default interfaces use small radii (<code>none</code>, <code>xs</code>, <code>sm</code>, <code>md</code>). Full rounding is reserved for badges, tags, and avatars. Shadows stay subtle — hierarchy comes from borders and surface contrast, not depth.</p>' +
      code('--ds-radius-xs: 3px;\n--ds-radius-sm: 5px;\n--ds-radius-md: 7px;   /* default */\n--ds-radius-full: 9999px; /* badges, avatars */\n\n--ds-shadow-sm: 0 1px 2px rgba(17,22,30,0.06);  /* subtle */\n--ds-shadow-md: 0 4px 14px rgba(17,22,30,0.08);', 'css') +
      h2('spacing', 'Spacing scale') +
      '<p>A predictable base-4 scale. Avoid one-off values.</p>' +
      code('--ds-space-1: 4px;   --ds-space-2: 8px;\n--ds-space-3: 12px;  --ds-space-4: 16px;\n--ds-space-5: 20px;  --ds-space-6: 24px;\n--ds-space-8: 32px;  --ds-space-10: 40px;\n--ds-space-12: 48px; --ds-space-16: 64px;', 'css') +

        { q: 'How is accessibility handled?', a: '<p>Components use semantic HTML by default. Custom widgets add ARIA roles, states, and properties; all interactive controls are keyboard-operable with <code>:focus-visible</code> rings; animations are guarded by <code>prefers-reduced-motion</code>. Run <code>python3 scripts/qa_vanilla.py</code> for the quality-bar report.</p>' },

    /* ---- build the sidebar nav from NAV ---- */
    function renderNav() {
      var host = $('#primary-nav'); if (!host) return;
      host.innerHTML = '';
      NAV.forEach(function (g) {
        var group = el('div', { class: 'nav-group' });
        group.appendChild(el('div', { class: 'nav-group-label' }, g.group));
        var list = el('ul', { class: 'nav-list' });
        g.items.forEach(function (it) {
          list.appendChild(renderNavItem(it));
        });
        group.appendChild(list);
        host.appendChild(group);
      });
    }
    function renderNavItem(it) {
      var li = el('li', { class: 'nav-item' });
      var baseId = it.id.split('#')[0];
      var href = '#/' + it.id;
      if (it.children && it.children.length) {
        var toggle = el('button', { class: 'nav-toggle', type: 'button', 'aria-expanded': 'true', 'aria-controls': 'children-' + it.id.replace(/[#/]/g,'-') });
        toggle.innerHTML = (it.icon ? svg(it.icon, 16) : '') + '<span>' + esc(it.label) + '</span>' + svg('chevron', 14);
        toggle.addEventListener('click', function () { var open = toggle.getAttribute('aria-expanded') === 'true'; toggle.setAttribute('aria-expanded', String(!open)); var c = li.querySelector('.nav-children'); if (c) c.style.display = !open ? '' : 'none'; });
        li.appendChild(toggle);
        var ul = el('ul', { class: 'nav-children', id: 'children-' + it.id.replace(/[#/]/g,'-') });
        ul.appendChild(el('li', { class: 'nav-item' }, '<a class="nav-link" href="#/' + baseId + '" data-nav="' + baseId + '">' + esc('Overview') + '</a>'));
        it.children.forEach(function (c) {
          ul.appendChild(el('li', { class: 'nav-item' }, '<a class="nav-link" href="#/' + c.id + '" data-nav="' + c.id + '">' + esc(c.label) + '</a>'));
        });
        li.appendChild(ul);
      } else {
        var badgeHtml = it.badge ? '<span class="badge-count">' + esc(it.badge) + '</span>' : '';
        li.appendChild(el('div', { class: 'nav-item' }, '<a class="nav-link" href="' + href + '" data-nav="' + it.id + '">' + (it.icon ? svg(it.icon, 16) : '') + '<span>' + esc(it.label) + '</span>' + badgeHtml + '</a>'));
      }
      return li;
    }

    /* ---- label lookup for breadcrumbs / prev-next / search ---- */
    function labelFor(id) {
      id = id.split('#')[0];
      for (var i = 0; i < NAV.length; i++) {
        for (var j = 0; j < NAV[i].items.length; j++) {
          var it = NAV[i].items[j];
          if (it.id.split('#')[0] === id) return { label: it.label, group: NAV[i].group };
        }
      }
      return { label: id, group: '' };
    }

    /* ---- build the search index from NAV + headings ---- */
    var SEARCH = (function () {
      var items = [];
      NAV.forEach(function (g) {
        g.items.forEach(function (it) {
          var base = it.id.split('#')[0];
          items.push({ type: 'page', page: base, label: it.label, group: g.group, hash: '' });
          if (it.children) it.children.forEach(function (c) {
            items.push({ type: 'section', page: c.id.split('#')[0], label: c.label, group: g.group, hash: c.id.split('#')[1] });
          });
        });
      });
      return items;
    })();

    /* ---- render a page into #pages-root ---- */
    function renderPage(route) {
      var pageId = route.page;
      var anchor = route.hash || '';
      _currentPage = pageId;
      var m = META[pageId] || { title: pageId, updated: '', editPath: '', eyebrow: '' };
      var builder = PAGES[pageId] || PAGES['introduction'];
      var isHome = pageId === 'home';

      var root = $('#pages-root');
      var page = el('div', { class: 'page active' + (isHome ? ' article-home' : '') + ' fade-in', id: 'page-' + pageId });

      /* mobile TOC toggle (only on non-home pages, on < 1181px) */
      var crumbs = buildBreadcrumbs(pageId, m);
      var meta = buildArticleMeta(m, pageId);
      var html = '';
      if (!isHome) {
        html += '<button class="toc-mobile-toggle" type="button" aria-expanded="false" aria-controls="toc-mobile-' + pageId + '">' +
          '<span class="mt-label">' + svg('list', 16) + ' On this page</span>' +
          '<span class="chev">' + svg('chevron', 16) + '</span></button>';
        html += '<div class="toc-mobile-panel" id="toc-mobile-' + pageId + '"></div>';
      }
      html += crumbs;
      html += '<article class="article' + (isHome ? ' article-home' : '') + '">';
      if (!isHome) {
        html += '<header class="article-head">' +
          '<span class="article-eyebrow">' + esc(m.eyebrow) + '</span>' +
          '<h1 class="article-title">' + esc(m.title) + '</h1>' +
          (pageId === 'home' ? '' : '') +
          meta +
        '</header>';
      }
      html += '<div class="prose">' + builder() + '</div>';
      /* prev / next (not on home) */
      if (!isHome) html += buildPager(pageId);
      html += '</article>';

      page.innerHTML = html;
      root.innerHTML = '';
      root.appendChild(page);

      /* wire internal nav links (data-nav) */
      wireNavLinks(page);
      /* wire code tools */
      wireCodeTools(page);
      /* build desktop + mobile TOC from headings */
      buildTOC(page, pageId);
      /* wire mobile TOC toggle */
      wireMobileTOC(page);
      /* update toc edit link */
      var editLink = $('#toc-edit-link');
      if (editLink) editLink.setAttribute('href', 'https://github.com/devsnips/devsnips/edit/main/' + encodeURIComponent(m.editPath).replace(/%2F/g, '/'));

      /* show desktop TOC (hidden on home) */
      var tocDesktop = $('#toc-desktop');
      if (tocDesktop) tocDesktop.style.display = isHome ? 'none' : '';

      /* update document title */
      document.title = m.title + ' — DevSnips Documentation';

      /* active nav state */
      setActiveNav(pageId, anchor);

      /* scroll to anchor or top */
      requestAnimationFrame(function () {
        if (anchor) {
          var target = document.getElementById(anchor);
          if (target) { target.scrollIntoView({ block: 'start' }); return; }
        }
        window.scrollTo(0, 0);
      });
    }

    function buildBreadcrumbs(pageId, m) {
      var home = '<a href="#/home" data-nav="home">Docs</a>';
      if (pageId === 'home') return '<nav class="breadcrumbs" aria-label="Breadcrumb">' + home + '</nav>';
      var group = labelFor(pageId).group;
      return '<nav class="breadcrumbs" aria-label="Breadcrumb">' + home + '<span class="sep">/</span>' +
        (group ? '<a href="#/' + pageId + '">' + esc(group) + '</a><span class="sep">/</span>' : '') +
        '<span aria-current="page">' + esc(m.title) + '</span></nav>';
    }

    function buildArticleMeta(m, pageId) {
      var readingTime = Math.max(2, Math.round((PAGES[pageId] ? PAGES[pageId]().length : 0) / 900));
      return '<div class="article-meta">' +
        '<span class="meta-item">' + svg('calendar', 13) + ' Updated ' + esc(m.updated) + '</span>' +
        '<span class="dot"></span>' +
        '<span class="meta-item">' + svg('clock', 13) + readingTime + ' min read</span>' +
        '<span class="dot"></span>' +
        '<a href="https://github.com/devsnips/devsnips/edit/main/' + encodeURIComponent(m.editPath).replace(/%2F/g, '/') + '" target="_blank" rel="noopener">' + svg('edit', 13) + ' Edit on GitHub</a>' +
      '</div>';
    }

    function buildPager(pageId) {
      var idx = ORDER.indexOf(pageId);
      var prev = idx > 0 ? ORDER[idx - 1] : null;
      var next = idx >= 0 && idx < ORDER.length - 1 ? ORDER[idx + 1] : null;
      var html = '<nav class="pager" aria-label="Pagination">';
      html += prev ? '<a class="prev" href="#/' + prev + '" data-nav="' + prev + '"><span class="p-label">' + svg('arrowLeft', 13) + ' Previous</span><span class="p-title">' + esc(labelFor(prev).label) + '</span></a>' : '<span></span>';
      html += next ? '<a class="next" href="#/' + next + '" data-nav="' + next + '"><span class="p-label">Next ' + svg('arrowRight', 13) + '</span><span class="p-title">' + esc(labelFor(next).label) + '</span></a>' : '<span></span>';
      html += '</nav>';
      return html;
    }

    /* ---- internal nav link wiring (intercept, route without full reload) ---- */
    function wireNavLinks(scope) {
      $$('a[data-nav]', scope).forEach(function (a) {
        a.addEventListener('click', function (e) {
          var href = a.getAttribute('href');
          if (!href || href.indexOf('#/') !== 0) return;
          e.preventDefault();
          closeDrawer();
          location.hash = href.slice(1); /* '#/page#anchor' */
        });
      });
    }

    /* ---- TOC generation + scrollspy ---- */
    var spy = null;
    function buildTOC(page, pageId) {
      var headings = $$('h2, h3', page);
      var items = headings.filter(function (h) { return h.id; });
      var list = $('#toc-list'); if (list) list.innerHTML = '';
      var mobilePanel = $('#toc-mobile-' + pageId);
      var mobileHTML = '<div class="toc-label">On this page</div><ul class="toc-list">';
      if (!items.length) {
        if (list) list.parentElement.parentElement.style.display = 'none';
        var toggle = $('.toc-mobile-toggle', page);
        if (toggle) toggle.style.display = 'none';
        return;
      } else {
        var tocAside = $('#toc-desktop');
        if (tocAside) tocAside.style.display = '';
      }
      items.forEach(function (h) {
        var isH3 = h.tagName === 'H3';
        var href = '#/' + pageId + '#' + h.id;
        var a = '<a href="' + href + '" data-nav="' + pageId + '" class="' + (isH3 ? 'lvl3' : '') + '" data-toc="' + h.id + '">' + esc(h.textContent.replace(/[#?].*$/, '').trim()) + '</a>';
        if (list) list.insertAdjacentHTML('beforeend', '<li>' + a + '</li>');
        mobileHTML += '<li>' + a + '</li>';
      });
      mobileHTML += '</ul>';
      if (mobilePanel) mobilePanel.innerHTML = mobileHTML;
      wireNavLinks(list ? list.parentElement.parentElement : null);
      if (mobilePanel) wireNavLinks(mobilePanel);
      initScrollspy(items);
    }

    function initScrollspy(headings) {
      if (spy) spy.disconnect();
      if (!headings.length || !('IntersectionObserver' in window)) return;
      var tocLinks = {};
      $$('#toc-list a[data-toc]').forEach(function (a) { tocLinks[a.getAttribute('data-toc')] = a; });
      var visible = {};
      spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          visible[en.target.id] = en.isIntersecting;
        });
        /* pick the topmost visible heading */
        var active = null;
        headings.forEach(function (h) { if (visible[h.id] && !active) active = h.id; });
        if (!active) {
          /* find first heading above the viewport top */
          for (var i = 0; i < headings.length; i++) {
            if (headings[i].getBoundingClientRect().top >= 0) { active = headings[i].id; break; }
          }
          if (!active && headings[0]) active = headings[0].id;
        }
        Object.keys(tocLinks).forEach(function (k) { tocLinks[k].removeAttribute('aria-current'); if (k === active) tocLinks[k].setAttribute('aria-current', 'true'); });
      }, { rootMargin: '-' + (56 + 16) + 'px 0px -70% 0px', threshold: [0, 1] });
      headings.forEach(function (h) { spy.observe(h); });
    }

    function wireMobileTOC(page) {
      var toggle = $('.toc-mobile-toggle', page);
      if (!toggle) return;
      toggle.addEventListener('click', function () {
        var open = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!open));
        var panel = $('.toc-mobile-panel', page);
        if (panel) panel.classList.toggle('open', !open);
      });
    }

    /* ---- active nav state ---- */
    function setActiveNav(pageId, anchor) {
      $$('#primary-nav .nav-link').forEach(function (a) {
        a.removeAttribute('aria-current');
        a.removeAttribute('data-active-child');
      });
      var matchId = anchor ? (pageId + '#' + anchor) : pageId;
      $$('#primary-nav .nav-link[data-nav="' + matchId + '"]').forEach(function (a) { a.setAttribute('aria-current', 'page'); });
      /* fallback: match the page-level (no hash) */
      if (!anchor) {
        $$('#primary-nav .nav-link[data-nav="' + pageId + '"]').forEach(function (a) { a.setAttribute('aria-current', 'page'); });
      } else {
        /* also highlight the parent page link */
        $$('#primary-nav .nav-link[data-nav="' + pageId + '"]').forEach(function (a) {
          /* leave child highlighted; parent stays default unless no child matched */
        });
      }
      /* expand the group containing the active page */
      expandActiveGroup(pageId);
    }
    function expandActiveGroup(pageId) {
      $$('#primary-nav .nav-toggle').forEach(function (t) {
        /* keep all expanded by default; no collapse needed */
      });
    }

    /* ---- code tools: copy + tabs ---- */
    function wireCodeTools(scope) {
      $$('.copy-btn', scope).forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-copy');
          var codeEl = document.getElementById(id);
          if (!codeEl) return;
          var text = codeEl.textContent;
          copyText(text).then(function (ok) {
            if (ok) {
              btn.classList.add('copied');
              var label = $('.copy-label', btn);
              if (label) { label.dataset.orig = label.textContent; label.textContent = 'Copied'; }
              toast('Copied to clipboard');
              setTimeout(function () {
                btn.classList.remove('copied');
                if (label && label.dataset.orig) label.textContent = label.dataset.orig;
              }, 1800);
            } else {
              toast('Press Ctrl+C to copy', 'warning');
            }
          });
        });
      });
      $$('.code-tab', scope).forEach(function (tab) {
        tab.addEventListener('click', function () {
          var group = tab.getAttribute('data-group');
          var idx = tab.getAttribute('data-tab');
          $$('.code-tab[data-group="' + group + '"]').forEach(function (t) { t.setAttribute('aria-selected', String(t === tab)); });
          $$('.code-body[data-group="' + group + '"]').forEach(function (b) {
            b.style.display = b.getAttribute('data-pane') === idx ? '' : 'none';
          });
        });
      });
    }
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return legacyCopy(text); });
      }
      return Promise.resolve(legacyCopy(text));
    }
    function legacyCopy(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }
    function toast(msg, type) {
      var t = $('#toast'); if (!t) return;
      t.textContent = msg;
      t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ds-text-primary);color:var(--ds-text-inverse);padding:9px 16px;border-radius:var(--ds-radius-md);font-size:var(--ds-text-sm);font-weight:var(--ds-weight-medium);box-shadow:var(--ds-shadow-md);z-index:var(--ds-z-toast);opacity:0;transition:opacity var(--ds-duration-normal) var(--ds-ease-standard)';
      requestAnimationFrame(function () { t.style.opacity = '1'; });
      clearTimeout(t._timer);
      t._timer = setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.textContent = ''; t.style.cssText = ''; }, 200); }, 2200);
    }

    /* ---- search modal ---- */
    var searchState = { open: false, results: [], active: 0 };
    function openSearch() {
      var modal = $('#search-modal-root');
      if (!modal) return;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      $('#search-trigger').setAttribute('aria-expanded', 'true');
      var input = $('#search-input');
      input.value = '';
      input.focus();
      searchState.open = true;
      renderSearchResults('');
    }
    function closeSearch() {
      var modal = $('#search-modal-root');
      if (!modal) return;
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      $('#search-trigger').setAttribute('aria-expanded', 'false');
      searchState.open = false;
    }
    function renderSearchResults(q) {
      var list = $('#search-results');
      var ql = q.toLowerCase().trim();
      var res;
      if (!ql) {
        res = SEARCH.slice(0, 8);
      } else {
        res = SEARCH.filter(function (it) { return it.label.toLowerCase().indexOf(ql) >= 0 || it.group.toLowerCase().indexOf(ql) >= 0 || it.page.toLowerCase().indexOf(ql) >= 0; }).slice(0, 10);
      }
      searchState.results = res;
      searchState.active = 0;
      if (!res.length) { list.innerHTML = '<li class="search-empty">No results for “' + esc(q) + '”</li>'; return; }
      /* group by page */
      var byPage = {}, order = [];
      res.forEach(function (it) { if (!byPage[it.page]) { byPage[it.page] = []; order.push(it.page); } byPage[it.page].push(it); });
      var html = '';
      order.forEach(function (pg) {
        html += '<li class="sr-group">' + esc(labelFor(pg).label) + '</li>';
        byPage[pg].forEach(function (it, i) {
          var idx = res.indexOf(it);
          var label = highlightMatch(it.label, ql);
          html += '<li><a href="#/' + it.page + (it.hash ? '#' + it.hash : '') + '" data-nav="' + it.page + '" data-idx="' + idx + '" role="option" class="' + (idx === 0 ? 'active' : '') + '"><span class="sr-title">' + label + '</span><span class="sr-path">Vanilla/Templates › ' + esc(it.group) + ' › ' + esc(it.page) + '</span></a></li>';
        });
      });
      list.innerHTML = html;
      wireNavLinks(list);
      $$('#search-results a').forEach(function (a, i) {
        a.addEventListener('mouseenter', function () { setActiveSearch(i); });
        a.addEventListener('click', function () { closeSearch(); });
      });
    }
    function highlightMatch(text, q) {
      if (!q) return esc(text);
      var i = text.toLowerCase().indexOf(q);
      if (i < 0) return esc(text);
      return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
    }
    function setActiveSearch(i) {
      var links = $$('#search-results a');
      if (!links.length) return;
      i = (i + links.length) % links.length;
      searchState.active = i;
      links.forEach(function (a, j) { a.classList.toggle('active', j === i); });
      var el2 = links[i];
      if (el2 && el2.scrollIntoView) el2.scrollIntoView({ block: 'nearest' });
    }

    /* ---- drawer (mobile sidebar) ---- */
    function openDrawer() {
      var sb = $('#app-sidebar'); var bd = $('#drawer-backdrop');
      if (!sb || !bd) return;
      sb.classList.add('open'); bd.classList.add('open');
      bd.setAttribute('aria-hidden', 'false');
      $('#menu-toggle').setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }
    function closeDrawer() {
      var sb = $('#app-sidebar'); var bd = $('#drawer-backdrop');
      if (!sb || !bd) return;
      sb.classList.remove('open'); bd.classList.remove('open');
      bd.setAttribute('aria-hidden', 'true');
      var mt = $('#menu-toggle'); if (mt) mt.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    /* ---- sidebar filter ---- */
    function wireFilter() {
      var input = $('#sidebar-filter');
      if (!input) return;
      input.addEventListener('input', function () {
        var q = input.value.toLowerCase().trim();
        $$('#primary-nav .nav-link, #primary-nav .nav-toggle, #primary-nav .nav-group-label').forEach(function (n) { n.style.display = ''; });
        if (!q) return;
        $$('#primary-nav .nav-group').forEach(function (g) {
          var anyMatch = false;
          $$('a.nav-link', g).forEach(function (a) {
            var match = a.textContent.toLowerCase().indexOf(q) >= 0;
            a.style.display = match ? '' : 'none';
            if (match) anyMatch = true;
          });
          $$('.nav-toggle', g).forEach(function (t) { var match = t.textContent.toLowerCase().indexOf(q) >= 0; t.style.display = match ? '' : 'none'; if (match) anyMatch = true; });
          $$('.nav-group-label', g).forEach(function (l) { l.style.display = anyMatch ? '' : 'none'; });
          g.style.display = anyMatch ? '' : 'none';
        });
      });
    }

    /* ---- theme toggle ---- */
    function wireTheme() {
      var btn = $('#theme-toggle');
      if (!btn) return;
      function syncIcons() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        $('.ic-sun', btn).style.display = dark ? 'none' : '';
        $('.ic-moon', btn).style.display = dark ? '' : 'none';
      }
      syncIcons();
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('devsnips-docs-theme', next); } catch (e) {}
        syncIcons();
      });
    }

    /* ---- router ---- */
    function parseHash() {
      var h = location.hash.replace(/^#/, ''); /* '/page#anchor' or '' */
      if (!h || h === '/') return { page: 'home', hash: '' };
      var parts = h.replace(/^\//, '').split('#');
      var page = parts[0] || 'home';
      var hash = parts[1] || '';
      if (!PAGES[page]) return { page: 'home', hash: '' };
      return { page: page, hash: hash };
    }
    function route() {
      var r = parseHash();
      renderPage(r);
    }

    /* ---- init ---- */
    function init() {
      document.body.classList.remove('no-js');
      renderNav();
      wireFilter();
      wireTheme();
      wireSearchModal();
      wireDrawer();
      wireGlobalKeys();

      /* initial route */
      if (!location.hash || location.hash === '#/') location.hash = '#/home';
      route();

      window.addEventListener('hashchange', route);
    }

    function wireSearchModal() {
      var trigger = $('#search-trigger');
      var modal = $('#search-modal-root');
      var input = $('#search-input');
      if (trigger) trigger.addEventListener('click', openSearch);
      if (modal) modal.addEventListener('click', function (e) { if (e.target === modal) closeSearch(); });
      if (input) input.addEventListener('input', function () { renderSearchResults(input.value); });
    }
    function wireDrawer() {
      var mt = $('#menu-toggle'); var bd = $('#drawer-backdrop');
      if (mt) mt.addEventListener('click', function () {
        var sb = $('#app-sidebar');
        if (sb && sb.classList.contains('open')) closeDrawer(); else openDrawer();
      });
      if (bd) bd.addEventListener('click', closeDrawer);
    }
    function wireGlobalKeys() {
      document.addEventListener('keydown', function (e) {
        /* Cmd/Ctrl+K opens search */
        if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
          e.preventDefault();
          if (searchState.open) closeSearch(); else openSearch();
          return;
        }
        if (searchState.open) {
          if (e.key === 'Escape') { e.preventDefault(); closeSearch(); return; }
          if (e.key === 'ArrowDown') { e.preventDefault(); setActiveSearch(searchState.active + 1); return; }
          if (e.key === 'ArrowUp') { e.preventDefault(); setActiveSearch(searchState.active - 1); return; }
          if (e.key === 'Enter') {
            e.preventDefault();
            var links = $$('#search-results a');
            if (links[searchState.active]) links[searchState.active].click();
            return;
          }
        }
        /* Escape closes drawer */
        var sb = $('#app-sidebar');
        if (e.key === 'Escape' && sb && sb.classList.contains('open')) { closeDrawer(); return; }
        /* '/' focuses search (if not already in an input) */
        if (e.key === '/' && !/input|textarea|select/i.test(e.target.tagName)) {
          e.preventDefault(); openSearch();
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else { init(); }
  })();
  </script>
</body>
</html>
