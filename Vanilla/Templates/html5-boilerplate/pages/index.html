<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <meta name="description" content="">

  <!-- No-flash theme: respect saved preference or system, before paint. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ds-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {}
    })();
  </script>

  <style>
    /* ---------------------------------------------------------------
       DevSnips design tokens (core set).
       Source of truth: Vanilla/Templates/design-tokens.md
       Light-default; calm opt-in dark mode via [data-theme="dark"].
       --------------------------------------------------------------- */
    :root {
      --ds-bg-canvas: #ffffff;
      --ds-bg-surface: #ffffff;
      --ds-bg-surface-subtle: #fafafa;
      --ds-text-primary: #111111;
      --ds-text-secondary: #4b4b4b;
      --ds-text-muted: #707070;
      --ds-text-inverse: #ffffff;
      --ds-border-subtle: #f0f0f0;
      --ds-border-default: #e5e5e5;
      --ds-border-strong: #d2d2d2;
      --ds-border-focus: #111111;
      --ds-action-primary: #111111;
      --ds-action-primary-hover: #222222;
      --ds-accent: #2563eb;

      --ds-font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ds-font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas,
        'Liberation Mono', monospace;

      --ds-radius-sm: 4px;
      --ds-radius-md: 6px;
      --ds-radius-lg: 8px;
      --ds-space-4: 16px;
      --ds-space-6: 24px;
      --ds-space-8: 32px;
      --ds-leading-normal: 1.5;
      --ds-leading-relaxed: 1.65;
      --ds-duration-fast: 120ms;
      --ds-ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --ds-bg-canvas: #0a0a0a;
      --ds-bg-surface: #111111;
      --ds-bg-surface-subtle: #171717;
      --ds-text-primary: #f5f5f5;
      --ds-text-secondary: #c8c8c8;
      --ds-text-muted: #909090;
      --ds-text-inverse: #111111;
      --ds-border-subtle: #1a1a1a;
      --ds-border-default: #272727;
      --ds-border-strong: #363636;
      --ds-border-focus: #ffffff;
      --ds-action-primary: #f5f5f5;
      --ds-action-primary-hover: #ffffff;
      --ds-accent: #3b82f6;
    }

    /* Reset */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--ds-bg-canvas);
      color: var(--ds-text-primary);
      font-family: var(--ds-font-sans);
      font-size: 16px;
      line-height: var(--ds-leading-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Focus */
    :focus-visible {
      outline: 2px solid var(--ds-border-focus);
      outline-offset: 2px;
      border-radius: var(--ds-radius-xs, 2px);
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <!-- Your content starts here. -->

</body>
</html>
