<!--
Snippet Name: Progressive Image (Blur Up)
Description: Reusable progressive image (blur up) snippet for frontend projects.
Author: DevSnips Contributors
Usage Example: Open `Vanilla/Resources/JavaScript/Helpers/progressive-image-blur-up/Progressive Image (blur-up).html` and copy the snippet into your project.
-->

<img src="low.jpg" data-high="high.jpg" class="progressive" alt="">


<script>
document.querySelectorAll('.progressive').forEach(img=>{const hi=img.dataset.high;const tmp=new Image();tmp.onload=()=>img.src=hi;tmp.src=hi;});
</script>


<style>
.progressive{filter:blur(8px);transition:filter .5s}
.progressive[src$="high.jpg"]{filter:blur(0)}
</style>
