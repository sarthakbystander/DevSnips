  var saved = null; try{ saved = localStorage.getItem("ds-react-theme"); }catch(e){}
  if(!saved){ saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light"; }
  apply(saved);
  document.getElementById("ds-theme-toggle").addEventListener("click", function(){ var cur = root.getAttribute("data-theme") === "dark" ? "light":"dark"; apply(cur); });
})();

function useClickOutside(onClose, active) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!active) return;
    function onDown(e) { if (ref.current && !ref.current.contains(e.target)) onClose(); }
    function onKey(e) { if (e.key === "Escape") onClose(); }
    document.addEventListener("mousedown", onDown);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDown); document.removeEventListener("keydown", onKey); };
  }, [active, onClose]);
  return ref;
}

<script type="text/babel" data-presets="react">
// The component below is the actual code.tsx implementation, transformed to

(function() {
  const {  useId, useRef, useState  } = React;
  function cx(...parts) {
    return parts.filter(Boolean).join(" ");
  }
  const SIZES = {
    sm: "h-8 text-[13px] [&_svg]:size-[14px]",
    md: "h-9 text-sm [&_svg]:size-4",
    lg: "h-11 text-sm [&_svg]:size-[18px]"
  };
  function SegmentedSelect({
    label = "Segment",
    options,
    value,
    defaultValue = "",
    onChange,
    size = "md",
    id,
    name,
    className
  }) {
    const generatedId = useId();
    const groupId = id ?? `segmented-select-${generatedId}`;
    const labelId = `${groupId}-label`;
    const [internalValue, setInternalValue] = useState(defaultValue);
    const selectedValue = value ?? internalValue;
    const selectedIndex = options.findIndex((o) => o.value === selectedValue);
    const refs = useRef([]);
    const [focusedIndex, setFocusedIndex] = useState(() => {
      const sel = options.findIndex((o) => o.value === selectedValue && !o.disabled);
      if (sel >= 0) return sel;
      const enabled = options.findIndex((o) => !o.disabled);
      return enabled === -1 ? 0 : enabled;
    });
    function enabledIndex(start, step) {
      for (let i = 0; i < options.length; i++) {
        const next = (start + step * (i + 1) + options.length) % options.length;
        if (!options[next].disabled) return next;
      }
      return start;
    }
    function choose(option) {
      if (option.disabled) return;
      if (value === undefined) setInternalValue(option.value);
      onChange?.(option.value, option);
    }

      setFocusedIndex(i);

        case "ArrowDown":

        case "ArrowLeft":
        case "ArrowUp":
          event.preventDefault();
          focusSegment(enabledIndex(focusedIndex, -1));
          break;
        case "Home":
          event.preventDefault();
          for (let i = 0; i < options.length; i++) if (!options[i].disabled) {
            focusSegment(i);
            break;
          }
          break;
        case "End":
          event.preventDefault();
          for (let i = options.length - 1; i >= 0; i--) if (!options[i].disabled) {

            break;
          }
          break;
      }

        <span id={labelId} className="mb-2 block text-[13px] font-medium leading-5 text-[var(--ds-color-foreground)]">
          {label}
        </span>
        {name ? <input type="hidden" name={name} value={selectedValue} readOnly /> : null}

              </button>;
    })}
        </div>
      </div>;
  }

})();
